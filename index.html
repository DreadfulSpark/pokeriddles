"595":["Joltik",["▒▒▒▒ latch on to other Pokémon and suck out static electricity. They’re often found sticking to Yamper’s hindquarters.","▒▒▒▒ can be found clinging to other Pokémon. It’s soaking up static electricity because it can’t produce a charge on its own.","They attach themselves to large-bodied Pokémon and absorb static electricity, which they store in an electric pouch."]],"596":["Galvantula",["It lays traps of electrified threads near the nests of bird Pokémon, aiming to snare chicks that are not yet good at flying.","It launches electrified fur from its abdomen as its means of attack. Opponents hit by the fur could be in for three full days and nights of paralysis.","When attacked, they create an electric barrier by spitting out many electrically charged threads."]],"597":["Ferroseed",["Mossy caves are their preferred dwellings. Enzymes contained in mosses help ▒▒▒▒’s spikes grow big and strong.","It defends itself by launching spikes, but its aim isn’t very good at first. Only after a lot of practice will it improve.","It absorbs the iron it finds in the rock while clinging to the ceiling. It shoots spikes when in danger."]],"598":["Ferrothorn",["Its spikes are harder than steel. This Pokémon crawls across rock walls by stabbing the spikes on its feelers into the stone.","This Pokémon scrapes its spikes across rocks, and then uses the tips of its feelers to absorb the nutrients it finds within the stone.","They attach themselves to cave ceilings, firing steel spikes at targets passing beneath them."]],"599":["Klink",["It’s suspected that ▒▒▒▒ were the inspiration behind ancient people’s invention of the first gears.","The two minigears that compose this Pokémon are closer than twins. They mesh well only with each other.","The two minigears that mesh together are predetermined. Each will rebound from other minigears without meshing."]],"600":["Klang",["Many companies in the Galar region choose ▒▒▒▒ as their logo. This Pokémon is considered the symbol of industrial technology.","When ▒▒▒▒ goes all out, the minigear links up perfectly with the outer part of the big gear, and this Pokémon’s rotation speed increases sharply.","A minigear and big gear comprise its body. If the minigear it launches at a foe doesn’t return, it will die."]],"601":["Klinklang",["The three gears that compose this Pokémon spin at high speed. Its new spiked gear isn’t a living creature.","From its spikes, it launches powerful blasts of electricity. Its red core contains an enormous amount of energy.","Its red core functions as an energy tank. It fires the charged energy through its spikes into an area."]],"602":["Tynamo",["One alone can emit only a trickle of electricity, so a group of them gathers to unleash a powerful electric shock.","While one alone doesn’t have much power, a chain of many ▒▒▒▒ can be as powerful as lightning.","These Pokémon move in schools. They have an electricity-generating organ, so they discharge electricity if in danger."]],"603":["Eelektrik",["These Pokémon have a big appetite. When they spot their prey, they attack it and paralyze it with electricity.","It wraps itself around its prey and paralyzes it with electricity from the round spots on its sides. Then it chomps.","They coil around foes and shock them with electricity-generating organs that seem simply to be circular patterns."]],"604":["Eelektross",["They crawl out of the ocean using their arms. They will attack prey on shore and immediately drag it into the ocean.","With their sucker mouths, they suck in prey. Then they use their fangs to shock the prey with electricity.","It latches on to prey with its sucker mouth, sinking in its fangs and shocking the prey with powerful electricity."]],"605":["Elgyem",["This Pokémon was discovered about 50 years ago. Its highly developed brain enables it to exert its psychic powers.","If this Pokémon stands near a TV, strange scenery will appear on the screen. That scenery is said to be from its home.","This Pokémon is shrouded in mystery. It’s said to have appeared from a UFO that fell from the sky about 50 years ago."]],"606":["Beheeyem",["Sometimes found drifting above wheat fields, this Pokémon can control the memories of its opponents.","Whenever a ▒▒▒▒ visits a farm, a Dubwool mysteriously disappears.","It has strong psychic powers. Using its fingers that flash three different colors, it controls its opponents and rewrites their memories."]],"607":["Litwick",["The younger the life this Pokémon absorbs, the brighter and eerier the flame on its head burns.","The flame on its head keeps its body slightly warm. This Pokémon takes lost children by the hand to guide them to the spirit world.","▒▒▒▒ shines a light that absorbs the life energy of people and Pokémon, which becomes the fuel that it burns."]],"608":["Lampent",["It lurks in cities, pretending to be a lamp. Once it finds someone whose death is near, it will trail quietly after them.","This Pokémon appears just before someone passes away, so it’s feared as an emissary of death.","It arrives near the moment of death and steals spirit from the body."]],"609":["Chandelure",["In homes illuminated by ▒▒▒▒ instead of lights, funerals were a constant occurrence— or so it’s said.","This Pokémon haunts dilapidated mansions. It sways its arms to hypnotize opponents with the ominous dancing of its flames.","The spirits burned up in its ominous flame lose their way and wander this world forever."]],"610":["Axew",["They play with each other by knocking their large tusks together. Their tusks break sometimes, but they grow back so quickly that it isn’t a concern.","These Pokémon nest in the ground and use their tusks to crush hard berries. Crushing berries is also how they test each other’s strength.","They mark their territory by leaving gashes in trees with their tusks. If a tusk breaks, a new one grows in quickly."]],"611":["Fraxure",["Its skin is as hard as a suit of armor. ▒▒▒▒’s favorite strategy is to tackle its opponents, stabbing them with its tusks at the same time.","After battle, this Pokémon carefully sharpens its tusks on river rocks. It needs to take care of its tusks—if one breaks, it will never grow back.","A broken tusk will not grow back, so it diligently sharpens its tusks on river rocks after the end of a battle."]],"612":["Haxorus",["While usually kindhearted, it can be terrifying if angered. Tusks that can slice through steel beams are how ▒▒▒▒ deals with its adversaries.","Its resilient tusks are its pride and joy. It licks up dirt to take in the minerals it needs to keep its tusks in top condition.","Their sturdy tusks will stay sharp even if used to cut steel beams. These Pokémon are covered in hard armor."]],"613":["Cubchoo",["It sniffles before performing a move, using its frosty snot to provide an icy element to any move that needs it.","When this Pokémon is in good health, its snot becomes thicker and stickier. It will smear its snot on anyone it doesn’t like.","Their snot is a barometer of health. When healthy, their snot is sticky and the power of their ice moves increases."]],"614":["Beartic",["It swims energetically through frigid seas. When it gets tired, it freezes the seawater with its breath so it can rest on the ice.","It swims through frigid seas, searching for prey. From its frozen breath, it forms icy fangs that are harder than steel.","It freezes its breath to create fangs and claws of ice to fight with. Cold northern areas are its habitat."]],"615":["Cryogonal",["When the weather gets hot, these Pokémon turn into water vapor. ▒▒▒▒ are almost never seen during summer.","With its icy chains, ▒▒▒▒ freezes those it encounters. It then takes its victims away to somewhere unknown.","They are composed of ice crystals. They capture prey with chains of ice, freezing the prey at -148 degrees Fahrenheit."]],"616":["Shelmet",["It has a strange physiology that responds to electricity. When together with Karrablast, ▒▒▒▒ evolves for some reason.","When attacked, it tightly shuts the lid of its shell. This reaction fails to protect it from Karrablast, however, because they can still get into the shell.","It evolves when bathed in an electric-like energy along with Karrablast. The reason is still unknown."]],"617":["Accelgor",["Discarding its shell made it nimble. To keep itself from dehydrating, it wraps its body in bands of membrane.","It moves with blinding speed and lobs poison at foes. Featuring ▒▒▒▒ as a main character is a surefire way to make a movie or comic popular.","When its body dries out, it weakens. So, to prevent dehydration, it wraps itself in many layers of thin membrane."]],"618":["Stunfisk",["For some reason, this Pokémon smiles slightly when it emits a strong electric current from the yellow markings on its body.","Thanks to bacteria that lived in the mud flats with it, this Pokémon developed the organs it uses to generate electricity.","It conceals itself in the mud of the seashore. Then it waits. When prey touch it, it delivers a jolt of electricity."]],"619":["Mienfoo",["Though small, ▒▒▒▒’s temperament is fierce. Any creature that approaches ▒▒▒▒ carelessly will be greeted with a flurry of graceful attacks.","In one minute, a well-trained ▒▒▒▒ can chop with its arms more than 100 times.","They seclude themselves in the mountains and devote themselves to training. The form of their kicks and chops differs from pack to pack."]],"620":["Mienshao",["Delivered at blinding speeds, kicks from this Pokémon can shatter massive boulders into tiny pieces.","When ▒▒▒▒ comes across a truly challenging opponent, it will lighten itself by biting off the fur on its arms.","When ▒▒▒▒ lets out a bizarre wail, you’re in danger. A flurry of kicks and chops too fast to see is about to be unleashed!"]],"621":["Druddigon",["▒▒▒▒ are vicious and cunning. They take up residence in nests dug out by other Pokémon, treating the stolen nests as their own lairs.","▒▒▒▒ lives in caves, but it never skips sunbathing—it won’t be able to move if its body gets too cold.","It infiltrates tunnels that Pokémon like Diglett and Dugtrio have dug and quietly waits for prey to pass through."]],"622":["Golett",["This Pokémon was created from clay. It received orders from its master many thousands of years ago, and it still follows those orders to this day.","They were sculpted from clay in ancient times. No one knows why, but some of them are driven to continually line up boulders.","Although ancient people apparently built it by working with clay, the source of its energy is unclear."]],"623":["Golurk",["There’s a theory that inside ▒▒▒▒ is a perpetual motion machine that produces limitless energy, but this belief hasn’t been proven.","Artillery platforms built into the walls of ancient castles served as perches from which ▒▒▒▒ could fire energy beams.","When the seal on its chest is removed, it rages indiscriminately, turning the whole town around it into a mountain of rubble."]],"624":["Pawniard",["A pack of these Pokémon forms to serve a Bisharp boss. Each ▒▒▒▒ trains diligently, dreaming of one day taking the lead.","It uses river stones to maintain the cutting edges of the blades covering its body. These sharpened blades allow it to bring down opponents.","It follows Bisharp’s orders to a tee when it attacks enemies. After slashing an opponent, ▒▒▒▒ clangs both of its blades together."]],"625":["Bisharp",["Violent conflicts erupt between ▒▒▒▒ and Fraxure over places where sharpening stones can be found.","It’s accompanied by a large retinue of Pawniard. ▒▒▒▒ keeps a keen eye on its minions, ensuring none of them even think of double-crossing it.","It leads a group of Pawniard. ▒▒▒▒ doesn’t even change its expression when it deals the finishing blow to an opponent."]],"626":["Bouffalant",["These Pokémon live in herds of about 20 individuals. ▒▒▒▒ that betray the herd will lose the hair on their heads for some reason.","These Pokémon can crush a car with no more than a headbutt. ▒▒▒▒ with more hair on their heads hold higher positions within the herd.","Their fluffy fur absorbs damage, even if they strike foes with a fierce headbutt."]],"627":["Rufflet",["Its chick-like looks belie its hotheadedness. It challenges its parents at every opportunity, desperate to prove its strength.","A combative Pokémon, it’s ready to pick a fight with anyone. It has talons that can crush hard berries.","If it spies a strong Pokémon, ▒▒▒▒ can’t resist challenging it to a battle. But if ▒▒▒▒ loses, it starts bawling."]],"628":["Braviary",["Because this Pokémon is hotheaded and belligerent, it’s Corviknight that’s taken the role of transportation in Galar.","Known for its bravery and pride, this majestic Pokémon is often seen as a motif for various kinds of emblems.","Known as “the hero of the skies,” this Pokémon is so proud and so brave that it will never retreat, even when it’s injured."]],"629":["Vullaby",["▒▒▒▒ grow quickly. Bones that have gotten too small for older ▒▒▒▒ to wear often get passed down to younger ones in the nest.","It wears a bone to protect its rear. It often squabbles with others of its kind over particularly comfy bones.","Its healthy appetite leads to visible growth spurts. It often has to replace the bones it wears as its size increases."]],"630":["Mandibuzz",["They adorn themselves with bones. There seem to be fashion trends among them, as different bones come into and fall out of popularity.","Although it’s a bit of a ruffian, this Pokémon will take lost Vullaby under its wing and care for them till they’re ready to leave the nest.","It’s always searching for food for Vullaby. When it finds a weak Pokémon, ▒▒▒▒ swoops it right off to its nest."]],"631":["Heatmor",["A flame serves as its tongue, melting through the hard shell of Durant so that ▒▒▒▒ can devour their insides.","There’s a hole in its tail that allows it to draw in the air it needs to keep its fire burning. If the hole gets blocked, this Pokémon will fall ill.","It draws in air through its tail, transforms it into fire, and uses it like a tongue. It melts Durant and eats them."]],"632":["Durant",["With their large mandibles, these Pokémon can crunch their way through rock. They work together to protect their eggs from Sandaconda.","They lay their eggs deep inside their nests. When attacked by Heatmor, they retaliate using their massive mandibles.","They attack in groups, covering themselves in steel armor to protect themselves from Heatmor."]],"633":["Deino",["Because it can’t see, this Pokémon is constantly biting at everything it touches, trying to keep track of its surroundings.","When it encounters something, its first urge is usually to bite it. If it likes what it tastes, it will commit the associated scent to memory.","Lacking sight, it’s unaware of its surroundings, so it bumps into things and eats anything that moves."]],"634":["Zweilous",["Their two heads will fight each other over a single piece of food. ▒▒▒▒ are covered in scars even without battling others.","While hunting for prey, ▒▒▒▒ wanders its territory, its two heads often bickering over which way to go.","After it has eaten up all the food in its territory, it moves to another area. Its two heads do not get along."]],"635":["Hydreigon",["The three heads take turns sinking their teeth into the opponent. Their attacks won’t slow until their target goes down.","There are a slew of stories about villages that were destroyed by ▒▒▒▒. It bites anything that moves.","It responds to movement by attacking. This scary, three-headed Pokémon devours everything in its path!"]],"636":["Larvesta",["▒▒▒▒’s body is warm all over. It spouts fire from the tips of its horns to intimidate predators and scare prey.","The people of ancient times believed that ▒▒▒▒ fell from the sun.","It protects itself with flame. Long years ago, people believed ▒▒▒▒ had a nest on the sun."]],"637":["Volcarona",["This Pokémon emerges from a cocoon formed of raging flames. Ancient murals depict ▒▒▒▒ as a deity of fire.","▒▒▒▒ scatters burning scales. Some say it does this to start fires. Others say it’s trying to rescue those that suffer in the cold.","According to legends, it was hatched from a flaming cocoon to save people and Pokémon that were suffering from the cold."]],"638":["Cobalion",["From the moment it’s born, this Pokémon radiates the air of a leader. Its presence will calm even vicious foes.","This Pokémon appears in a legend alongside Terrakion and Virizion, fighting against humans in defense of the Unova region’s Pokémon.","It has a body and heart of steel. It worked with its allies to punish people when they hurt Pokémon."]],"639":["Terrakion",["In Unovan legend, ▒▒▒▒ battled against humans in an effort to protect other Pokémon.","It has phenomenal power. It will mercilessly crush anyone or anything that bullies small Pokémon.","Spoken of in legend, this Pokémon used its phenomenal power to destroy a castle in its effort to protect Pokémon."]],"640":["Virizion",["It darts around opponents with a flurry of quick movements, slicing them up with its horns.","A legend tells of this Pokémon working together with Cobalion and Terrakion to protect the Pokémon of the Unova region.","Legends say this Pokémon confounded opponents with its swift movements."]],"641":["Tornadus",["This storm-stirring Pokémon is said to cause the seasons to turn by whipping up the air. I suspect its humanlike form to be a false one.","▒▒▒▒ expels massive energy from its tail, causing severe storms. Its power is great enough to blow houses away.","The lower half of its body is wrapped in a cloud of energy. It zooms through the sky at 200 mph."]],"642":["Thundurus",["They say this wielder of electricity has waged war with its nemesis, Tornadus, since time immemorial. The lightning bolts it hurls pierce the very earth and enrich the soil.","As it flies around, it shoots lightning all over the place and causes forest fires. It is therefore disliked.","The spikes on its tail discharge immense bolts of lightning. It flies around the Unova region firing off lightning bolts."]],"643":["Reshiram",["According to myth, if people ignore truth and let themselves become consumed by greed, ▒▒▒▒ will arrive to burn their kingdoms down.","Flames spew from its tail as it flies through the sky like a jet airplane. It’s said that this Pokémon will scorch the world.","When ▒▒▒▒’s tail flares, the heat energy moves the atmosphere and changes the world’s weather."]],"644":["Zekrom",["Mythology tells us that if people lose the righteousness in their hearts, their kingdoms will be razed by ▒▒▒▒’s lightning.","When the interior part of its tail spins like a motor, ▒▒▒▒ can generate many bolts of lightning to blast its surroundings.","Concealing itself in lightning clouds, it flies throughout the Unova region. It creates electricity in its tail."]],"645":["Landorus",["From the forces of lightning and wind, it creates energy to give nutrients to the soil and make the land abundant.","Lands visited by ▒▒▒▒ grant such bountiful crops that it has been hailed as “The Guardian of the Fields.”","The energy that comes pouring from its tail increases the nutrition in the soil, making crops grow to great size."]],"646":["Kyurem",["It appears that this Pokémon uses its powers over ice to freeze its own body in order to stabilize its cellular structure.","Dwelling within it is a power even greater than that of Reshiram or Zekrom, but the extreme cold keeps that power bound.","It generates a powerful, freezing energy inside itself, but its body became frozen when the energy leaked out."]],"647":["Keldeo",["They say that ▒▒▒▒ must survive harsh battles and fully develop the horn on its forehead before this Pokémon’s true power will awaken.","Cobalion, Terrakion, and Virizion taught this Pokémon how to fight. It dashes across the world, seeking more opportunities to further its training.","When it is resolute, its body fills with power and it becomes swifter. Its jumps are then too fast to follow."]],"648":["Meloetta",["Its melodies are sung with a special vocalization method that can control the feelings of those who hear it.","The melodies sung by ▒▒▒▒ have the power to make Pokémon that hear them happy or sad.","Many famous songs have been inspired by the melodies that ▒▒▒▒ plays."]],"649":["Genesect",["This Pokémon existed 300 million years ago. Team Plasma altered it and attached a cannon to its back.","This ancient bug Pokémon was altered by Team Plasma. They upgraded the cannon on its back.","Over 300 million years ago, it was feared as the strongest of hunters. It has been modified by Team Plasma."]],"650":["Chespin",["Such a thick shell of wood covers its head and back that even a direct hit from a truck wouldn’t faze it.","The quills on its head are usually soft. When it flexes them, the points become so hard and sharp that they can pierce rock."]],"651":["Quilladin",["They strengthen their lower bodies by running into one another. They are very kind and won’t start fights.","It relies on its sturdy shell to deflect predators’ attacks. It counterattacks with its sharp quills."]],"652":["Chesnaught",["When it takes a defensive posture with its fists guarding its face, it could withstand a bomb blast.","Its Tackle is forceful enough to flip a 50-ton tank. It shields its allies from danger with its own body."]],"653":["Fennekin",["As it walks, it munches on a twig in place of a snack. It intimidates opponents by puffing hot air out of its ears.","Eating a twig fills it with energy, and its roomy ears give vent to air hotter than 390 degrees Fahrenheit."]],"654":["Braixen",["When the twig is plucked from its tail, friction sets the twig alight. The flame is used to send signals to its allies.","It has a twig stuck in its tail. With friction from its tail fur, it sets the twig on fire and launches into battle."]],"655":["Delphox",["Using psychic power, it generates a fiery vortex of 5,400 degrees Fahrenheit, incinerating foes swept into this whirl of flame.","It gazes into the flame at the tip of its branch to achieve a focused state, which allows it to see into the future."]],"656":["Froakie",["It protects its skin by covering its body in delicate bubbles. Beneath its happy-go-lucky air, it keeps a watchful eye on its surroundings.","It secretes flexible bubbles from its chest and back. The bubbles reduce the damage it would otherwise take when attacked."]],"657":["Frogadier",["Its swiftness is unparalleled. It can scale a tower of more than 2,000 feet in a minute’s time.","It can throw bubble-covered pebbles with precise control, hitting empty cans up to a hundred feet away."]],"658":["Greninja",["It appears and vanishes with a ninja’s grace. It toys with its enemies using swift movements, while slicing them with throwing stars of sharpest water.","It creates throwing stars out of compressed water. When it spins them and throws them at high speed, these stars can split metal in two."]],"659":["Bunnelby",["It’s very sensitive to danger. The sound of Corviknight’s flapping will have ▒▒▒▒ digging a hole to hide underground in moments.","It excels at digging holes. Using its ears, it can dig a nest 33 feet deep in one night.","It has ears like shovels. Digging holes strengthens its ears so much that they can sever thick roots effortlessly."]],"660":["Diggersby",["The fur on its belly retains heat exceptionally well. People used to make heavy winter clothing from fur shed by this Pokémon.","With power equal to an excavator, it can dig through dense bedrock. It’s a huge help during tunnel construction.","As powerful as an excavator, its ears can reduce dense bedrock to rubble. When it’s finished digging, it lounges lazily."]],"661":["Fletchling",["When this Pokémon gets excited, its body temperature increases sharply. If you touch a ▒▒▒▒ with bare hands, you might get burned.","Its melodious cries are actually warnings. ▒▒▒▒ will mercilessly peck at anything that enters its territory.","Its body is always warm. Trainers who live in cold areas apparently sleep with it in their bed."]],"662":["Fletchinder",["▒▒▒▒ are exceedingly territorial and aggressive. These Pokémon fight among themselves over feeding grounds.","▒▒▒▒ launches embers into the den of its prey. When the prey comes leaping out, ▒▒▒▒’s sharp talons finish it off.","Its speed right after takeoff already puts it in the top speed class of all bird Pokémon."]],"663":["Talonflame",["▒▒▒▒ dives toward prey at speeds of up to 310 mph and assaults them with powerful kicks, giving the prey no chance to escape.","▒▒▒▒ mainly preys upon other bird Pokémon. To intimidate opponents, it sends embers spewing from gaps between its feathers.","Bird Pokémon make up most of its diet. It approaches at high speeds and smacks them down to the ground with its powerful kick."]],"664":["Scatterbug",["The powder that covers its body regulates its temperature, so it can live in any region or climate.","When under attack from bird Pokémon, it spews a poisonous black powder that causes paralysis on contact."]],"665":["Spewpa",["The beaks of bird Pokémon can’t begin to scratch its stalwart body. To defend itself, it spews powder.","It lives hidden within thicket shadows. When predators attack, it quickly bristles the fur covering its body in an effort to threaten them."]],"666":["Vivillon",["The patterns on this Pokémon’s wings depend on the climate and topography of its habitat. It scatters colorful scales.","▒▒▒▒ with many different patterns are found all over the world. These patterns are affected by the climate of their habitat."]],"667":["Litleo",["This hot-blooded Pokémon is filled with curiosity. When it gets angry or starts fighting, its short mane gets hot.","When they’re young, they live with a pride. Once they’re able to hunt prey on their own, they’re kicked out and have to make their own way.","They set off on their own from their pride and live by themselves to become stronger. These hot-blooded Pokémon are quick to fight."]],"668":["Pyroar",["The temperature of its breath is over 10,000 degrees Fahrenheit, but ▒▒▒▒ doesn’t use it on its prey. This Pokémon prefers to eat raw meat.","The males are usually lazy, but when attacked by a strong foe, a male will protect its friends with no regard for its own safety.","With fiery breath of more than 10,000 degrees Fahrenheit, they viciously threaten any challenger. The females protect the pride’s cubs."]],"669":["Flabébé",["▒▒▒▒ wears a crown made from pollen it’s collected from its flower. The crown has hidden healing properties.","It’s not safe without the power of a flower, but it will keep traveling around until it finds one with the color and shape it wants.","When it finds a flower it likes, it dwells on that flower its whole life long. It floats in the wind’s embrace with an untroubled heart."]],"670":["Floette",["It gives its own power to flowers, pouring its heart into caring for them. ▒▒▒▒ never forgives anyone who messes up a flower bed.","It raises flowers and uses them as weapons. The more gorgeous the blossom, the more power it contains.","When the flowers of a well-tended flower bed bloom, it appears and celebrates with an elegant dance."]],"671":["Florges",["Its life can span several hundred years. It’s said to devote its entire life to protecting gardens.","It controls the flowers it grows. The petal blizzards that ▒▒▒▒ triggers are overwhelming in their beauty and power.","In times long past, governors of castles would invite ▒▒▒▒ to create flower gardens to embellish the castle domains."]],"672":["Skiddo",["If it has sunshine and water, it doesn’t need to eat, because it can generate energy from the leaves on its back.","Thought to be one of the first Pokémon to live in harmony with humans, it has a placid disposition."]],"673":["Gogoat",["They inhabit mountainous regions. The leader of the herd is decided by a battle of clashing horns.","It can tell how its Trainer is feeling by subtle shifts in the grip on its horns. This empathic sense lets them run as if one being."]],"674":["Pancham",["Wanting to make sure it’s taken seriously, ▒▒▒▒’s always giving others a glare. But if it’s not focusing, it ends up smiling.","It chooses a Pangoro as its master and then imitates its master’s actions. This is how it learns to battle and hunt for prey.","It’s desperate to intimidate its opponents. Be nice and pretend to be scared if you catch it glaring at you intensely."]],"675":["Pangoro",["Using its leaf, ▒▒▒▒ can predict the moves of its opponents. It strikes with punches that can turn a dump truck into scrap with just one hit.","This Pokémon is quick to anger, and it has no problem using its prodigious strength to get its way. It lives for duels against Obstagoon.","▒▒▒▒ is the type to talk with its fists. It doesn’t say much as it pummels opponents with enough force to send a dump truck flying."]],"676":["Furfrou",["Left alone, its fur will grow longer and longer, but it will only allow someone it trusts to cut it.","There was an era when aristocrats would compete to see who could trim their ▒▒▒▒’s fur into the most exquisite style.","Historically, in the Kalos region, these Pokémon were the designated guardians of the king."]],"677":["Espurr",["There’s enough psychic power in ▒▒▒▒ to send a wrestler flying, but because this power can’t be controlled, ▒▒▒▒ finds it troublesome.","Though ▒▒▒▒’s expression never changes, behind that blank stare is an intense struggle to contain its devastating psychic power.","It has enough psychic energy to blast everything within 300 feet of itself, but it has no control over its power."]],"678":["Meowstic",["The defensive instinct of the males is strong. It’s when they’re protecting themselves or their partners that they unleash their full power.","Revealing the eyelike patterns on the insides of its ears will unleash its psychic powers. It normally keeps the patterns hidden, however.","The eyeball patterns on the interior of its ears emit psychic energy. It keeps the patterns tightly covered because that power is too immense."]],"679":["Honedge",["The blue eye on the sword’s handguard is the true body of ▒▒▒▒. With its old cloth, it drains people’s lives away.","▒▒▒▒’s soul once belonged to a person who was killed a long time ago by the sword that makes up ▒▒▒▒’s body.","If anyone dares to grab its hilt, it wraps a blue cloth around that person’s arm and drains that person’s life energy completely."]],"680":["Doublade",["The two swords employ a strategy of rapidly alternating between offense and defense to bring down their prey.","Honedge evolves into twins. The two blades rub together to emit a metallic sound that unnerves opponents.","The complex attack patterns of its two swords are unstoppable, even for an opponent greatly accomplished at swordplay."]],"681":["Aegislash",["Its potent spectral powers allow it to manipulate others. It once used its powers to force people and Pokémon to build a kingdom to its liking.","In this defensive stance, ▒▒▒▒ uses its steel body and a force field of spectral power to reduce the damage of any attack.","Apparently, it can detect the innate qualities of leadership. According to legend, whoever it recognizes is destined to become king."]],"682":["Spritzee",["The scent its body gives off enraptures those who smell it. Noble ladies had no shortage of love for ▒▒▒▒.","A scent pouch within this Pokémon’s body allows it to create various scents. A change in its diet will alter the fragrance it produces.","In the past, rather than using perfume, royal ladies carried a ▒▒▒▒ that would waft a fragrance they liked."]],"683":["Aromatisse",["The scents ▒▒▒▒ can produce range from sweet smells that bolster allies to foul smells that sap an opponent’s will to fight.","The scent that constantly emits from its fur is so powerful that this Pokémon’s companions will eventually lose their sense of smell.","Its scent is so overpowering that, unless a Trainer happens to really enjoy the smell, he or she will have a hard time walking alongside it."]],"684":["Swirlix",["The sweet smell of cotton candy perfumes ▒▒▒▒’s fluffy fur. This Pokémon spits out sticky string to tangle up its enemies.","It eats its own weight in sugar every day. If it doesn’t get enough sugar, it becomes incredibly grumpy.","Because it eats nothing but sweets, its fur is as sticky sweet as cotton candy."]],"685":["Slurpuff",["▒▒▒▒’s fur contains a lot of air, making it soft to the touch and lighter than it looks.","By taking in a person’s scent, it can sniff out their mental and physical condition. It’s hoped that this skill will have many medical applications.","Its sense of smell is 100 million times better than a human’s, so even the faintest scent tells it about everything in the area. It’s like it can see with its nose!"]],"686":["Inkay",["By exposing foes to the blinking of its luminescent spots, ▒▒▒▒ demoralizes them, and then it seizes the chance to flee.","It spins while making its luminescent spots flash. These spots allow it to communicate with others by using different patterns of light.","When exchanging information with others of its kind, it flashes the light-emitting spots on its body in a complex rhythm."]],"687":["Malamar",["It’s said that ▒▒▒▒’s hypnotic powers played a role in certain history-changing events.","Gazing at its luminescent spots will quickly induce a hypnotic state, putting the observer under ▒▒▒▒’s control.","It flashes the pattern on its torso to control its prey and draw them in. The edges of its fins are supremely sharp."]],"688":["Binacle",["If the two don’t work well together, both their offense and defense fall apart. Without good teamwork, they won’t survive.","After two ▒▒▒▒ find a suitably sized rock, they adhere themselves to it and live together. They cooperate to gather food during high tide.","They stretch and then contract, yanking their rocks along with them in bold hops. They eat seaweed that washes up on the shoreline."]],"689":["Barbaracle",["Having an eye on each palm allows it to keep watch in all directions. In a pinch, its limbs start to act on their own to ensure the enemy’s defeat.","Seven Binacle come together to form one ▒▒▒▒. The Binacle that serves as the head gives orders to those serving as the limbs.","▒▒▒▒’s legs and hands have minds of their own, and they will move independently. But they usually follow the head’s orders."]],"690":["Skrelp",["▒▒▒▒ looks like a piece of rotten seaweed, so it can blend in with seaweed drifting on the ocean and avoid being detected by enemies.","It drifts in the ocean, blending in with floating seaweed. When other Pokémon come to feast on the seaweed, ▒▒▒▒ feasts on them instead.","It’s not good at swimming, so it clings to the seaweed. In the Alola region, it’s often found near Dhelmise."]],"691":["Dragalge",["▒▒▒▒ generates dragon energy by sticking the plume on its head out above the ocean’s surface and bathing it in sunlight.","▒▒▒▒ uses a poisonous liquid capable of corroding metal to send tankers that enter its territory to the bottom of the sea.","It blends in with seaweed to ambush its prey and then takes them down with a poisonous liquid strong enough to melt metal."]],"692":["Clauncher",["By detonating gas that accumulates in its right claw, this Pokémon launches water like a bullet. This is how ▒▒▒▒ defeats its enemies.","▒▒▒▒’s claws can fall off during battle, but they’ll regenerate. The meat inside the claws is popular as a delicacy in Galar.","It moves around by jetting water from its right pincer. It has a poor sense of balance, so it’s terrible at swimming straight."]],"693":["Clawitzer",["▒▒▒▒’s right arm is a cannon that launches projectiles made of seawater. Shots from a ▒▒▒▒’s cannon arm can sink a tanker.","After using the feelers on its oversized claw to detect the location of prey, ▒▒▒▒ launches a cannonball of water at its target.","Its right arm is packed with meat. When its pincer falls off, it’s exported to be used as a cooking ingredient."]],"694":["Helioptile",["The sun powers this Pokémon’s electricity generation. Interruption of that process stresses ▒▒▒▒ to the point of weakness.","When spread, the frills on its head act like solar panels, generating the power behind this Pokémon’s electric moves.","The frills on either side of its head have cells that generate electricity when exposed to sunlight."]],"695":["Heliolisk",["One ▒▒▒▒ basking in the sun with its frill outspread is all it would take to produce enough electricity to power a city.","A now-vanished desert culture treasured these Pokémon. Appropriately, when ▒▒▒▒ came to the Galar region, treasure came with them.","It stimulates its muscles with electricity, boosting the strength in its legs and enabling it to run 100 yards in five seconds."]],"696":["Tyrunt",["This Pokémon is selfish and likes to be pampered. It can also inflict grievous wounds on its Trainer just by playing around.","This is an ancient Pokémon, revived in modern times. It has a violent disposition, and it’ll tear apart anything it gets between its hefty jaws.","▒▒▒▒ is spoiled and selfish. It may just be trying to frolic, but sometimes the ones it’s trying to frolic with are gravely injured."]],"697":["Tyrantrum",["A single bite of ▒▒▒▒’s massive jaws will demolish a car. This Pokémon was the king of the ancient world.","This Pokémon is from about 100,000,000 years ago. It has the presence of a king, vicious but magnificent.","The king of the ancient world, it can easily crunch a car with the devastating strength of its enormous jaws."]],"698":["Amaura",["▒▒▒▒ is an ancient Pokémon that has gone extinct. Specimens of this species can sometimes be found frozen in ice.","This Pokémon was successfully restored from a fossil. In the past, it lived with others of its kind in cold lands where there were fewer predators.","▒▒▒▒ was restored successfully, but it’s not expected to live long because of the heat of the current environment."]],"699":["Aurorus",["When gripped by rage, ▒▒▒▒ will emanate freezing air, covering everything around it in ice.","▒▒▒▒ was restored from a fossil. It’s said that when this Pokémon howls, auroras appear in the night sky.","This usually quiet and kindly Pokémon has a surface temperature of around –240 degrees Fahrenheit."]],"700":["Sylveon",["It emits a soothing aura from its ribbon-shaped organs. It wraps these appendages around quarrelers to instantly restore calm to the situation.","There’s a Galarian fairy tale that describes a beautiful ▒▒▒▒ vanquishing a dreadful dragon Pokémon.","By releasing enmity-erasing waves from its ribbonlike feelers, ▒▒▒▒ stops any conflict."]],"701":["Hawlucha",["It always strikes a pose before going for its finishing move. Sometimes opponents take advantage of that time to counterattack.","It drives its opponents to exhaustion with its agile maneuvers, then ends the fight with a flashy finishing move.","In combat, ▒▒▒▒ leaps nimbly about, taking advantage of its opponents’ blind spots. It’s also skilled at using superb submission holds."]],"702":["Dedenne",["Since ▒▒▒▒ can’t generate much electricity on its own, it steals electricity from outlets or other electric Pokémon.","A ▒▒▒▒’s whiskers pick up electrical waves other ▒▒▒▒ send out. These Pokémon share locations of food or electricity with one another.","Its upper whiskers are sensors that survey its surroundings. Its lower whiskers are organs that shoot electricity."]],"703":["Carbink",["It’s said that somewhere in the world, there’s a mineral vein housing a large pack of slumbering ▒▒▒▒. It’s also said that this pack has a queen.","When beset by attackers, ▒▒▒▒ wipes them all out by firing high-energy beams from the gems embedded in its body.","To keep the jewels on their bodies free of tarnish, packs of ▒▒▒▒ use their soft manes to polish one another’s jewels."]],"704":["Goomy",["▒▒▒▒ hides away in the shade of trees, where it's nice and humid. If the slime coating its body dries out, the Pokémon instantly becomes lethargic.","Their horns are powerful sensors. As soon as ▒▒▒▒ pick up any sign of enemies, they go into hiding. This is how they’ve survived.","Because most of its body is water, it will dry up if the weather becomes too arid. It’s considered the weakest dragon Pokémon."]],"705":["Sliggoo",["A creature given to melancholy. I suspect its metallic shell developed as a result of the mucus on its skin reacting with the iron in Hisui's water.","The lump on its back contains its tiny brain. It thinks only of food and escaping its enemies.","Although this Pokémon isn’t very strong, its body is coated in a caustic slime that can melt through anything, so predators steer clear of it."]],"706":["Goodra",["Able to freely control the hardness of its metallic shell. It loathes solitude and is extremely clingy—it will fume and run riot if those dearest to it ever leave its side.","Its form of offense is forcefully stretching out its horns. The strikes land 100 times harder than any blow from a heavyweight boxer.","Sometimes it misunderstands instructions and appears dazed or bewildered. Many Trainers don’t mind, finding this behavior to be adorable."]],"707":["Klefki",["▒▒▒▒ sucks in metal ions with the horn topping its head. It seems this Pokémon loves keys so much that its head needed to look like one, too.","This Pokémon is constantly collecting keys. Entrust a ▒▒▒▒ with important keys, and the Pokémon will protect them no matter what.","Long ago it lived in mines, but once the minerals that make up its diet became scarcer, ▒▒▒▒ began appearing in human settlements."]],"708":["Phantump",["With a voice like a human child’s, it cries out to lure adults deep into the forest, getting them lost among the trees.","After a lost child perished in the forest, their spirit possessed a tree stump, causing the spirit’s rebirth as this Pokémon.","An unknown spirit came to lodge in a tree stump, creating this Pokémon. A cure-all can be made from an infusion of its green leaves."]],"709":["Trevenant",["Small roots that extend from the tips of this Pokémon’s feet can tie into the trees of the forest and give ▒▒▒▒ control over them.","People fear it due to a belief that it devours any who try to cut down trees in its forest, but to the Pokémon it shares its woods with, it’s kind.","This Pokémon controls trees via roots stretching from its feet, and it will attack anyone that dares to ravage the forest."]],"710":["Pumpkaboo",["The light that streams out from the holes in the pumpkin can hypnotize and control the people and Pokémon that see it.","Spirits that wander this world are placed into ▒▒▒▒’s body. They’re then moved on to the afterlife.","It is said to carry wandering spirits to the place where they belong so they can move on."]],"711":["Gourgeist",["In the darkness of a new-moon night, ▒▒▒▒ will come knocking. Whoever answers the door will be swept off to the afterlife.","Eerie cries emanate from its body in the dead of night. The sounds are said to be the wails of spirits who are suffering in the afterlife.","It enwraps its prey in its hairlike arms. It sings joyfully as it observes the suffering of its prey."]],"712":["Bergmite",["Lives on mountains blanketed in perennial snow. It freezes water vapor in the air to make the ice helmet that it dons for defense.","This Pokémon lives in areas of frigid cold. It secures itself to the back of an Avalugg by freezing its feet in place.","They chill the air around them to −150 degrees Fahrenheit, freezing the water in the air into ice that they use as armor."]],"713":["Avalugg",["The armor of ice covering its lower jaw puts steel to shame and can shatter rocks with ease. This Pokémon barrels along steep mountain paths, cleaving through the deep snow.","As ▒▒▒▒ moves about during the day, the cracks in its body deepen. The Pokémon’s body returns to a pristine state overnight.","At high latitudes, this Pokémon can be found with clusters of Bergmite on its back as it swims among the icebergs."]],"714":["Noibat",["No wavelength of sound is beyond ▒▒▒▒’s ability to produce. The ultrasonic waves it generates can overcome much larger Pokémon.","After nightfall, they emerge from the caves they nest in during the day. Using their ultrasonic waves, they go on the hunt for ripened fruit.","It flies around in search of fruit to eat. It uses ultrasonic waves to detect which fruits are ripe."]],"715":["Noivern",["Flying through the darkness, it weakens enemies with ultrasonic waves that could crush stone. Its fangs finish the fight.","Aggressive and cruel, this Pokémon will ruthlessly torment enemies that are helpless in the dark.","This hot-blooded Pokémon attacks anything it sees with ultrasonic waves that can crush boulders."]],"716":["Xerneas",["When the horns on its head shine in seven colors, it is said to be sharing everlasting life.","Legends say it can share eternal life. It slept for a thousand years in the form of a tree before its revival."]],"717":["Yveltal",["When its life comes to an end, it absorbs the life energy of every living thing and turns into a cocoon once more.","When this legendary Pokémon’s wings and tail feathers spread wide and glow red, it absorbs the life force of living creatures."]],"718":["Zygarde",["Some say it can change to an even more powerful form when battling those who threaten the ecosystem.","This is ▒▒▒▒’s form when about half of its pieces have been assembled. It plays the role of monitoring the ecosystem.","It’s thought to be monitoring the ecosystem. There are rumors that even greater power lies hidden within it."]],"719":["Diancie",["It can instantly create many diamonds by compressing the carbon in the air between its hands.","A sudden transformation of Carbink, its pink, glimmering body is said to be the loveliest sight in the whole world."]],"720":["Hoopa",["It is said to be able to seize anything it desires with its six rings and six huge arms. With its power sealed, it is transformed into a much smaller form.","In its true form, it possess a huge amount of power. Legends of its avarice tell how it once carried off an entire castle to gain the treasure hidden within.","It gathers things it likes and passes them through its loop to teleport them to a secret place."]],"721":["Volcanion",["It expels its internal steam from the arms on its back. It has enough power to blow away a mountain.","It lets out billows of steam and disappears into the dense fog. It’s said to live in mountains where humans do not tread."]],"722":["Rowlet",["Flies noiselessly on delicate wings. It has mastered the art of deftly launching dagger-sharp feathers from those same wings.","During the day, it builds up energy via photosynthesis. At night, it flies silently through the sky, on the prowl for prey.","At a distance, it launches its sharp feathers while flying about. If the enemy gets too close, ▒▒▒▒ switches tactics and delivers vicious kicks."]],"723":["Dartrix",["Regularly basks in sunlight to gather power—presumably due to the frigid climate. Nonetheless, the edges of the blade quills set into its wings are keen as ever.","It never slacks when it comes to the task of cleaning its feathers. Thorough preening keeps it looking spiffy and its blade quills nice and sharp.","It throws one knifelike feather after another at its enemies, and each one precisely strikes a weak point. These feathers are known as blade quills."]],"724":["Decidueye",["The air stored inside the rachises of ▒▒▒▒'s feathers insulates the Pokémon against Hisui's extreme cold. This is firm proof that evolution can be influenced by environment.","In a tenth of a second, it can nock and fire an arrow quill, piercing an opponent’s weak point before they notice what’s happening.","As if wielding a bow, it launches the arrow quills hidden among the feathers of its wings. ▒▒▒▒’s shots never miss."]],"725":["Litten",["Trying to pet ▒▒▒▒ before it trusts you will result in a nasty scratch from its sharp claws. Be careful.","It spends even the smallest amount of downtime grooming its fur with its tongue. Loose fur gathers in its stomach and serves as fuel for fiery moves.","Its coat regrows twice a year. When the time comes, ▒▒▒▒ sets its own body on fire and burns away the old fur."]],"726":["Torracat",["When facing a powerful enemy, ▒▒▒▒’s fighting spirit gets pumped up, and its fire bell blazes hotter.","In the midst of battle, the fire pouch on ▒▒▒▒’s neck rings like a bell and produces stronger flames than usual.","When its mane is standing on end, you can tell it’s feeling good. When it isn’t feeling well, its fur will lie down flat."]],"727":["Incineroar",["▒▒▒▒’s rough and aggressive behavior is its most notable trait, but the way it helps out small Pokémon shows that it has a kind side as well.","It excels at violent, no-holds-barred battles. The temperature of the flames that issue from its navel exceeds 3,600 degrees Fahrenheit.","When its fighting spirit is set alight, the flames around its waist become especially intense."]],"728":["Popplio",["If ▒▒▒▒ want to create big, powerful balloons, they must be persistent. It takes daily practice for these Pokémon to develop their skills.","It creates special bouncy balloons to send at its opponents. When the balloons pop, the sheer force of their bursting is what deals damage.","▒▒▒▒ gets on top of its bouncy water balloons to jump higher. It’s quite the acrobatic fighter!"]],"729":["Brionne",["On nights when the sea is calm, ▒▒▒▒ dance with one another to the singing of the Primarina that’s leading them.","As if dancing, it artfully dodges the attacks of its enemies. All the while, it’s busy forming a bunch of balloons to overwhelm its foes.","It attacks by smacking its enemies with the exploding water balloons that it creates."]],"730":["Primarina",["For ▒▒▒▒, every battle’s a stage. Its singing and the dancing of its balloons will mesmerize the audience.","With its mouth, it makes sonic waves that sound like beautiful singing. It uses the sonic waves to control its water balloons.","Also known as a songstress, it has a fantastical look on moonlit nights when it leads its colony in song."]],"731":["Pikipek",["It may look spindly, but its neck muscles are heavy-duty. It can peck at a tree 16 times per second!","It pecks at trees with its hard beak. You can get some idea of its mood or condition from the rhythm of its pecking.","This Pokémon feeds on berries, whose leftover seeds become the ammunition for the attacks it fires off from its mouth."]],"732":["Trumbeak",["From its mouth, it fires the seeds of berries it has eaten. The scattered seeds give rise to new plants.","It can bend the tip of its beak to produce over a hundred different cries at will.","By bending its beak, it can produce a variety of calls and brand itself a noisy nuisance for its neighbors."]],"733":["Toucannon",["Known for forming harmonious couples, this Pokémon is brought to wedding ceremonies as a good luck charm.","They smack beaks with others of their kind to communicate. The strength and number of hits tell each other how they feel.","Within its beak, its internal gas ignites, explosively launching seeds with enough power to pulverize boulders."]],"734":["Yungoos",["Although it will eat anything, it prefers fresh living things, so it marches down streets in search of prey.","Its stomach takes up most of its long torso. It’s a big eater, so the amount Trainers have to spend on its food is no laughing matter.","It wanders around in a never-ending search for food. At dusk, it collapses from exhaustion and falls asleep on the spot."]],"735":["Gumshoos",["Patient by nature, this Pokémon loses control of itself and pounces when it spots its favorite meal—Rattata!","Although it wasn’t originally found in Alola, this Pokémon was brought over a long time ago when there was a huge Rattata outbreak.","It adores having Rattata and Raticate for dinner, but as it’s diurnal, it never encounters them. This Pokémon boasts incredible patience."]],"736":["Grubbin",["It uses its big jaws to dig nests into the forest floor, and it loves to feed on sweet tree sap.","Its natural enemies, like Rookidee, may flee rather than risk getting caught in its large mandibles that can snap thick tree branches.","It spits a sticky thread to stop opponents in their tracks, and then it grabs them in its sharp, sturdy mandibles to take them down."]],"737":["Charjabug",["Its digestive processes convert the leaves it eats into electricity. An electric sac in its belly stores the electricity for later use.","While its durable shell protects it from attacks, ▒▒▒▒ strikes at enemies with jolts of electricity discharged from the tips of its jaws.","Its stout shell provides excellent defense from attacks. It uses electricity on persistent opponents."]],"738":["Vikavolt",["If it carries a Charjabug to use as a spare battery, a flying ▒▒▒▒ can rapidly fire high-powered beams of electricity.","It builds up electricity in its abdomen, focuses it through its jaws, and then fires the electricity off in concentrated beams.","▒▒▒▒ flusters opponents with acrobatic flying maneuvers. This creates an opening for it to deliver an electric beam attack."]],"739":["Crabrawler",["▒▒▒▒ has been known to mistake Exeggutor for a coconut tree and climb it. The enraged Exeggutor shakes it off and stomps it.","Its hard pincers are well suited to both offense and defense. Fights between two ▒▒▒▒ are like boxing matches.","It punches so much, its pincers often come off from overuse, but they grow back quickly. What little meat they contain is rich and delicious."]],"740":["Crabominable",["Before it stops to think, it just starts pummeling. There are records of its turning back avalanches with a flurry of punches.","It stores coldness in its pincers and pummels its foes. It can even smash thick walls of ice to bits!","It just throws punches indiscriminately. In times of desperation, it can lop off its own pincers and fire them like rockets."]],"741":["Oricorio",["This ▒▒▒▒ has drunk red nectar. If its Trainer gives the wrong order, this passionate Pokémon becomes fiercely angry.","It wins the hearts of its enemies with its passionate dancing and then uses the opening it creates to burn them up with blazing flames.","This ▒▒▒▒ has sipped red nectar. Its passionate dance moves cause its enemies to combust in both body and mind."]],"742":["Cutiefly",["An opponent’s aura can tell ▒▒▒▒ what that opponent’s next move will be. Then ▒▒▒▒ can glide around the attack and strike back.","Nectar and pollen are its favorite fare. You can find ▒▒▒▒ hovering around Gossifleur, trying to get some of Gossifleur’s pollen.","▒▒▒▒ can pick up the auras of living things. It skillfully reads those auras to predict its foes’ movements and make fools of them."]],"743":["Ribombee",["▒▒▒▒ absolutely hate getting wet or rained on. In the cloudy Galar region, they are very seldom seen.","It makes pollen puffs from pollen and nectar. The puffs’ effects depend on the type of ingredients and how much of each one is used.","It can predict the weather from moisture levels and wind direction. ▒▒▒▒ only reveals itself when there are a few clear days in a row."]],"744":["Rockruff",["This Pokémon intimidates opponents by striking the ground with the rocks on its neck. The moment an opponent flinches, ▒▒▒▒ attacks.","This Pokémon can bond very strongly with its Trainer, but it also has a habit of biting. Raising a ▒▒▒▒ for a long time can be challenging.","When it rubs the rocks on its neck against you, that’s proof of its love for you. However, the rocks are sharp, so the gesture is quite painful!"]],"745":["Lycanroc",["With swift movements, this Pokémon gradually backs its prey into a corner. ▒▒▒▒’s fangs are always aimed toward opponents’ weak spots.","This ▒▒▒▒ is calm and cautious. The rocks jutting from its mane are razor sharp.","The rocks in its mane are sharper than a knife. Fragments that break off are treasured as good luck charms."]],"746":["Wishiwashi",["When it senses danger, its eyes tear up. The sparkle of its tears signals other ▒▒▒▒ to gather.","Individually, they’re incredibly weak. It’s by gathering up into schools that they’re able to confront opponents.","When it’s in a jam, its shining eyes attract others of its kind. The light from its eyes is visible almost 25 miles away."]],"747":["Mareanie",["Unlike their Alolan counterparts, the ▒▒▒▒ of the Galar region have not yet figured out that the branches of Corsola are delicious.","The first symptom of its sting is numbness. The next is an itching sensation so intense that it’s impossible to resist the urge to claw at your skin.","Aside from its head, its body parts regenerate quickly if they’re cut off. After a good night’s sleep, ▒▒▒▒ is back to normal."]],"748":["Toxapex",["Within the poison sac in its body is a poison so toxic that Pokémon as large as Wailord will still be suffering three days after it first takes effect.","To survive in the cold waters of Galar, this Pokémon forms a dome with its legs, enclosing its body so it can capture its own body heat.","With its 12 legs, it creates a dome to shelter within. The flow of the tides doesn’t affect ▒▒▒▒ in there, so it’s very comfortable."]],"749":["Mudbray",["It eats dirt to create mud and smears this mud all over its feet, giving them the grip needed to walk on rough terrain without slipping.","Loads weighing up to 50 times as much as its own body weight pose no issue for this Pokémon. It’s skilled at making use of mud.","Possessing mighty power, ▒▒▒▒ can be loaded with 50 times its own body weight and will be totally fine."]],"750":["Mudsdale",["▒▒▒▒ has so much stamina that it could carry over 10 tons across the Galar region without rest or sleep.","Mud that hardens around a ▒▒▒▒’s legs sets harder than stone. It’s so hard that it allows this Pokémon to scrap a truck with a single kick.","It can trudge mountain roads without rest for three days and three nights, all the while dragging a 10-ton load."]],"751":["Dewpider",["▒▒▒▒ normally lives underwater. When it comes onto land in search of food, it takes water with it in the form of a bubble on its head.","It forms a water bubble at the rear of its body and then covers its head with it. Meeting another ▒▒▒▒ means comparing water-bubble sizes.","It can only breathe oxygen that has dissolved in water, so it wears a water bubble on its head when it walks around on land."]],"752":["Araquanid",["It acts as a caretaker for Dewpider, putting them inside its bubble and letting them eat any leftover food.","It launches water bubbles with its legs, drowning prey within the bubbles. This Pokémon can then take its time to savor its meal.","It has a habit of storing things it values in its water bubble. If its Trainer doesn’t watch out, ▒▒▒▒ will try to put them in its bubble!"]],"753":["Fomantis",["During the day, ▒▒▒▒ basks in sunlight and sleeps peacefully. It wakes and moves around at night.","When bathed in sunlight, this Pokémon emits a pleasantly sweet scent, which causes bug Pokémon to gather around it.","It loves the sunshine. When it basks in the sunlight regularly, it grows up with vivid coloration."]],"754":["Lurantis",["The petals on this Pokémon’s arms are thin and super sharp, and they can fire laser beams if ▒▒▒▒ gathers light first.","This Pokémon resembles a beautiful flower. A properly raised ▒▒▒▒ will have gorgeous, brilliant colors.","As it slashes into its enemies, it looks like it’s dancing. Its elegant appearance has led some to call it the most glamorous Grass Pokémon."]],"755":["Morelull",["▒▒▒▒ live in forests that stay dark even during the day. They scatter flickering spores that put enemies to sleep.","Pokémon living in the forest eat the delicious caps on ▒▒▒▒’s head. The caps regrow overnight.","It likes damp dark places. When night falls, the spores filling the caps of its mushrooms glow."]],"756":["Shiinotic",["If you see a light deep in a forest at night, don’t go near. ▒▒▒▒ will make you fall fast asleep.","Its flickering spores lure in prey and put them to sleep. Once this Pokémon has its prey snoozing, it drains their vitality with its fingertips.","When it starts fighting for territory with Parasect, the entire area gets completely coated in spores!"]],"757":["Salandit",["This sneaky Pokémon will slink behind its prey and immobilize it with poisonous gas before the prey even realizes ▒▒▒▒ is there.","Its venom sacs produce a fluid that this Pokémon then heats up with the flame in its tail. This process creates ▒▒▒▒’s poisonous gas.","It weakens opponents and sends them reeling with its poisonous gas. ▒▒▒▒ doesn’t deal well with Spinda, since it’s always reeling."]],"758":["Salazzle",["The winner of competitions between ▒▒▒▒ is decided by which one has the most male Salandit with it.","Only female ▒▒▒▒ exist. They emit a gas laden with pheromones to captivate male Salandit.","It punishes Salandit that couldn’t bring it food with a fierce slap of its flame-spewing palm."]],"759":["Stufful",["The way it protects itself by flailing its arms may be an adorable sight, but stay well away. This is flailing that can snap thick tree trunks.","Its fluffy fur is a delight to pet, but carelessly reaching out to touch this Pokémon could result in painful retaliation.","▒▒▒▒ hates to be hugged or touched in any way. It will squirm, thrash, and resist with amazing power."]],"760":["Bewear",["The moves it uses to take down its prey would make a martial artist jealous. It tucks subdued prey under its arms to carry them to its nest.","Once it accepts you as a friend, it tries to show its affection with a hug. Letting it do that is dangerous—it could easily shatter your bones.","It boasts tremendous physical strength. Many people call it the most dangerous Pokémon in the Alola region."]],"761":["Bounsweet",["When under attack, it secretes a sweet and delicious sweat. The scent only calls more enemies to it.","Its body gives off a sweet, fruity scent that is extremely appetizing to bird Pokémon.","It tries to resist being swallowed by a bird Pokémon by spinning the sepals on its head. It’s usually a fruitless attempt."]],"762":["Steenee",["Any Corvisquire that pecks at this Pokémon will be greeted with a smack from its sepals followed by a sharp kick.","As it twirls like a dancer, a sweet smell spreads out around it. Anyone who inhales the scent will feel a surge of happiness.","It bounces around, swinging the sepals on its head with abandon. They’re quite painful when they smack you!"]],"763":["Tsareena",["A kick from the hardened tips of this Pokémon’s legs leaves a wound in the opponent’s body and soul that will never heal.","This feared Pokémon has long, slender legs and a cruel heart. It shows no mercy as it stomps on its opponents.","A Pokémon with an aggressive personality and a mastery of kicking, it cackles every time it kicks an opponent."]],"764":["Comfey",["These Pokémon smell very nice. All ▒▒▒▒ wear different flowers, so each of these Pokémon has its own individual scent.","▒▒▒▒ picks flowers with its vine and decorates itself with them. For some reason, flowers won’t wither once they’re attached to a ▒▒▒▒.","It picks flowers and sticks them to its body with fluids it produces. The aroma that wafts from its petals has a healing effect."]],"765":["Oranguru",["It knows the forest inside and out. If it comes across a wounded Pokémon, ▒▒▒▒ will gather medicinal herbs to treat it.","With waves of its fan—made from leaves and its own fur—▒▒▒▒ skillfully gives instructions to other Pokémon.","▒▒▒▒ don’t get along with each other, so they’re always engaging in battles of wits to decide which one is superior."]],"766":["Passimian",["▒▒▒▒ live in groups of about 20, with each member performing an assigned role. Through cooperation, the group survives.","Displaying amazing teamwork, they follow the orders of their boss as they all help out in the search for their favorite berries.","Berries are its weapons as well as the staple of its diet. The one that can throw a berry the farthest is the boss of the troop."]],"767":["Wimpod",["▒▒▒▒ gather in swarms, constantly on the lookout for danger. They scatter the moment they detect an enemy’s presence.","It’s nature’s cleaner—it eats anything and everything, including garbage and rotten things. The ground near its nest is always clean.","An astonishingly cowardly Pokémon, ▒▒▒▒ will whir its legs at high speeds to run away if anything comes near it."]],"768":["Golisopod",["They live in sunken ships or in holes in the seabed. When ▒▒▒▒ and Grapploct battle, the loser becomes the winner’s meal.","It will do anything to win, taking advantage of every opening and finishing opponents off with the small claws on its front legs.","Its claws, which it can extend and retract at will, are its greatest weapons. ▒▒▒▒ is sometimes accompanied by Wimpod."]],"769":["Sandygast",["▒▒▒▒ mainly inhabits beaches. It takes control of anyone who puts their hand into its mouth, forcing them to make its body bigger.","Grudges of the dead have possessed a mound of sand and become a Pokémon. ▒▒▒▒ is fond of the shovel on its head.","If you build sand mounds when you’re playing, destroy them before you go home, or they may get possessed and become ▒▒▒▒."]],"770":["Palossand",["This Pokémon lives on beaches, but it hates water. ▒▒▒▒ can’t maintain its castle-like shape if it gets drenched by a heavy rain.","▒▒▒▒ is known as the Beach Nightmare. It pulls its prey down into the sand by controlling the sand itself, and then it sucks out their souls.","Once it has whipped up a sandstorm to halt its opponents in their tracks, this terrifying Pokémon snatches away their vitality."]],"771":["Pyukumuku",["It’s covered in a slime that keeps its skin moist, allowing it to stay on land for days without drying up.","It lives in warm, shallow waters. If it encounters a foe, it will spit out its internal organs as a means to punch them.","Its entire body is covered in its own slime. If you accidentally step on one, you’ll slip, and it will get mad and smack you!"]],"772":["Type: Null",["It was modeled after a mighty Pokémon of myth. The mask placed upon it limits its power in order to keep it under control.","Rumor has it that the theft of top-secret research notes led to a new instance of this Pokémon being created in the Galar region.","There’s danger of its going on a rampage, so its true power is sealed away beneath its control mask."]],"773":["Silvally",["The final factor needed to release this Pokémon’s true power was a strong bond with a Trainer it trusts.","A solid bond of trust between this Pokémon and its Trainer awakened the strength hidden within ▒▒▒▒. It can change its type at will.","Through the bond it formed with its Trainer, its will was strengthened, and it was able to destroy its control mask."]],"774":["Minior",["Although its outer shell is uncommonly durable, the shock of falling to the ground smashes the shell to smithereens.","It lives in the ozone layer, where it becomes food for stronger Pokémon. When it tries to run away, it falls to the ground.","Strong impacts can knock it out of its shell. This Pokémon was born from mutated nanoparticles."]],"775":["Komala",["It remains asleep from birth to death as a result of the sedative properties of the leaves that form its diet.","It stays asleep from the moment it’s born. When it falls into a deep sleep, it stops moving altogether.","The log it holds was given to it by its parents at birth. It has also been known to cling to the arm of a friendly Trainer."]],"776":["Turtonator",["Eating sulfur in its volcanic habitat is what causes explosive compounds to develop in its shell. Its droppings are also dangerously explosive.","Explosive substances coat the shell on its back. Enemies that dare attack it will be blown away by an immense detonation.","Its exploding shell poses a real danger but is sensitive to moisture. On rainy days, ▒▒▒▒ takes silent refuge in caves."]],"777":["Togedemaru",["When it’s in trouble, it curls up into a ball, makes its fur spikes stand on end, and then discharges electricity indiscriminately.","With the long hairs on its back, this Pokémon takes in electricity from other electric Pokémon. It stores what it absorbs in an electric sac.","Its capacity to produce electricity is somewhat limited, so it gets charged up by letting lightning strike it!"]],"778":["Mimikyu",["There was a scientist who peeked under ▒▒▒▒’s old rag in the name of research. The scientist died of a mysterious disease.","It wears a rag fashioned into a Pikachu costume in an effort to look less scary. Unfortunately, the costume only makes it creepier.","A gust of wind revealed what hides under this Pokémon’s rag to a passing Trainer, who went home and died painfully that very night."]],"779":["Bruxish",["Its skin is thick enough to fend off Mareanie’s spikes. With its robust teeth, ▒▒▒▒ crunches up the spikes and eats them.","It burrows beneath the sand, radiating psychic power from the protuberance on its head. It waits for prey as it surveys the area.","It stuns its prey with psychokinesis and then grinds them to mush with its strong teeth. Even Shellder’s shell is no match for it."]],"780":["Drampa",["▒▒▒▒ is a kind and friendly Pokémon—up until it’s angered. When that happens, it stirs up a gale and flattens everything around.","The mountains it calls home are nearly two miles in height. On rare occasions, it descends to play with the children living in the towns below.","It appears in towns and plays with the children. ▒▒▒▒ will protect kids when they’re in danger, so their moms don’t have to worry."]],"781":["Dhelmise",["After lowering its anchor, it waits for its prey. It catches large Wailord and drains their life-force.","After a piece of seaweed merged with debris from a sunken ship, it was reborn as this ghost Pokémon.","Its chain-like green seaweed can stretch outward for hundreds of yards. For some reason, it gets along well with Skrelp."]],"782":["Jangmo-o",["▒▒▒▒ strikes its scales to communicate with others of its kind. Its scales are actually fur that’s become as hard as metal.","They learn to fight by smashing their head scales together. The dueling strengthens both their skills and their spirits.","It will never show an enemy its back in battle. Ancient warriors liked ▒▒▒▒ for its valiant disposition and made it one of their own."]],"783":["Hakamo-o",["Before attacking its enemies, it clashes its scales together and roars. Its sharp claws shred the opposition.","The scaleless, scarred parts of its body are signs of its strength. It shows them off to defeated opponents.","The scales it sheds can be molded and processed to make pots and pans. They conduct heat well, so they’re a popular item."]],"784":["Kommo-o",["Certain ruins have paintings of ancient warriors wearing armor made of ▒▒▒▒ scales.","It clatters its tail scales to unnerve opponents. This Pokémon will battle only those who stand steadfast in the face of this display.","It battles valiantly with its fists, which are armored in steel scales. ▒▒▒▒ specializes in uppercuts."]],"785":["Tapu Koko",["The lightning-wielding guardian deity of Melemele, ▒▒▒▒ is brimming with curiosity and appears before people from time to time.","Although it’s called a guardian deity, if a person or Pokémon puts it in a bad mood, it will become a malevolent deity and attack.","It confuses its enemies by flying too quickly for the eye to follow. It has a hair-trigger temper but forgets what made it angry an instant later."]],"786":["Tapu Lele",["Although called a guardian deity, ▒▒▒▒ is devoid of guilt about its cruel disposition and can be described as nature incarnate.","It heals the wounds of people and Pokémon by sprinkling them with its sparkling scales. This guardian deity is worshiped on Akala.","As it flutters about, it scatters its strangely glowing scales. Touching them is said to restore good health on the spot."]],"787":["Tapu Bulu",["It makes ringing sounds with its tail to let others know where it is, avoiding unneeded conflicts. This guardian deity of Ula’ula controls plants.","Although it’s called a guardian deity, it’s violent enough to crush anyone it sees as an enemy.","The guardian deity of Ula’ula is a lazy Pokémon. It commands plants to immobilize its foes and then deals them a savage blow with its horns."]],"788":["Tapu Fini",["Although it’s called a guardian deity, terrible calamities sometimes befall those who recklessly approach ▒▒▒▒.","This guardian deity of Poni Island manipulates water. Because it lives deep within a thick fog, it came to be both feared and revered.","The guardian deity of Poni, it can control water. People say it can create pure water that will wash away any uncleanness."]],"789":["Cosmog",["▒▒▒▒ is very curious but not very cautious, often placing itself in danger. If things start to look dicey, it teleports away.","This Pokémon came from another universe. Its gaseous body is so light that even a gentle breeze can blow it away.","Whether or not it’s a Pokémon from this world is a mystery. When it’s in a jam, it warps away to a safe place to hide."]],"790":["Cosmoem",["It sucks in dust from the air at an astounding rate, frantically building up energy within its core as preparation for evolution.","The absorption of starlight fuels this Pokémon’s growth. The shell that encases it is harder than any known material.","As it absorbs light, ▒▒▒▒ continues to grow. Its golden shell is surprisingly solid."]],"791":["Solgaleo",["▒▒▒▒ was once known as the Beast That Devours the Sun. Energy in the form of light radiates boundlessly from it.","When light radiates from its body, this Pokémon could almost appear to be the sun. It will dispel any darkness and light up the world.","In writings from the distant past, it’s called by the name “the beast that devours the sun.”"]],"792":["Lunala",["It steals the light from its surroundings and then becomes the full moon, showering its own light across the night sky.","Known as the Beast That Calls the Moon, this Pokémon lives by taking in any and all light and converting it into its own energy.","It sometimes summons unknown powers and life-forms here to this world from holes that lead to other worlds."]],"793":["Nihilego",["It appeared in this world from an Ultra Wormhole. ▒▒▒▒ appears to be a parasite that lives by feeding on people and Pokémon.","A life-form from another world, it was dubbed a UB and is thought to produce a strong neurotoxin.","One of the Ultra Beasts. It’s unclear whether or not this Pokémon is sentient, but sometimes it can be observed behaving like a young girl."]],"794":["Buzzwole",["▒▒▒▒ goes around showing off its abnormally swollen muscles. It is one kind of Ultra Beast.","Although it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives.","A mysterious life-form called an Ultra Beast. Witnesses saw it pulverize a dump truck with a single punch."]],"795":["Pheromosa",["Although it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives.","A life-form that lives in another world, its body is thin and supple, but it also possesses great power.","One of the Ultra Beasts. It refuses to touch anything, perhaps because it senses some uncleanness in this world."]],"796":["Xurkitree",["They’ve been dubbed Ultra Beasts. Some of them stand unmoving, like trees, with their arms and legs stuck into the ground.","Although it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives.","It appeared from the Ultra Wormhole. It raided a power plant, so people think it energizes itself with electricity."]],"797":["Celesteela",["Although it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives.","One of the dangerous UBs, high energy readings can be detected coming from both of its huge arms.","One kind of Ultra Beast. Witnesses have seen it burn down a forest by expelling gas from its two arms."]],"798":["Kartana",["Although it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives.","This Ultra Beast’s body, which is as thin as paper, is like a sharpened sword.","One of the Ultra Beast life-forms, it was observed cutting down a gigantic steel tower with one stroke of its blade."]],"799":["Guzzlord",["An unknown life-form called a UB. It may be constantly hungry—it is certainly always devouring something.","Although it’s alien to this world and a danger here, it’s apparently a common organism in the world where it normally lives.","A dangerous Ultra Beast, it appears to be eating constantly, but for some reason its droppings have never been found."]],"800":["Necrozma",["It needs light to survive, and it goes on a rampage seeking it out. Its laser beams will cut anything to pieces.","It survives by absorbing light. After a long time spent slumbering underground, impurities accumulated within it, causing its body to darken.","Light is the source of its energy. If it isn’t devouring light, impurities build up in it and on it, and ▒▒▒▒ darkens and stops moving."]],"801":["Magearna",["Built roughly 500 years ago by a scientist, the part called the Soul-Heart is the actual life-form.","It synchronizes its consciousness with others to understand their feelings. This faculty makes it useful for taking care of people.","Its mechanized body is merely a vessel. Its true self is its Soul-Heart, an artificial soul."]],"802":["Marshadow",["This Pokémon can conceal itself in any shadow, so it went undiscovered for a long time.","By slipping into the shadow of a martial arts master and copying their movements, this Pokémon learned the ultimate techniques.","It sinks into the shadows of people and Pokémon, where it can understand their feelings and copy their capabilities."]],"803":["Poipole",["An Ultra Beast that lives in a different world, it cackles wildly as it sprays its opponents with poison from the needles on its head.","This Ultra Beast is well enough liked to be chosen as a first partner in its own world."]],"804":["Naganadel",["One kind of Ultra Beast, it fires a glowing, venomous liquid from its needles. This liquid is also immensely adhesive.","It stores hundreds of liters of poisonous liquid inside its body. It is one of the organisms known as UBs."]],"805":["Stakataka",["When stone walls started moving and attacking, the brute’s true identity was this mysterious life-form, which brings to mind an Ultra Beast.","It appeared from an Ultra Wormhole. Each one appears to be made up of many life-forms stacked one on top of each other."]],"806":["Blacephalon",["A UB that appeared from an Ultra Wormhole, it causes explosions, then takes advantage of opponents’ surprise to rob them of their vitality.","It slithers toward people. Then, without warning, it triggers the explosion of its own head. It’s apparently one kind of Ultra Beast."]],"807":["Zeraora",["Electricity sparks from the pads on its limbs. Wherever ▒▒▒▒ runs, lightning flashes and thunder echoes.","It runs as fast as lightning strikes, shredding its opponents with its high-voltage claws.","It approaches its enemies at the speed of lightning, then tears them limb from limb with its sharp claws."]],"808":["Meltan",["They live as a group, but when the time comes, one strong ▒▒▒▒ will absorb all the others and evolve.","It dissolves and eats metal. Circulating liquid metal within its body is how it generates energy.","It melts particles of iron and other metals found in the subsoil, so it can absorb them into its body of molten steel."]],"809":["Melmetal",["Centrifugal force is behind the punches of ▒▒▒▒’s heavy hex-nut arms. ▒▒▒▒ is said to deliver the strongest punches of all Pokémon.","At the end of its life-span, ▒▒▒▒ will rust and fall apart. The small shards left behind will eve
