re there is clean spring water. The fruit that grows on the shrubs on its shell is sweet, nutritious, and truly delicious.","It knows where pure water wells up. It carries fellow Pokémon there on its back.","It lives along water in forests. In the daytime, it leaves the forest to sunbathe its treed shell."]],"389":["Torterra",["This remarkable, large-bodied Pokémon would serve beautifully as borrowed scenery for a garden, and its strength is peerless. ▒▒▒▒ roams the wilderness in search of clean water.","Small Pokémon occasionally gather on its unmoving back to begin building their nests.","Ancient people imagined that beneath the ground, a gigantic ▒▒▒▒ dwelled."]],"390":["Chimchar",["Full of vigor and always in high spirits. It was once known by the name ”Lantern-Tail” and feared as some kind of apparition.","The gas made in its belly burns from its rear end. The fire burns weakly when it feels sick.","Its fiery rear end is fueled by gas made in its belly. Even rain can’t extinguish the fire."]],"391":["Monferno",["The deeper the blue on its face, the more powerful it will grow to become. It leaps about every which way and lands powerful blows against its opponents with the flame on its tail.","It uses ceilings and walls to launch aerial attacks. Its fiery tail is but one weapon.","It skillfully controls the intensity of the fire on its tail to keep its foes at an ideal distance."]],"392":["Infernape",["A tall, hardy Pokémon with a dazzling appearance. It shrouds itself in flame and battles as if engaged in dance—truly a sight to behold.","It tosses its enemies around with agility. It uses all its limbs to fight in its own unique style.","Its crown of fire is indicative of its fiery nature. It is beaten by none in terms of quickness."]],"393":["Piplup",["Prefers cold climes and appears along coasts. It's an adorable little thing—as cute as any child—but it's also prideful, unwilling to accept handouts from people.","Because it is very proud, it hates accepting food from people. Its thick down guards it from cold.","It doesn’t like to be taken care of. It’s difficult to bond with since it won’t listen to its Trainer."]],"394":["Prinplup",["It swims gracefully through the frigid sea and sings with a voice like the roaring tide. It has powerful, sturdy wings and dignity to match.","It lives a solitary life. Its wings deliver wicked blows that can snap even the thickest of trees.","It lives alone, away from others. Apparently, every one of them believes it is the most important."]],"395":["Empoleon",["Since ancient times, it has been revered by the people of Hisui, who call it the Master of the Waves. Its wings are a match for even master-crafted blades.","The three horns that extend from its beak attest to its power. The leader has the biggest horns.","It swims as fast as a jet boat. The edges of its wings are sharp and can slice apart drifting ice."]],"396":["Starly",["They flock around mountains and fields, chasing after bug Pokémon. Their singing is noisy and annoying.","They flock in great numbers. Though small, they flap their wings with great power.","Because they are weak individually, they form groups. However, they bicker if the group grows too big."]],"397":["Staravia",["They form remarkably large flocks and are constantly fighting amongst themselves. I suspect that those with magnificent plumes on their heads are the strong ones.","It lives in forests and fields. Squabbles over territory occur when flocks collide.","They maintain huge flocks, although fierce scuffles break out between various flocks."]],"398":["Staraptor",["It has left the flock, having gained strength enough to survive on its own. The astounding force with which ▒▒▒▒ flies through the air allows it to carry away large, burly targets.","When Staravia evolve into ▒▒▒▒, they leave the flock to live alone. They have sturdy wings.","The muscles in its wings and legs are strong. It can easily fly while gripping a small Pokémon."]],"399":["Bidoof",["It constantly gnaws on logs and rocks to whittle down its front teeth. It nests alongside water.","With nerves of steel, nothing can perturb it. It is more agile and active than it appears.","A comparison revealed that ▒▒▒▒’s front teeth grow at the same rate as Rattata’s."]],"400":["Bibarel",["▒▒▒▒ fur repels water and is also a fantastic material for heat retention. These Pokémon create dams on rivers to live in.","It makes its nest by damming streams with bark and mud. It is known as an industrious worker.","It busily makes its nest with stacks of branches and roots it has cut up with its sharp incisors."]],"401":["Kricketot",["When its antennae hit each other, it sounds like the music of a xylophone.","It chats with others using the sounds of its colliding antennae. These sounds are fall hallmarks.","Its legs are short. Whenever it stumbles, its stiff antennae clack with a xylophone-like sound."]],"402":["Kricketune",["It uses its cutlass-like arms to produce sound, the melody of which varies from individual to individual. It is a worthwhile endeavor to seek out one's favorite tunes.","It signals its emotions with its melodies. Scientists are studying these melodic patterns.","It crosses its knifelike arms in front of its chest when it cries. It can compose melodies ad lib."]],"403":["Shinx",["Shakes its body to generate electricity. Its stature belies its aggression—one must be patient to tame this Pokémon.","Electricity makes this Pokémon’s fur glow. ▒▒▒▒ sends signals to others of its kind by shaking the tip of its tail while the tail tip is shining brightly.","This Pokémon generates electricity by contracting its muscles. Excited trembling is a sign that ▒▒▒▒ is generating a tremendous amount of electricity."]],"404":["Luxio",["Proudly uses its electrified claws as weapons. It seems to be a gracious Pokémon, evenly sharing the spoils of the hunt with others of its kind.","Upon encountering an opponent, this Pokémon prepares for battle by extending its claws, which can put out 1,000,000 volts of electricity.","By joining its tail with that of another ▒▒▒▒, this Pokémon can receive some of the other ▒▒▒▒’s electricity and power up its own electric blasts."]],"405":["Luxray",["They form packs, each having one male as leader. Legends say that when ▒▒▒▒'s two eyes shimmer with gold, the Pokémon can see through anything.","Seeing through solid objects uses up a lot of ▒▒▒▒’s electricity, so the Pokémon sleeps for long periods of time to store up energy.","▒▒▒▒ can see through solid objects. It will instantly spot prey trying to hide behind walls, even if the walls are thick."]],"406":["Budew",["When the sun's light strengthens, the bud atop this Pokémon's head opens. This is a sign to the people that the harsh winter is over, and the season of budding has begun.","This Pokémon is highly sensitive to temperature changes. When its bud starts to open, that means spring is right around the corner.","The pollen it releases contains poison. If this Pokémon is raised on clean water, the poison’s toxicity is increased."]],"407":["Roserade",["Hidden within the bouquet on each hand are thorned whips loaded with virulent poison. ▒▒▒▒ moves gracefully as it corners its prey and mercilessly lashes them with its whips.","The poison in its right hand is quick acting. The poison in its left hand is slow acting. Both are life threatening.","After captivating opponents with its sweet scent, it lashes them with its thorny whips."]],"408":["Cranidos",["An incredibly rare sight. They duel each other by ramming their heads together, and the resulting sound echoes throughout the area like the pealing of a bell.","Its hard skull is its distinguishing feature. It snapped trees by headbutting them, and then it fed on their ripe berries.","A primeval Pokémon, it possesses a hard and sturdy skull, lacking any intelligence within."]],"409":["Rampardos",["Very little is known about its biology. Can knock down massive trees by smashing its beautiful, pearl-like crown against them.","This ancient Pokémon used headbutts skillfully. Its brain was really small, so some theories suggest that its stupidity led to its extinction.","In ancient times, people would dig up fossils of this Pokémon and use its skull, which is harder than steel, to make helmets."]],"410":["Shieldon",["Much remains unknown about this Pokémon, as few have ever seen it. However, we know that it is calm and dislikes conflict, and it enjoys polishing its face against trees and rocks.","Although its fossils can be found in layers of primeval rock, nothing but its face has ever been discovered.","A mild-mannered, herbivorous Pokémon, it used its face to dig up tree roots to eat. The skin on its face was plenty tough."]],"411":["Bastiodon",["Its face is sturdy—as strong as diamond—and this hardness offers a very stable defense. Much about this species is still unknown, such as its natural habitat.","This Pokémon is from roughly 100 million years ago. Its terrifyingly tough face is harder than steel.","The bones of its face are huge and hard, so they were mistaken for its spine until after this Pokémon was successfully restored."]],"412":["Burmy",["If its cloak is even slightly damaged, ▒▒▒▒ will immediately repair it with whatever is close at hand. The Pokémon within the cloak is scrawny and vulnerable to the cold.","If its cloak is broken in battle, it quickly remakes the cloak with materials nearby.","To shelter itself from cold, wintry winds, it covers itself with a cloak made of twigs and leaves."]],"413":["Wormadam",["When Burmy evolved, its cloak became a part of this Pokémon’s body. The cloak is never shed.","Its appearance changes depending on where it evolved. The materials on hand become a part of its body.","When evolving, its body takes in surrounding materials. As a result, there are many body variations."]],"414":["Mothim",["Scatters steel-colored scales as it flaps its wings. Despite being observed feeding primarily on the nectar of flowers, ▒▒▒▒ is not often seen around flower gardens.","It flutters around at night and steals honey from the Combee hive.","It loves the honey of flowers and steals honey collected by Combee."]],"415":["Combee",["They swear fealty to a queen Pokémon and work diligently to gather nectar. Each swarm produces a different flavor of honey.","It ceaselessly gathers nectar from sunrise to sundown, all for the sake of Vespiquen and the swarm.","The members of the trio spend all their time together. Each one has a slightly different taste in nectar."]],"416":["Vespiquen",["Commands its subjects to build its hive. It will dispatch any interlopers who dare sneak into its nest and use them as nourishment for itself.","▒▒▒▒ that give off more pheromones have larger swarms of Combee attendants.","It skillfully commands its grubs in battles with its enemies. The grubs are willing to risk their lives to defend ▒▒▒▒."]],"417":["Pachirisu",["A species related to the Pikachu line. Though ▒▒▒▒ is a calm Pokémon, it still presents a danger should one touch its electrified tail or cheeks.","A pair may be seen rubbing their cheek pouches together in an effort to share stored electricity.","It makes fur balls that crackle with static electricity. It stores them with berries in tree holes."]],"418":["Buizel",["It moves freely in the water by spinning its forked tail for propulsion. The resemblance to the screw of a steamboat is coincidental.","It inflates the flotation sac around its neck and pokes its head out of the water to see what is going on.","It swims by rotating its two tails like a screw. When it dives, its flotation sac collapses."]],"419":["Floatzel",["Has a long, rather splendid flotation sac, which prevents ▒▒▒▒ from drowning even in stormy seas. One might glimpse this species around fishing hamlets from time to time.","Its flotation sac developed as a result of pursuing aquatic prey. It can double as a rubber raft.","It floats using its well-developed flotation sac. It assists in the rescues of drowning people."]],"420":["Cherubi",["Once the fruit growing alongside the main body is large and plump, ▒▒▒▒ will use the nutrients within to evolve. The fruit then detaches, becoming nourishment for other creatures.","The deeper a ▒▒▒▒’s red, the more nutrients it has stockpiled in its body. And the sweeter and tastier its small ball!","It nimbly dashes about to avoid getting pecked by bird Pokémon that would love to make off with its small, nutrient-rich storage ball."]],"421":["Cherrim",["Motionless, save for the occasional quiver. A rich array of Pokémon can be found gathered around it, drawn by the scent exuded from ▒▒▒▒'s folded petals.","Its folded petals are pretty tough. Bird Pokémon can peck at them all they want, and ▒▒▒▒ won’t be bothered at all.","As a bud, it barely moves. It sits still, placidly waiting for sunlight to appear."]],"422":["Shellos",["Found in abundance on seashores bordering warm waters. ▒▒▒▒ are unexpectedly friendly and will crawl toward any person they see. Take care not to get coated in mucus!","Subjecting this Pokémon to a strong force causes it to secrete a strange purple fluid. Though harmless, the fluid is awfully sticky.","This Pokémon’s habitat shapes its physique. According to some theories, life in warm ocean waters causes this variation to develop."]],"423":["Gastrodon",["Eats beach sand for nourishment. Should one ▒▒▒▒ encounter another of a different color, a fierce battle will inevitably ensue.","The softness of its body helps disperse the force of impacts, so although its body is uncommonly squishy, it’s also surprisingly resilient.","Its search for food sometimes leads it onto land, where it leaves behind a sticky trail of slime as it passes through."]],"424":["Ambipom",["To affirm their kinship, members of this species will form a ring by linking their newly doubled tails together. On rare occasions, humans have been accepted into such rings.","It uses its tails for everything. If it wraps both of its tails around you and gives you a squeeze, that’s proof it really likes you.","In their search for comfortable trees, they get into territorial disputes with groups of Passimian. They win about half the time."]],"425":["Drifloon",["Said to lure away young children and carry them off to the afterlife. Some whisper that ▒▒▒▒ are formed of reincarnated human souls, but these rumors are as yet unconfirmed.","The gathering of many souls gave rise to this Pokémon. During humid seasons, they seem to appear in abundance.","Perhaps seeking company, it approaches children. However, it often quickly runs away again when the children play too roughly with it."]],"426":["Drifblim",["It drifts along at dusk, perfectly silent. Its transient, melancholy aspect touches some people deeply—every so often, one will come upon a song or poem devoted to ▒▒▒▒.","It grabs people and Pokémon and carries them off somewhere. Where do they go? Nobody knows.","Some say this Pokémon is a collection of souls burdened with regrets, silently drifting through the dusk."]],"427":["Buneary",["My hypothesis as to why ▒▒▒▒ rolls up its ears is that its hearing is far too keen. I surmise that the Pokémon protects its hearing by limiting the sound that may enter its ears.","▒▒▒▒ can attack by rolling up their ears and then striking with the force created by unrolling them. This attack becomes stronger with training.","If both of ▒▒▒▒’s ears are rolled up, something is wrong with its body or mind. It’s a sure sign the Pokémon is in need of care."]],"428":["Lopunny",["Its fur is warm and yet remarkably light. This Pokémon kicks as though it were a master of karate, driving back its opponents with ease.","Once hot seasons are over, ▒▒▒▒’s coat will be replaced with fur that holds a lot of insulating air in preparation for colder weather.","▒▒▒▒ is constantly monitoring its surroundings. If danger approaches, this Pokémon responds with superdestructive kicks."]],"429":["Mismagius",["Its muttered curses can cause awful headaches or terrifying visions that torment others.","Feared for its wrath and the curses it spreads, this Pokémon will also, on a whim, cast spells that help people.","▒▒▒▒ have been known to cast spells to make people fall in love, so some people search for this Pokémon as if their life depended on it."]],"430":["Honchkrow",["One cry from this Pokémon, and a murder of Murkrow come flying. At such times, one would think the curtain of night had fallen, plunging the world into jet-black darkness.","Its goons take care of most of the fighting for it. The only time it dirties its own hands is in delivering a final blow to finish off an opponent.","It will absolutely not forgive failure from or betrayal by its goons. It has no choice in this if it wants to maintain the order of the flock."]],"431":["Glameow",["Bewitches humans with its helical tail and piercing gaze. Its hidden claws are quite sharp as well, making this Pokémon an exceedingly tricky opponent if antagonized.","When it’s happy, ▒▒▒▒ demonstrates beautiful movements of its tail, like a dancing ribbon.","It claws if displeased and purrs when affectionate. Its fickleness is very popular among some."]],"432":["Purugly",["Though impudent and difficult to tame, ▒▒▒▒ enjoys great popularity due to its fur, the beauty of which surpasses even velveteen.","To make itself appear intimidatingly beefy, it tightly cinches its waist with its twin tails.","It would claim another Pokémon’s nest as its own if it finds a nest sufficiently comfortable."]],"433":["Chingling",["This Pokémon gave me an excruciating headache when it seemingly cried out without making a sound. Perhaps there are some sounds that the human ear is simply incapable of hearing.","There is an orb inside its mouth. When it hops, the orb bounces all over and makes a ringing sound.","Each time it hops, it makes a ringing sound. It deafens foes by emitting high-frequency cries."]],"434":["Stunky",["The poison that gushes from its aft end is accompanied by an utterly evil-smelling odor with such potency that one whiff can induce memory loss.","If it lifts its tail and points its rear at you, beware. It’s about to spray you with a fluid stinky enough to make you faint.","From its rear, it sprays a foul-smelling liquid at opponents. It aims for their faces, and it can hit them from over 16 feet away."]],"435":["Skuntank",["Sprays a poisonous fluid to take down prey. Sometimes, unable to stomach the stench of its own fluid, it leaves the bested prey uneaten.","It digs holes in the ground to make its nest. The stench of the fluid it lets fly from the tip of its tail is extremely potent.","In its belly, it reserves stinky fluid that it shoots from its tail during battle. As this Pokémon’s diet varies, so does the stench of its fluid."]],"436":["Bronzor",["Floats using a mysterious energy. The pattern engraved upon its back is held as sacred and can sometimes be found in imagery from ancient cemeteries and other such timeworn places.","Polishing ▒▒▒▒ to a shine makes its surface reflect the truth, according to common lore. Be that as it may, ▒▒▒▒ hates being polished.","It appears in ancient ruins. The pattern on its body doesn’t come from any culture in the Galar region, so it remains shrouded in mystery."]],"437":["Bronzong",["Some believe that its bell-like cry opens holes to another world. It has been revered as a deity since ancient times.","Many scientists suspect that this Pokémon originated outside the Galar region, based on the patterns on its body.","Some believe it to be a deity that summons rain clouds. When angered, it lets out a warning cry that rings out like the tolling of a bell."]],"438":["Bonsly",["Its tears elicit sympathy from those who see them, but do not be deceived! This expulsion of body water is merely a physiological mechanism for keeping itself in good health.","This Pokémon lives in dry, rocky areas. As its green spheres dry out, their dull luster increases.","It expels both sweat and tears from its eyes. The sweat is a little salty, while the tears have a slight bitterness."]],"439":["Mime Jr.",["Known to turn up in bustling marketplaces now and again. It mimics people much as a child would, then watches how they react, eyes sparkling.","It looks for a Mr. Rime that’s a good dancer and carefully copies the Mr. Rime’s steps like an apprentice.","It mimics everyone it sees, but it puts extra effort into copying the graceful dance steps of Mr. Rime as practice."]],"440":["Happiny",["▒▒▒▒’s willing to lend its precious round stone to those it’s friendly with, but if the stone isn’t returned, ▒▒▒▒ will cry and throw a tantrum.","Mimicking Chansey, ▒▒▒▒ will place an egg- shaped stone in its belly pouch. ▒▒▒▒ will treasure this stone.","When it sees something round and white, ▒▒▒▒ puts it into the pouch on its stomach. It sometimes becomes overloaded and can’t move."]],"441":["Chatot",["A versatile performer skilled in the imitation of human speech. It is said that older, more experienced ▒▒▒▒ can even understand the meaning of the words they mimic.","It can learn and speak human words. If they gather, they all learn the same saying.","It mimics the cries of other Pokémon to trick them into thinking it’s one of them. This way they won’t attack it."]],"442":["Spiritomb",["It lays curses by thinking wicked thoughts. Writings tell that this Pokémon was born out of the assembly of five score and eight malevolent spirits.","All ▒▒▒▒’s mischief and misdeeds compelled a traveler to use a mysterious spell to bind ▒▒▒▒ to an odd keystone.","Exactly 108 spirits gathered to become this Pokémon. Apparently there are some ill-natured spirits in the mix."]],"443":["Gible",["It nests in caves untouched by sunlight. Its sharp teeth may fall out when worn away or after an impact, but they regrow within a few days.","▒▒▒▒ attacks anything that moves, and it drags whatever it catches into the crevice that is its lair. Despite the big mouth, ▒▒▒▒’s stomach is small.","▒▒▒▒ prefers to stay in narrow holes in the sides of caves heated by geothermal energy. This way, ▒▒▒▒ can stay warm even during a blizzard."]],"444":["Gabite",["Though ▒▒▒▒ are usually of a violent disposition, when I gave one a glass bead it had been eyeing covetously, it suddenly became quite docile.","Jewels are buried in the caves these Pokémon nest in, but you’ll be torn apart by claws and fangs the moment you enter one of these caves.","This Pokémon emits ultrasonic waves from a protrusion on either side of its head to probe pitch-dark caves."]],"445":["Garchomp",["Soars across the heavens at blinding speed—a magnificent sight! It has a feral disposition. Utmost caution is required if one meets a ▒▒▒▒ out in the wilds.","▒▒▒▒ is fast both underground and above. It can bring down prey and return to its den before its body has chilled from being outside.","▒▒▒▒ makes its home in volcanic mountains. It flies through the sky as fast as a jet airplane, hunting down as much prey as it can."]],"446":["Munchlax",["Its robust stomach allows it to nonchalantly devour even rotted matter. It pays frequent visits to villages, seeking out food scraps intended for compost.","It stores food beneath its fur. It might share just one bite, but only if it really trusts you.","Stuffing itself with vast amounts of food is its only concern. Whether the food is rotten or fresh, yummy or tasteless—it does not care."]],"447":["Riolu",["It can use waves called auras to gauge how others are feeling. These same waves can also tell this Pokémon about the state of the environment.","It’s exceedingly energetic, with enough stamina to keep running all through the night. Taking it for walks can be a challenging experience.","It uses waves called auras to communicate with others of its kind. It doesn’t make any noise during this time, so its enemies can’t detect it."]],"448":["Lucario",["A most gallant-looking creature. It emits energy waves and controls them with precision, using them to sense even faraway beings. I have given the name ”aura” to this power.","It can tell what people are thinking. Only Trainers who have justice in their hearts can earn this Pokémon’s trust.","It controls waves known as auras, which are powerful enough to pulverize huge rocks. It uses these waves to take down its prey."]],"449":["Hippopotas",["Though large and languid, ▒▒▒▒ is difficult to detect due to its tendency to burrow into and lurk beneath the soil. When agitated or excited, it expels sand from its nostrils.","This Pokémon is active during the day and passes the cold desert nights burrowed snugly into the sand.","It moves through the sands with its mouth open, swallowing sand along with its prey. It gets rid of the sand by spouting it from its nose."]],"450":["Hippowdon",["Short-tempered and easily moved to violence. It whips up whirlwinds of sand to crush its foes' spirits, then goes in for the attack.","When roused to violence by its rage, it spews out the quantities of sand it has swallowed and whips up a sandstorm.","Stones can get stuck in the ports on their bodies. Dwebble help dislodge such stones, so ▒▒▒▒ look after these Pokémon."]],"451":["Skorupi",["Its claws are not only razor-sharp but poisonous, making ▒▒▒▒ a highly dangerous Pokémon. It seems to be weakened by cold temperatures, however.","It attacks using the claws on its tail. Once locked in its grip, its prey is unable to move as this Pokémon’s poison seeps in.","After burrowing into the sand, it waits patiently for prey to come near. This Pokémon and Sizzlipede share common descent."]],"452":["Drapion",["Has a brutish, ferocious temperament. With immense strength and a sturdy shell off which swords will bounce, it rampages about and wreaks havoc.","It’s so vicious that it’s called the Sand Demon. Yet when confronted by Hippowdon, ▒▒▒▒ keeps a low profile and will never pick a fight.","Its poison is potent, but it rarely sees use. This Pokémon prefers to use physical force instead, going on rampages with its car-crushing strength."]],"453":["Croagunk",["A poison wielder with a dastardly personality. Despite such qualities, this species is afforded a measure of popularity due to its peculiar cry and comical features.","Once diluted, its poison becomes medicinal. This Pokémon came into popularity after a pharmaceutical company chose it as a mascot.","It makes frightening noises with its poison-filled cheek sacs. When opponents flinch, ▒▒▒▒ hits them with a poison jab."]],"454":["Toxicroak",["Its crimson claws contain a virulent toxin. This toxin can be made into a tonic by diluting it, mixing it with several types of wild grass, and boiling it down over two days.","It booms out a victory croak when its prey goes down in defeat. This Pokémon and Seismitoad are related species.","It bounces toward opponents and gouges them with poisonous claws. No more than a scratch is needed to knock out its adversaries."]],"455":["Carnivine",["Though this is a plant Pokémon, it has a gluttonous and unruly temperament. ▒▒▒▒ attacks its prey with its cavernous maw wide open.","It binds itself to trees in marshes. It attracts prey with its sweet-smelling drool and gulps them down.","It attracts prey with its sweet-smelling saliva, then chomps down. It takes a whole day to eat prey."]],"456":["Finneon",["What a gorgeous sight this Pokémon is as it swims with its long, pink-painted caudal fins fluttering behind it. ▒▒▒▒'s beautiful appearance has led to its nickname: ”finery fish.”","It lures in prey with its shining tail fins. It stays near the surface during the day and moves to the depths when night falls.","When night falls, their pink patterns begin to shine. They’re popular with divers, so there are resorts that feed them to keep them close."]],"457":["Lumineon",["Uses its gleaming fins to hunt its prey. The view of ▒▒▒▒ schooling near the surface of the sea at night is breathtaking— it's as though there were shining stars right there.","They traverse the deep waters as if crawling over the seafloor. The fantastic lights of its fins shine like stars in the night sky.","Deep down at the bottom of the ocean, prey is scarce. ▒▒▒▒ get into fierce disputes with Lanturn over food."]],"458":["Mantyke",["Though ball-like in shape, this Pokémon is a proficient swimmer. I have discovered that if a ▒▒▒▒ spends much time with schools of Remoraid, it will eventually achieve evolution.","It swims along with a school of Remoraid, and they’ll all fight together to repel attackers.","▒▒▒▒ living in Galar seem to be somewhat sluggish. The colder waters of the seas in this region may be the cause."]],"459":["Snover",["One is likely to encounter this Pokémon while out in the snow. There are stories of ▒▒▒▒ appearing in human settlements but doing no harm—rather, they bond with the children.","The berries that grow around its belly are like ice pops. Galarian Darumaka absolutely love these berries.","It lives on snowy mountains. It sinks its legs into the snow to absorb water and keep its own temperature down."]],"460":["Abomasnow",["A powerful Pokémon that can split huge boulders with ease. Dislikes associating with others and chooses to live quietly deep within the mountains, playing with the snow.","This Pokémon is known to bring blizzards. A shake of its massive body is enough to cause whiteout conditions.","If it sees any packs of Darumaka going after Snover, it chases them off, swinging its sizable arms like hammers."]],"461":["Weavile",["This species corners prey as a pack, under the guidance of a leader. ▒▒▒▒ displays increased cunning, leading me to speculate that its evolution caused further brain development.","With its claws, it leaves behind signs for its friends to find. The number of distinct signs is said to be over 500.","They attack their quarry in packs. Prey as large as Mamoswine easily fall to the teamwork of a group of ▒▒▒▒."]],"462":["Magnezone",["It’s thought that a special magnetic field changed the molecular structure of this Pokémon’s body, and that’s what caused the Pokémon’s evolution.","Some say that ▒▒▒▒ receives signals from space via the antenna on its head and that it’s being controlled by some mysterious being.","There are still people who believe that this Pokémon came from outer space. It emanates a powerful magnetic field."]],"463":["Lickilicky",["Its tongue can extend and contract freely, and it is capable of reaching lengths over 10 times ▒▒▒▒'s height. Beware of the saliva, as it contains corrosive elements.","▒▒▒▒ can do just about anything with its tongue, which is as dexterous as the human hand. In contrast, ▒▒▒▒’s use of its fingers is clumsy.","▒▒▒▒’s strange tongue can stretch to many times the length of its body. No one has figured out how ▒▒▒▒’s tongue can stretch so far."]],"464":["Rhyperior",["This Pokémon evolved through use of a curious item. Its rocklike hide is composed of a mysterious substance and can withstand a blow from a masterwork sword with nary a scratch.","It relies on its carapace to deflect incoming attacks and throw its enemy off balance. As soon as that happens, it drives its drill into the foe.","It can load up to three projectiles per arm into the holes in its hands. What launches out of those holes could be either rocks or Roggenrola."]],"465":["Tangrowth",["Draped with long vines, it resembles a shrub in appearance. It swings bundles of vines as though they were arms, wrapping them around prey to ensnare them.","Vine growth is accelerated for ▒▒▒▒ living in warm climates. If the vines grow long, ▒▒▒▒ shortens them by tearing parts of them off.","▒▒▒▒ has two arms that it can extend as it pleases. Recent research has shown that these arms are, in fact, bundles of vines."]],"466":["Electivire",["Its evolution was induced by an unusual item, and its electrical output rises along with its heart rate. From its tails, it can unleash an electric current measuring 20,000 volts.","In terms of electrical-energy output, ▒▒▒▒ is one of the best among all Electric Pokémon. It discharges high-voltage currents from its tails.","The amount of electrical energy this Pokémon produces is proportional to the rate of its pulse. The voltage jumps while ▒▒▒▒ is battling."]],"467":["Magmortar",["Use of a strange item caused this Pokémon to evolve. Fireballs launched from the ends of its tubelike arms are hot enough to melt an iron pot in an instant.","Living in the crater of a volcano has caused this Pokémon’s body to resemble its environment— it has an organ similar to a magma chamber.","When ▒▒▒▒ inhales deeply, the fire burning in its belly intensifies, rising in temperature to over 3,600 degrees Fahrenheit."]],"468":["Togekiss",["Scant few have ever sighted this Pokémon. After studying what literature remains, I am certain ▒▒▒▒ will reveal itself when peace reigns in the land.","Known as a bringer of blessings, it’s been depicted on good-luck charms since ancient times.","These Pokémon are never seen anywhere near conflict or turmoil. In recent times, they’ve hardly been seen at all."]],"469":["Yanmega",["Extremely violent. When hunting, it wastes none of its energy, aiming only for prey's most vulnerable spots. Any who manage to tame this Pokémon must be of incredible bravery.","This six-legged Pokémon is easily capable of transporting an adult in flight. The wings on its tail help it stay balanced.","It prefers to battle by biting apart foes’ heads instantly while flying by at high speed."]],"470":["Leafeon",["This Pokémon’s tail is blade sharp, with a fantastic cutting edge that can slice right though large trees.","Galarians favor the distinctive aroma that drifts from this Pokémon’s leaves. There’s a popular perfume made using that scent.","It gets its nutrition from photosynthesis. It lives a quiet life deep in forests where clean rivers flow."]],"471":["Glaceon",["▒▒▒▒ is able to lower its body temperature very quickly. It freezes the atmosphere, creating diamond dust that glitters like gems while it flutters and dances around.","The coldness emanating from ▒▒▒▒ causes powdery snow to form, making it quite a popular Pokémon at ski resorts.","Any who become captivated by the beauty of the snowfall that ▒▒▒▒ creates will be frozen before they know it."]],"472":["Gliscor",["It glides soundlessly on pitch-black wings and sinks sharp fangs into the throat of its prey. It takes on a look of satisfaction once it has entirely drained its prey of blood.","Its flight is soundless. It uses its lengthy tail to carry off its prey... Then its elongated fangs do the rest.","It observes prey while hanging inverted from branches. When the chance presents itself, it swoops!"]],"473":["Mamoswine",["It looks strong, and that’s exactly what it is. As the weather grows colder, its ice tusks grow longer, thicker, and more impressive.","This Pokémon can be spotted in wall paintings from as far back as 10,000 years ago. For a while, it was thought to have gone extinct.","Its impressive tusks are made of ice. The population thinned when it turned warm after the ice age."]],"474":["Porygon-Z",["Some say an additional program made this Pokémon evolve, but even academics can’t agree on whether ▒▒▒▒ is really an evolution.","▒▒▒▒ had a program installed to allow it to move between dimensions, but the program also caused instability in ▒▒▒▒’s behavior.","A faulty update was added to its programming. Its behavior is noticeably strange, so the experiment may have been a failure."]],"475":["Gallade",["The blades extending from its elbows are sharper than the finest swords. Its swordsmanship, albeit self-taught, is astonishingly impressive.","Sharply attuned to others’ wishes for help, this Pokémon seeks out those in need and aids them in battle.","True to its honorable-warrior image, it uses the blades on its elbows only in defense of something or someone."]],"476":["Probopass",["It uses three small units to catch prey and battle enemies. The main body mostly just gives orders.","Although it can control its units known as Mini-Noses, they sometimes get lost and don’t come back.","The main body controls three mobile units called Mini-Noses, which it maneuvers to catch prey."]],"477":["Dusknoir",["Comes to those whose lives have come to an end and escorts their souls to the afterlife. Known to mistakenly take the souls of those who yet have life left in them, albeit rarely.","With the mouth on its belly, ▒▒▒▒ swallows its target whole. The soul is the only thing eaten— ▒▒▒▒ disgorges the body before departing.","At the bidding of transmissions from the spirit world, it steals people and Pokémon away. No one knows whether it has a will of its own."]],"478":["Froslass",["A Pokémon inhabited by the soul of a woman who died bearing a grudge in the snowy mountains. Legends of ▒▒▒▒ placing deathly curses on misbehaving men send shivers down my spine.","It spits out cold air of nearly −60 degrees Fahrenheit to freeze its quarry. It brings frozen prey back to its lair and neatly lines them up.","After a woman met her end on a snowy mountain, her regrets lingered on. From them, this Pokémon was born. Its favorite food is frozen souls."]],"479":["Rotom",["This bizarre Pokémon appears to be a will-o'-the-wisp powered by electricity. Be wary, as ▒▒▒▒ is both smart and mischievous.","With a body made of plasma, it can inhabit all sorts of machines. It loves to surprise others.","One boy’s invention led to the development of many different machines that take advantage of ▒▒▒▒’s unique capabilities."]],"480":["Uxie",["A Pokémon feared but also respected for stealing away the memories of evildoers. I have found records that suggest ▒▒▒▒ holds dominion over knowledge.","It is said that its emergence gave humans the intelligence to improve their quality of life.","Known as “The Being of Knowledge.” It is said that it can wipe out the memory of those who see its eyes."]],"481":["Mesprit",["Known as the Being of Emotion. In legend, this Pokémon was feared, as any who showed disrespect would have their emotions thrown into disarray.","It sleeps at the bottom of a lake. Its spirit is said to leave its body to fly on the lake’s surface.","Known as “The Being of Emotion.” It taught humans the nobility of sorrow, pain, and joy."]],"482":["Azelf",["The dreaded Being of Willpower. Legends tell of this Pokémon manipulating the will of its adversaries and turning them into puppets of its own.","It is thought that Uxie, Mesprit, and ▒▒▒▒ all came from the same egg.","Known as “The Being of Willpower.” It sleeps at the bottom of a lake to keep the world in balance."]],"483":["Dialga",["This Pokémon is revered as a deity in Hisuian legend. The birth of ▒▒▒▒ was what caused the vast river of time to begin flowing in our world.","It has the power to control time. It appears in Sinnoh-region myths as an ancient deity.","A Pokémon spoken of in legend. It is said that time began moving when ▒▒▒▒ was born."]],"484":["Palkia",["This Pokémon is feared as a deity in Hisuian legend. The birth of ▒▒▒▒ was what caused the walls of our world to disappear, creating a sky that spans for infinity.","It has the ability to distort space. It is described as a deity in Sinnoh-region mythology.","It is said to live in a gap in the spatial dimension parallel to ours. It appears in mythology."]],"485":["Heatran",["Stories tell of this Pokémon being birthed from the boiling magma within Mount Coronet. Its molten-steel body holds many mysteries.","Boiling blood, like magma, circulates through its body. It makes its dwelling place in volcanic caves.","It dwells in volcanic caves. It digs in with its cross-shaped feet to crawl on ceilings and walls."]],"486":["Regigigas",["It’s said that ▒▒▒▒ created other Pokémon from many different materials before it moved the continents to where they are today.","All over the world, there are legends that tell of ▒▒▒▒ creating other Pokémon in its own image.","There is an enduring legend that states this Pokémon towed continents with ropes."]],"487":["Giratina",["There is one Hisuian verse that tells of a powerful light creating a deep shadow. I imagine that this deep shadow is ▒▒▒▒.","It was banished for its violence. It silently gazed upon the old world from the Distortion World.","This Pokémon is said to live in a world on the reverse side of ours, where common knowledge is distorted and strange."]],"488":["Cresselia",["Those who sleep holding ▒▒▒▒’s feather are assured of joyful dreams. It is said to represent the crescent moon.","Shiny particles are released from its wings like a veil. It is said to represent the crescent moon.","On nights around the quarter moon, the aurora from its tail extends and undulates beautifully."]],"489":["Phione",["It drifts in warm seas. It always returns to where it was born, no matter how far it may have drifted.","When the water warms, they inflate the flotation sac on their heads and drift languidly on the sea in packs.","A Pokémon that lives in warm seas. It inflates the flotation sac on its head to drift and search for food."]],"490":["Manaphy",["It starts its life with a wondrous power that permits it to bond with any kind of Pokémon.","It is born with a wondrous power that lets it bond with any kind of Pokémon.","Water makes up 80% of its body. This Pokémon is easily affected by its environment."]],"491":["Darkrai",["It can lull people to sleep and make them dream. It is active during nights of the new moon.","It chases people and Pokémon from its territory by causing them to experience deep, nightmarish slumbers.","To protect itself, it afflicts those around it with nightmares. However, it means no harm."]],"492":["Shaymin",["When the turning of seasons brings the cruel winter to its end and the joyous people give thanks to the heavens, ▒▒▒▒ appears and covers the withered land with flowers.","The blooming of Gracidea flowers confers the power of flight upon it. Feelings of gratitude are the message it delivers.","It can dissolve toxins in the air to instantly transform ruined land into a lush field of flowers."]],"493":["Arceus",["It is told in mythology that this Pokémon was born before the universe even existed.","According to the legends of Sinnoh, this Pokémon emerged from an egg and shaped all there is in this world.","It is said to have emerged from an egg in a place where there was nothing then shaped the world."]],"494":["Victini",["When it shares the infinite energy it creates, that being’s entire body will be overflowing with power.","This Pokémon brings victory. It is said that Trainers with ▒▒▒▒ always win, regardless of the type of encounter.","It creates an unlimited supply of energy inside its body, which it shares with those who touch it."]],"495":["Snivy",["They photosynthesize by bathing their tails in sunlight. When they are not feeling well, their tails droop.","Being exposed to sunlight makes its movements swifter. It uses vines more adeptly than its hands.","It is very intelligent and calm. Being exposed to lots of sunlight makes its movements swifter."]],"496":["Servine",["When it gets dirty, its leaves can’t be used in photosynthesis, so it always keeps itself clean.","It moves along the ground as if sliding. Its swift movements befuddle its foes, and it then attacks with a vine whip.","They avoid attacks by sinking into the shadows of thick foliage. They retaliate with masterful whipping techniques."]],"497":["Serperior",["It can stop its opponents’ movements with just a glare. It takes in solar energy and boosts it internally.","It only gives its all against strong opponents who are not fazed by the glare from ▒▒▒▒’s noble eyes.","They raise their heads to intimidate opponents but only give it their all when fighting a powerful opponent."]],"498":["Tepig",["It loves to eat roasted berries, but sometimes it gets too excited and burns them to a crisp.","It can deftly dodge its foe’s attacks while shooting fireballs from its nose. It roasts berries before it eats them.","It blows fire through its nose. When it catches a cold, the fire becomes pitch-black smoke instead."]],"499":["Pignite",["When its internal fire flares up, its movements grow sharper and faster. When in trouble, it emits smoke.","The more it eats, the more fuel it has to make the fire in its stomach stronger. This fills it with even more power.","Whatever it eats becomes fuel for the flame in its stomach. When it is angered, the intensity of the flame increases."]],"500":["Emboar",["It has mastered fast and powerful fighting moves. It grows a beard of fire.","It can throw a fire punch by setting its fists on fire with its fiery chin. It cares deeply about its friends.","A flaring beard of fire is proof that it is fired up. It is adept at using many different moves."]],"501":["Oshawott",["This Pokémon from the Unova region uses the shell on its belly as a weapon to cut down its foes. Thus, I've conferred upon this shell the name ”scalchop”.","It fights using the scalchop on its stomach. In response to an attack, it retaliates immediately by slashing.","The scalchop on its stomach isn’t just used for battle—it can be used to break open hard berries as well."]],"502":["Dewott",["Its exquisite double-scalchop technique is likely the result of daily training, and it can send even masters of the blade fleeing in defeat.","As a result of strict training, each ▒▒▒▒ learns different forms for using the scalchops.","Strict training is how it learns its flowing double-scalchop technique."]],"503":["Samurott",["One swing of the sword incorporated in its armor can fell an opponent. A simple glare from one of them quiets everybody.","In the time it takes a foe to blink, it can draw and sheathe the seamitars attached to its front legs.","Part of the armor on its anterior legs becomes a giant sword. Its cry alone is enough to intimidate most enemies."]],"504":["Patrat",["Extremely cautious, one of them will always be on the lookout, but it won’t notice a foe coming from behind.","Using food stored in cheek pouches, they can keep watch for days. They use their tails to communicate with others.","Extremely cautious, they take shifts to maintain a constant watch of their nest. They feel insecure without a lookout."]],"505":["Watchog",["When they see an enemy, their tails stand high, and they spit the seeds of berries stored in their cheek pouches.","Using luminescent matter, it makes its eyes and body glow and stuns attacking opponents.","They make the patterns on their bodies shine in order to threaten predators. Keen eyesight lets them see in the dark."]],"506":["Lillipup",["This Pokémon is far brighter than the average child, and ▒▒▒▒ won’t forget the love it receives or any abuse it suffers.","This Pokémon is courageous but also cautious. It uses the soft fur covering its face to collect information about its surroundings.","This Pokémon is popular with beginners because it’s intelligent, obedient to its Trainer’s commands, and easy to raise."]],"507":["Herdier",["The black fur that covers this Pokémon’s body is dense and springy. Even sharp fangs bounce right off.","▒▒▒▒ is a very smart and friendly Pokémon. So much so that there’s a theory that ▒▒▒▒ was the first Pokémon to partner with people.","It has been living with people for so long that portrayals of it can be found on the walls of caves from long, long ago."]],"508":["Stoutland",["▒▒▒▒ is immensely proud of its impressive moustache. It’s said that moustache length is what determines social standing among this species.","These Pokémon seem to enjoy living with humans. Even a ▒▒▒▒ caught in the wild will warm up to people in about three days.","Its fur is long and thick. A long time ago in cold regions, every household kept a ▒▒▒▒."]],"509":["Purrloin",["Opponents that get drawn in by its adorable behavior come away with stinging scratches from its claws and stinging pride from its laughter.","It steals things from people just to amuse itself with their frustration. A rivalry exists between this Pokémon and Nickit.","They steal from people for fun, but their victims can’t help but forgive them. Their deceptively cute act is perfect."]],"510":["Liepard",["This stealthy Pokémon sneaks up behind prey without making any sound at all. It competes with Thievul for territory.","Don’t be fooled by its gorgeous fur and elegant figure. This is a moody and vicious Pokémon.","Stealthily, it sneaks up on its target, striking from behind before its victim has a chance to react."]],"511":["Pansage",["It’s good at finding berries and gathers them from all over. It’s kind enough to share them with friends.","It shares the leaf on its head with weary-looking Pokémon. These leaves are known to relieve stress.","This Pokémon dwells deep in the forest. Eating a leaf from its head whisks weariness away as if by magic."]],"512":["Simisage",["Ill tempered, it fights by swinging its barbed tail around wildly. The leaf growing on its head is very bitter.","It attacks enemies with strikes of its thorn-covered tail. This Pokémon is wild tempered.","It strikes its enemies with a thorn-covered tail. The leaf on its head is bitter."]],"513":["Pansear",["This Pokémon lives in caves in volcanoes. The fire within the tuft on its head can reach 600 degrees Fahrenheit.","Very intelligent, it roasts berries before eating them. It likes to help people.","This Pokémon lives in caves in volcanoes. The fire within the tuft on its head can reach 600° F."]],"514":["Simisear",["When it gets excited, embers rise from its head and tail and it gets hot. For some reason, it loves sweets.","A flame burns inside its body. It scatters embers from its head and tail to sear its opponents.","It loves sweets because they become energy for the fire burning inside its body."]],"515":["Panpour",["The water stored inside the tuft on its head is full of nutrients. Plants that receive its water grow large.","The water stored inside the tuft on its head is full of nutrients. It waters plants with it using its tail.","It does not thrive in dry environments. It keeps itself damp by shooting water stored in its head tuft from its tail."]],"516":["Simipour",["It prefers places with clean water. When its tuft runs low, it replenishes it by siphoning up water with its tail.","The high-pressure water expelled from its tail is so powerful, it can destroy a concrete wall.","The tuft on its head holds water. When the level runs low, it replenishes the tuft by siphoning up water with its tail."]],"517":["Munna",["It eats dreams and releases mist. The mist is pink when it’s eating a good dream, and black when it’s eating a nightmare.","Late at night, it appears beside people’s pillows. As it feeds on dreams, the patterns on its body give off a faint glow.","It eats the dreams of people and Pokémon. When it eats a pleasant dream, it expels pink-colored mist."]],"518":["Musharna",["It drowses and dreams all the time. It’s best to leave it be if it’s just woken up, as it’s a terrible grump when freshly roused from sleep.","When dark mists emanate from its body, don’t get too near. If you do, your nightmares will become reality.","The dream mist coming from its forehead changes into many different colors depending on the dream that was eaten."]],"519":["Pidove",["It’s forgetful and not very bright, but many Trainers love it anyway for its friendliness and sincerity.","Where people go, these Pokémon follow. If you’re scattering food for them, be careful— several hundred of them can gather at once.","These Pokémon live in cities. They are accustomed to people. Flocks often gather in parks and plazas."]],"520":["Tranquill",["These bright Pokémon have acute memories. Apparently delivery workers often choose them as their partners.","It can fly moderately quickly. No matter how far it travels, it can always find its way back to its master and its nest.","No matter where in the world it goes, it knows where its nest is, so it never gets separated from its Trainer."]],"521":["Unfezant",["This Pokémon is intelligent and intensely proud. People will sit up and take notice if you become the Trainer of one.","▒▒▒▒ are exceptional fliers. The females are known for their stamina, while the males outclass them in terms of speed.","Males have plumage on their heads. They will never let themselves feel close to anyone other than their Trainers."]],"522":["Blitzle",["Its mane shines when it discharges electricity. They use the frequency and rhythm of these flashes to communicate.","When thunderclouds cover the sky, it will appear. It can catch lightning with its mane and store the electricity.","Its mane shines when it discharges electricity. They use their flashing manes to communicate with one another."]],"523":["Zebstrika",["They have lightning-like movements. When ▒▒▒▒ run at full speed, the sound of thunder reverberates.","When this ill-tempered Pokémon runs wild, it shoots lightning from its mane in all directions.","This ill-tempered Pokémon is dangerous because when it’s angry, it shoots lightning from its mane in all directions."]],"524":["Roggenrola",["When it detects a noise, it starts to move. The energy core inside it makes this Pokémon slightly warm to the touch.","It’s as hard as steel, but apparently a long soak in water will cause it to soften a bit.","It was found in a fissure in a layer of exposed rock. The material that makes up its body is dirt from several hundred years ago."]],"525":["Boldore",["It relies on sound in order to monitor what’s in its vicinity. When angered, it will attack without ever changing the direction it’s facing.","If you see its orange crystals start to glow, be wary. It’s about to fire off bursts of energy.","Its orange crystals are lumps of powerful energy. They’re valuable, so ▒▒▒▒ is sometimes targeted for them."]],"526":["Gigalith",["Although its energy blasts can blow away a dump truck, they have a limitation— they can only be fired when the sun is out.","This hardy Pokémon can often be found on construction sites and in mines, working alongside people and Copperajah.","It absorbs rays of sunlight and shoots out energy. It’s usually lurking deep beneath the surface."]],"527":["Woobat",["It emits ultrasonic waves as it flutters about, searching for its prey—bug Pokémon.","While inside a cave, if you look up and see lots of heart-shaped marks lining the walls, it’s evidence that ▒▒▒▒ live there.","The heart-shaped mark left on a body after a ▒▒▒▒ has been attached to it is said to bring good fortune."]],"528":["Swoobat",["The auspicious shape of this Pokémon’s nose apparently led some regions to consider ▒▒▒▒ a symbol of good luck.","Emitting powerful sound waves tires it out. Afterward, it won’t be able to fly for a little while.","Anyone who comes into contact with the ultrasonic waves emitted by a courting male experiences a positive mood shift."]],"529":["Drilbur",["It’s a digger, using its claws to burrow through the ground. It causes damage to vegetable crops, so many farmers have little love for it.","It brings its claws together and whirls around at high speed before rushing toward its prey.","By spinning its body, it can dig straight through the ground at a speed of 30 mph."]],"530":["Excadrill",["Known as the Drill King, this Pokémon can tunnel through the terrain at speeds of over 90 mph.","It’s not uncommon for tunnels that appear to have formed naturally to actually be a result of ▒▒▒▒’s rampant digging.","More than 300 feet below the surface, they build mazelike nests. Their activity can be destructive to subway tunnels."]],"531":["Audino",["This Pokémon has a kind heart. By touching with its feelers, ▒▒▒▒ can gauge other creatures’ feelings and physical conditions.","▒▒▒▒’s sense of hearing is superb. Not even a pebble rolling along over a mile away will escape ▒▒▒▒’s ears.","It touches others with the feelers on its ears, using the sound of their heartbeats to tell how they are feeling."]],"532":["Timburr",["▒▒▒▒ that have started carrying logs that are about three times their size are nearly ready to evolve.","It loves helping out with construction projects. It loves it so much that if rain causes work to halt, it swings its log around and throws a tantrum.","Always carrying squared logs, they help out with construction. As they grow, they carry bigger logs."]],"533":["Gurdurr",["▒▒▒▒ excels at demolition—construction is not its forte. In any case, there’s skill in the way this Pokémon wields its metal beam.","It shows off its muscles to Machoke and other ▒▒▒▒. If it fails to measure up to the other Pokémon, it lies low for a little while.","This Pokémon is so muscular and strongly built that even a group of wrestlers could not make it budge an inch."]],"534":["Conkeldurr",["When going all out, this Pokémon throws aside its concrete pillars and leaps at opponents to pummel them with its fists.","Concrete mixed by ▒▒▒▒ is much more durable than normal concrete, even when the compositions of the two materials are the same.","Rather than rely on force, they master moves that utilize the centrifugal force of spinning concrete."]],"535":["Tympole",["It uses sound waves to communicate with others of its kind. People and other Pokémon species can’t hear its cries of warning.","Graceful ripples running across the water’s surface are a sure sign that ▒▒▒▒ are singing in high-pitched voices below.","By vibrating its cheeks, it emits sound waves imperceptible to humans. It uses the rhythm of these sounds to talk."]],"536":["Palpitoad",["On occasion, their cries are sublimely pleasing to the ear. ▒▒▒▒ with larger lumps on their bodies can sing with a wider range of sounds.","It weakens its prey with sound waves intense enough to cause headaches, then entangles them with its sticky tongue.","It lives in the water and on land. It uses its long, sticky tongue to immobilize its opponents."]],"537":["Seismitoad",["This Pokémon is popular among the elderly, who say the vibrations of its lumps are great for massages.","The vibrating of the bumps all over its body causes earthquake-like tremors. ▒▒▒▒ and Croagunk are similar species.","They shoot paralyzing liquid from their head bumps. They use vibration to hurt their opponents."]],"538":["Throh",["They train in groups of five. Any member that can’t keep up will discard its belt and leave the group.","It performs throwing moves with first-rate skill. Over the course of many battles, ▒▒▒▒’s belt grows darker as it absorbs its wearer’s sweat.","When it encounters a foe bigger than itself, it wants to throw it. It changes belts as it gets stronger."]],"539":["Sawk",["The karate chops of a ▒▒▒▒ that’s trained itself to the limit can cleave the ocean itself.","If you see a ▒▒▒▒ training in the mountains in its single-minded pursuit of strength, it’s best to quietly pass by.","Tying their belts gets them pumped and makes their punches more destructive. Disturbing their training angers them."]],"540":["Sewaddle",["Since this Pokémon makes its own clothes out of leaves, it is a popular mascot for fashion designers.","This Pokémon makes clothes for itself. It chews up leaves and sews them with sticky thread extruded from its mouth.","Leavanny dress it in clothes they made for it when it hatched. It hides its head in its hood while it is sleeping."]],"541":["Swadloon",["It protects itself from the cold by wrapping up in leaves. It stays on the move, eating leaves in forests.","Forests where ▒▒▒▒ live have superb foliage because the nutrients they make from fallen leaves nourish the plant life.","Preferring dark, damp places, it spends the entire day eating fallen leaves that lie around it."]],"542":["Leavanny",["It keeps its eggs warm with heat from fermenting leaves. It also uses leaves to make warm wrappings for Sewaddle.","Upon finding a small Pokémon, it weaves clothing for it from leaves by using the sticky silk secreted from its mouth.","Upon finding a small Pokémon, it weaves clothing for it from leaves, using the cutters on its arms and sticky silk."]],"543":["Venipede",["Its fangs are highly venomous. If this Pokémon finds prey it thinks it can eat, it leaps for them without any thought of how things might turn out.","▒▒▒▒ and Sizzlipede are similar species, but when the two meet, a huge fight ensues.","Its bite injects a potent poison, enough to paralyze large bird Pokémon that try to prey on it."]],"544":["Whirlipede",["▒▒▒▒ protects itself with a sturdy shell and poisonous spikes while it stores up the energy it’ll need for evolution.","This Pokémon spins itself rapidly and charges into its opponents. Its top speed is just over 60 mph.","It is usually motionless, but when attacked, it rotates at high speed and then crashes into its opponent."]],"545":["Scolipede",["▒▒▒▒ engage in fierce territorial battles with Centiskorch. At the end of one of these battles, the victor makes a meal of the loser.","▒▒▒▒ latches on to its prey with the claws on its neck before slamming them into the ground and jabbing them with its claws’ toxic spikes.","With quick movements, it chases down its foes, attacking relentlessly with its horns until it prevails."]],"546":["Cottonee",["Weaving together the cotton of both ▒▒▒▒ and Eldegoss produces exquisite cloth that’s highly prized by many luxury brands.","It shoots cotton from its body to protect itself. If it gets caught up in hurricane-strength winds, it can get sent to the other side of the Earth.","When attacked, it expels cotton from its body to create a diversion. The cotton it loses grows back in quickly."]],"547":["Whimsicott",["As long as this Pokémon bathes in sunlight, its cotton keeps growing. If too much cotton fluff builds up, ▒▒▒▒ tears it off and scatters it.","It scatters cotton all over the place as a prank. If it gets wet, it’ll become too heavy to move and have no choice but to answer for its mischief.","▒▒▒▒ doesn’t live in a fixed location. It floats around on whirling winds, appearing all over the place to perform its mischief."]],"548":["Petilil",["The deeper the color of a ▒▒▒▒’s leaves, the healthier the Pokémon is. ▒▒▒▒ sometimes makes its home in a well-tended field or flowerbed.","▒▒▒▒ appears around sources of clean water. Boiling leaves from this Pokémon’s head results in a liquid that’s sometimes used as a bug repellent.","They prefer clean water and soil. When the environment they live in turns bad, the whole bunch will up and move to a new area."]],"549":["Lilligant",["I suspect that its well-developed legs are the result of a life spent on mountains covered in deep snow. The scent it exudes from its flower crown heartens those in proximity.","Essential oils made from ▒▒▒▒ flowers have a sublime scent, but they’re also staggeringly expensive.","It’s believed that even first-rate gardeners have a hard time getting the flower on a ▒▒▒▒’s head to bloom."]],"550":["Basculin",["Though it differs from other ▒▒▒▒ in several respects, including demeanor—this one is gentle—I have categorized it as a regional form given the vast array of shared qualities.","In the past, it often appeared on the dinner table. The meat of red-striped ▒▒▒▒ is on the fatty side, and it’s more popular with the youth.","Anglers love the fight this Pokémon puts up on the hook. And there are always more to catch— many people release them into lakes illicitly."]],"551":["Sandile",["▒▒▒▒ is small, but its legs and lower body are powerful. Pushing sand aside as it goes, ▒▒▒▒ moves through the desert as if it’s swimming.","The desert gets cold at night, so when the sun sets, this Pokémon burrows deep into the sand and sleeps until sunrise.","▒▒▒▒’s still not good at hunting, so it mostly eats things that have collapsed in the desert. It’s called “the cleaner of the desert.”"]],"552":["Krokorok",["Although this Pokémon has specialized eyes that allow it to see in the dark, ▒▒▒▒ won’t move much at night—the desert gets cold after sunset.","▒▒▒▒ has specialized eyes that enable it to see in the dark. This ability lets ▒▒▒▒ hunt in the dead of night without getting lost.","It buries some of its prey in the sand to use as emergency meals when its hunts are unsuccessful."]],"553":["Krookodile",["While terribly aggressive, ▒▒▒▒ also has the patience to stay hidden under sand for days, lying in wait for prey.","This Pokémon is known as the Bully of the Sands. ▒▒▒▒’s mighty jaws can bite through heavy plates of iron with almost no effort at all.","It conceals itself in sandstorms that Flygon whip up and waits patiently for prey to appear."]],"554":["Darumaka",["This popular symbol of good fortune will never fall over in its sleep, no matter how it’s pushed or pulled.","It derives its power from fire burning inside its body. If the fire dwindles, this Pokémon will immediately fall asleep.","When it sleeps, it pulls its limbs into its body and its internal fire goes down to 1,100 degrees Fahrenheit."]],"555":["Darmanitan",["This Pokémon’s power level rises along with the temperature of its fire, which can reach 2,500 degrees Fahrenheit.","The thick arms of this hot-blooded Pokémon can deliver punches capable of obliterating a dump truck.","Its internal fire burns at 2,500 degrees Fahrenheit, making enough power that it can destroy a dump truck with one punch."]],"556":["Maractus",["Once each year, this Pokémon scatters its seeds. They’re jam-packed with nutrients, making them a precious food source out in the desert.","With noises that could be mistaken for the rattles of maracas, it creates an upbeat rhythm, startling bird Pokémon and making them fly off in a hurry.","Arid regions are their habitat. They move rhythmically, making a sound similar to maracas."]],"557":["Dwebble",["It first tries to find a rock to live in, but if there are no suitable rocks to be found, ▒▒▒▒ may move in to the ports of a Hippowdon.","When it finds a stone appealing, it creates a hole inside it and uses it as its home. This Pokémon is the natural enemy of Roggenrola and Rolycoly.","When it finds a stone of a suitable size, it secretes a liquid from its mouth to open up a hole to crawl into."]],"558":["Crustle",["Its thick claws are its greatest weapons. They’re mighty enough to crack Rhyperior’s carapace.","This highly territorial Pokémon prefers dry climates. It won’t come out of its boulder on rainy days.","Competing for territory, ▒▒▒▒ fight viciously. The one whose boulder is broken is the loser of the battle."]],"559":["Scraggy",["It protects itself with its durable skin. It’s thought that this Pokémon will evolve once its skin has completely stretched out.","If it locks eyes with you, watch out! Nothing and no one is safe from the reckless headbutts of this troublesome Pokémon.","It stretches its saggy skin up to its neck to protect itself. The saggier their skin, the more respect they garner."]],"560":["Scrafty",["While mostly known for having the temperament of an aggressive ruffian, this Pokémon takes very good care of its family, friends, and territory.","As halfhearted as this Pokémon’s kicks may seem, they pack enough power to shatter Conkeldurr’s concrete pillars.","It taunts its opponents by spitting. It has a certain territory that it never leaves its whole life long."]],"561":["Sigilyph",["A discovery was made in the desert where ▒▒▒▒ fly. The ruins of what may have been an ancient city were found beneath the sands.","Psychic power allows these Pokémon to fly. Some say they were the guardians of an ancient city. Others say they were the guardians’ emissaries.","The guardians of an ancient city, they always fly the same route while keeping watch for invaders."]],"562":["Yamask",["The spirit of a person from a bygone age became this Pokémon. It rambles through ruins, searching for someone who knows its face.","It wanders through ruins by night, carrying a mask that’s said to have been the face it had when it was still human.","Each of them carries a mask that used to be its face when it was human. Sometimes they look at it and cry."]],"563":["Cofagrigus",["There are many depictions of ▒▒▒▒ decorating ancient tombs. They’re symbols of the wealth that kings of bygone eras had.","This Pokémon has a body of sparkling gold. People say it no longer remembers that it was once human.","Grave robbers who mistake them for real coffins and get too close end up trapped inside their bodies."]],"564":["Tirtouga",["▒▒▒▒ is considered to be the ancestor of many turtle Pokémon. It was restored to life from a fossil.","This Pokémon inhabited ancient seas. Although it can only crawl, it still comes up onto land in search of prey.","Its hunting grounds encompassed a broad area, from the land to more than half a mile deep in the ocean."]],"565":["Carracosta",["This Pokémon emerges from the water in search of prey despite the fact that it moves more slowly on land.","▒▒▒▒ completely devours its prey—bones, shells, and all. Because of this, ▒▒▒▒’s own shell grows thick and sturdy.","▒▒▒▒ eats every last bit of the prey it catches, even the shells and bones, to further strengthen its sturdy shell."]],"566":["Archen",["▒▒▒▒ is said to be the ancestor of bird Pokémon. It lived in treetops, eating berries and bug Pokémon.","This Pokémon was successfully restored from a fossil. As research suggested, ▒▒▒▒ is unable to fly. But it’s very good at jumping.","Restored from a fossil, this ancient bird Pokémon has wings but can’t yet fly."]],"567":["Archeops",["Though capable of flight, ▒▒▒▒ was apparently better at hunting on the ground.","It needs a running start to take off. If ▒▒▒▒ wants to fly, it first needs to run nearly 25 mph, building speed over a course of about 2.5 miles.","Said to be an ancestor of bird Pokémon, the muscles it uses to flap its wings are still weak, so it needs a long runway in order to take off."]],"568":["Trubbish",["This Pokémon was born from a bag stuffed with trash. Galarian Weezing relish the fumes belched by ▒▒▒▒.","Its favorite places are unsanitary ones. If you leave trash lying around, you could even find one of these Pokémon living in your room.","If a young Pokémon or child breathes in the toxic gas that ▒▒▒▒ belches out, it could be a life-threatening situation."]],"569":["Garbodor",["The toxic liquid it launches from its right arm is so virulent that it can kill a weakened creature instantly.","This Pokémon eats trash, which turns into poison inside its body. The main component of the poison depends on what sort of trash was eaten.","Some say the reason ▒▒▒▒ in Alola are a little stronger than their counterparts elsewhere is the presence of Muk, their natural enemy."]],"570":["Zorua",["▒▒▒▒ sometimes transforms into a person and goes into cities to search for food. When ▒▒▒▒ does this, it usually takes on the form of a child.","▒▒▒▒ is a timid Pokémon. This disposition seems to be what led to the development of ▒▒▒▒’s ability to take on the forms of other creatures.","If a normally talkative child suddenly stops talking, it may have been replaced by ▒▒▒▒."]],"571":["Zoroark",["Seeking to ease the burden of their solitude, lonely Trainers tell ▒▒▒▒ to show illusions to them.","This Pokémon cares deeply about others of its kind, and it will conjure terrifying illusions to keep its den and pack safe.","If it thinks humans are going to discover its den, ▒▒▒▒ shows them visions that make them wander around in the woods."]],"572":["Minccino",["They pet each other with their tails as a form of greeting. Of the two, the one whose tail is fluffier is a bit more boastful.","The way it brushes away grime with its tail can be helpful when cleaning. But its focus on spotlessness can make cleaning more of a hassle.","When its tail has gotten dirty from self-cleaning or from cleaning its nest, ▒▒▒▒ spends a whole day washing its tail in clean spring water."]],"573":["Cinccino",["A special oil that seeps through their fur helps them avoid attacks. The oil fetches a high price at market.","Its body secretes oil that this Pokémon spreads over its nest as a coating to protect it from dust. ▒▒▒▒ won’t tolerate even a speck of the stuff.","The oil that seeps from its body is really smooth. For people troubled by bad skin, this oil is an effective treatment."]],"574":["Gothita",["Even when nobody seems to be around, ▒▒▒▒ can still be heard making a muted cry. Many believe it’s speaking to something only it can see.","Though they’re still only babies, there’s psychic power stored in their ribbonlike feelers, and sometimes they use that power to fight.","They intently observe both Trainers and Pokémon. Apparently, they are looking at something that only ▒▒▒▒ can see."]],"575":["Gothorita",["On nights when the stars shine, this Pokémon’s psychic power is at its strongest. It’s unknown just what link ▒▒▒▒ has to the greater universe.","It’s said that when stars shine in the night sky, this Pokémon will spirit away sleeping children. Some call it the Witch of Punishment.","According to many old tales, it creates friends for itself by controlling sleeping children on starry nights."]],"576":["Gothitelle",["A criminal who was shown his fate by a ▒▒▒▒ went missing that same day and was never seen again.","It has tremendous psychic power, but it dislikes conflict. It’s also able to predict the future based on the movement of the stars.","They can predict the future from the placement and movement of the stars. They can see Trainers’ life spans."]],"577":["Solosis",["Many say that the special liquid covering this Pokémon’s body would allow it to survive in the vacuum of space.","It communicates with others telepathically. Its body is encapsulated in liquid, but if it takes a heavy blow, the liquid will leak out.","They drive away attackers by unleashing psychic power. They can use telepathy to talk with others."]],"578":["Duosion",["Its brain has split into two, and the two halves rarely think alike. Its actions are utterly unpredictable.","Its psychic power can supposedly cover a range of more than half a mile—but only if its two brains can agree with each other.","When their two divided brains think the same thoughts, their psychic power is maximized."]],"579":["Reuniclus",["It’s said that drinking the liquid surrounding ▒▒▒▒ grants wisdom. Problem is, the liquid is highly toxic to anything besides ▒▒▒▒ itself.","While it could use its psychic abilities in battle, this Pokémon prefers to swing its powerful arms around to beat opponents into submission.","When ▒▒▒▒ shake hands, a network forms between their brains, increasing their psychic power."]],"580":["Ducklett",["They are better at swimming than flying, and they happily eat their favorite food, peat moss, as they dive underwater.","When attacked, it uses its feathers to splash water, escaping under cover of the spray.","These bird Pokémon are excellent divers. They swim around in the water eating their favorite food--peat moss."]],"581":["Swanna",["▒▒▒▒ start to dance at dusk. The one dancing in the middle is the leader of the flock.","Despite their elegant appearance, they can flap their wings strongly and fly for thousands of miles.","It administers sharp, powerful pecks with its bill. It whips its long neck to deliver forceful repeated strikes."]],"582":["Vanillite",["Supposedly, this Pokémon was born from an icicle. It spews out freezing air at −58 degrees Fahrenheit to make itself more comfortable.","Unable to survive in hot areas, it makes itself comfortable by breathing out air cold enough to cause snow. It burrows into the snow to sleep.","When the morning sun hit an icicle, it wished not to melt, and thus ▒▒▒▒ was born. At night, it buries itself in snow to sleep."]],"583":["Vanillish",["It blasts enemies with cold air reaching −148 degrees Fahrenheit, freezing them solid. But it spares their lives afterward—it’s a kind Pokémon.","By drinking pure water, it grows its icy body. This Pokémon can be hard to find on days with warm, sunny weather.","This hearty Pokémon survived the Ice Age. It’s incredibly popular in very hot regions."]],"584":["Vanilluxe",["People believe this Pokémon formed when two Vanillish stuck together. Its body temperature is roughly 21 degrees Fahrenheit.","When its anger reaches a breaking point, this Pokémon unleashes a fierce blizzard that freezes every creature around it, be they friend or foe.","▒▒▒▒ is born when two Vanillish, half-melted by the day’s light, stick to each other and freeze together in the cold return of night."]],"585":["Deerling",["The turning of the seasons changes the color and scent of this Pokémon’s fur. People use it to mark the seasons.","Their coloring changes according to the seasons and can be slightly affected by the temperature and humidity as well.","The color and scent of their fur changes to match the mountain grass. When they sense hostility, they hide in the grass."]],"586":["Sawsbuck",["They migrate according to the seasons, so some people call ▒▒▒▒ the harbingers of spring.","They migrate according to the seasons. People can tell the season by looking at ▒▒▒▒’s horns.","The plants growing on its horns change according to the season. The leaders of the herd possess magnificent horns."]],"587":["Emolga",["This Pokémon absolutely loves sweet berries. Sometimes it stuffs its cheeks full of so much food that it can’t fly properly.","As ▒▒▒▒ flutters through the air, it crackles with electricity. This Pokémon is cute, but it can cause a lot of trouble.","As it flies, it scatters electricity around, so bird Pokémon keep their distance. That’s why ▒▒▒▒ can keep all its food to itself."]],"588":["Karrablast",["It spits a liquid from its mouth to melt through Shelmet’s shell. ▒▒▒▒ doesn’t eat the shell— it eats only the contents.","Its strange physiology reacts to electrical energy in interesting ways. The presence of a Shelmet will cause this Pokémon to evolve.","For some reason they evolve when they receive electrical energy while they are attacking Shelmet."]],"589":["Escavalier",["It charges its enemies, lances at the ready. An image of one of its duels is captured in a famous painting of ▒▒▒▒ clashing with Sirfetch’d.","They use shells they’ve stolen from Shelmet to arm and protect themselves. They’re very popular Pokémon in the Galar region.","These Pokémon evolve by wearing the shell covering of a Shelmet. The steel armor protects their whole body."]],"590":["Foongus",["The spores released from this Pokémon’s hands are highly poisonous, but when thoroughly dried, the spores can be used as stomach medicine.","No one knows what the Poké Ball–like pattern on ▒▒▒▒ means or why ▒▒▒▒ has it.","It lures Pokémon with its pattern that looks just like a Poké Ball, then releases poison spores."]],"591":["Amoonguss",["▒▒▒▒ generally doesn’t move much. It tends to stand still near Poké Balls that have been dropped on the ground.","This Pokémon puffs poisonous spores at its foes. If the spores aren’t washed off quickly, they’ll grow into mushrooms wherever they land.","It lures prey close by dancing and waving its arm caps, which resemble Poké Balls, in a swaying motion."]],"592":["Frillish",["Legend has it that the residents of a sunken ancient city changed into these Pokémon.","It envelops its prey in its veillike arms and draws it down to the deeps, five miles below the ocean’s surface.","Using the invisible poison spikes on its veillike arms and legs, it paralyzes its enemies and causes them to drown."]],"593":["Jellicent",["Whenever a full moon hangs in the night sky, schools of ▒▒▒▒ gather near the surface of the sea, waiting for their prey to appear.","Most of this Pokémon’s body composition is identical to sea water. It makes sunken ships its lair.","Fishermen are terrified of ▒▒▒▒. It’s rumored to drag them into the sea and steal their lives away."]],"594":["Alomomola",["The reason it helps Pokémon in a weakened condition is that any Pokémon coming after them may also attack ▒▒▒▒.","Fishermen take them along on long voyages, because if you have an ▒▒▒▒ with you, there’ll be no need for a doctor or medicine.","They float upon the open sea. Many water Pokémon gather in the area around ▒▒▒▒."]],
