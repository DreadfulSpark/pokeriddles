ntually be reborn as Meltan.","Revered long ago for its capacity to create iron from nothing, for some reason it has come back to life after 3,000 years."]],"810":["Grookey",["It attacks with rapid beats of its stick. As it strikes with amazing speed, it gets more and more pumped.","When it uses its special stick to strike up a beat, the sound waves produced carry revitalizing energy to the plants and flowers in the area."]],"811":["Thwackey",["When it’s drumming out rapid beats in battle, it gets so caught up in the rhythm that it won’t even notice that it’s already knocked out its opponent.","The faster a ▒▒▒▒ can beat out a rhythm with its two sticks, the more respect it wins from its peers."]],"812":["Rillaboom",["The one with the best drumming techniques becomes the boss of the troop. It has a gentle disposition and values harmony among its group.","By drumming, it taps into the power of its special tree stump. The roots of the stump follow its direction in battle."]],"813":["Scorbunny",["It has special pads on the backs of its feet, and one on its nose. Once it’s raring to fight, these pads radiate tremendous heat.","A warm-up of running around gets fire energy coursing through this Pokémon’s body. Once that happens, it’s ready to fight at full power."]],"814":["Raboot",["It kicks berries right off the branches of trees and then juggles them with its feet, practicing its footwork.","Its thick and fluffy fur protects it from the cold and enables it to use hotter fire moves."]],"815":["Cinderace",["It’s skilled at both offense and defense, and it gets pumped up when cheered on. But if it starts showboating, it could put itself in a tough spot.","It juggles a pebble with its feet, turning it into a burning soccer ball. Its shots strike opponents hard and leave them scorched."]],"816":["Sobble",["When it gets wet, its skin changes color, and this Pokémon becomes invisible as if it were camouflaged.","When scared, this Pokémon cries. Its tears pack the chemical punch of 100 onions, and attackers won’t be able to resist weeping."]],"817":["Drizzile",["Highly intelligent but also very lazy, it keeps enemies out of its territory by laying traps everywhere.","A clever combatant, this Pokémon battles using water balloons created with moisture secreted from its palms."]],"818":["Inteleon",["Its nictitating membranes let it pick out foes’ weak points so it can precisely blast them with water that shoots from its fingertips at Mach 3.","It has many hidden capabilities, such as fingertips that can shoot water and a membrane on its back that it can use to glide through the air."]],"819":["Skwovet",["It eats berries nonstop—a habit that has made it more resilient than it looks. It’ll show up on farms, searching for yet more berries.","Found throughout the Galar region, this Pokémon becomes uneasy if its cheeks are ever completely empty of berries."]],"820":["Greedent",["Common throughout the Galar region, this Pokémon has strong teeth and can chew through the toughest of berry shells.","It stashes berries in its tail—so many berries that they fall out constantly. But this Pokémon is a bit slow-witted, so it doesn’t notice the loss."]],"821":["Rookidee",["Jumping nimbly about, this small-bodied Pokémon takes advantage of even the slightest opportunity to disorient larger opponents.","It will bravely challenge any opponent, no matter how powerful. This Pokémon benefits from every battle—even a defeat increases its strength a bit."]],"822":["Corvisquire",["The lessons of many harsh battles have taught it how to accurately judge an opponent’s strength.","Smart enough to use tools in battle, these Pokémon have been seen picking up rocks and flinging them or using ropes to wrap up enemies."]],"823":["Corviknight",["With their great intellect and flying skills, these Pokémon very successfully act as the Galar region’s airborne taxi service.","This Pokémon reigns supreme in the skies of the Galar region. The black luster of its steel body could drive terror into the heart of any foe."]],"824":["Blipbug",["Often found in gardens, this Pokémon has hairs on its body that it uses to assess its surroundings.","A constant collector of information, this Pokémon is very smart. Very strong is what it isn’t."]],"825":["Dottler",["As it grows inside its shell, it uses its psychic abilities to monitor the outside world and prepare for evolution.","It barely moves, but it’s still alive. Hiding in its shell without food or water seems to have awakened its psychic powers."]],"826":["Orbeetle",["It emits psychic energy to observe and study what’s around it—and what’s around it can include things over six miles away.","It’s famous for its high level of intelligence, and the large size of its brain is proof that it also possesses immense psychic power."]],"827":["Nickit",["Cunning and cautious, this Pokémon survives by stealing food from others. It erases its tracks with swipes of its tail as it makes off with its plunder.","Aided by the soft pads on its feet, it silently raids the food stores of other Pokémon. It survives off its ill-gotten gains."]],"828":["Thievul",["With a lithe body and sharp claws, it goes around stealing food and eggs. Boltund is its natural enemy.","It secretly marks potential targets with a scent. By following the scent, it stalks its targets and steals from them when they least expect it."]],"829":["Gossifleur",["It whirls around in the wind while singing a joyous song. This delightful display has charmed many into raising this Pokémon.","It anchors itself in the ground with its single leg, then basks in the sun. After absorbing enough sunlight, its petals spread as it blooms brilliantly."]],"830":["Eldegoss",["The cotton on the head of this Pokémon can be spun into a glossy, gorgeous yarn—a Galar regional specialty.","The seeds attached to its cotton fluff are full of nutrients. It spreads them on the wind so that plants and other Pokémon can benefit from them."]],"831":["Wooloo",["If its fleece grows too long, ▒▒▒▒ won’t be able to move. Cloth made with the wool of this Pokémon is surprisingly strong.","Its curly fleece is such an effective cushion that this Pokémon could fall off a cliff and stand right back up at the bottom, unharmed."]],"832":["Dubwool",["Its majestic horns are meant only to impress the opposite gender. They never see use in battle.","Weave a carpet from its springy wool, and you end up with something closer to a trampoline. You’ll start to bounce the moment you set foot on it."]],"833":["Chewtle",["It starts off battles by attacking with its rock-hard horn, but as soon as the opponent flinches, this Pokémon bites down and never lets go.","Apparently the itch of its teething impels it to snap its jaws at anything in front of it."]],"834":["Drednaw",["This Pokémon rapidly extends its retractable neck to sink its sharp fangs into distant enemies and take them down.","With jaws that can shear through steel rods, this highly aggressive Pokémon chomps down on its unfortunate prey."]],"835":["Yamper",["This gluttonous Pokémon only assists people with their work because it wants treats. As it runs, it crackles with electricity.","This Pokémon is very popular as a herding dog in the Galar region. As it runs, it generates electricity from the base of its tail."]],"836":["Boltund",["It sends electricity through its legs to boost their strength. Running at top speed, it easily breaks 50 mph.","This Pokémon generates electricity and channels it into its legs to keep them going strong. ▒▒▒▒ can run nonstop for three full days."]],"837":["Rolycoly",["It can race around like a unicycle, even on rough, rocky terrain. Burning coal sustains it.","Most of its body has the same composition as coal. Fittingly, this Pokémon was first discovered in coal mines about 400 years ago."]],"838":["Carkol",["By rapidly rolling its legs, it can travel at over 18 mph. The temperature of the flames it breathes exceeds 1,800 degrees Fahrenheit.","It forms coal inside its body. Coal dropped by this Pokémon once helped fuel the lives of people in the Galar region."]],"839":["Coalossal",["While it’s engaged in battle, its mountain of coal will burn bright red, sending off sparks that scorch the surrounding area.","It’s usually peaceful, but the vandalism of mines enrages it. Offenders will be incinerated with flames that reach 2,700 degrees Fahrenheit."]],"840":["Applin",["As soon as it’s born, it burrows into an apple. Not only does the apple serve as its food source, but the flavor of the fruit determines its evolution.","It spends its entire life inside an apple. It hides from its natural enemies, bird Pokémon, by pretending it’s just an apple and nothing more."]],"841":["Flapple",["It flies on wings of apple skin and spits a powerful acid. It can also change its shape into that of an apple.","It ate a sour apple, and that induced its evolution. In its cheeks, it stores an acid capable of causing chemical burns."]],"842":["Appletun",["Its body is covered in sweet nectar, and the skin on its back is especially yummy. Children used to have it as a snack.","Eating a sweet apple caused its evolution. A nectarous scent wafts from its body, luring in the bug Pokémon it preys on."]],"843":["Silicobra",["It spews sand from its nostrils. While the enemy is blinded, it burrows into the ground to hide.","As it digs, it swallows sand and stores it in its neck pouch. The pouch can hold more than 17 pounds of sand."]],"844":["Sandaconda",["Its unique style of coiling allows it to blast sand out of its sand sac more efficiently.","When it contracts its body, over 220 pounds of sand sprays from its nose. If it ever runs out of sand, it becomes disheartened."]],"845":["Cramorant",["This hungry Pokémon swallows Arrokuda whole. Occasionally, it makes a mistake and tries to swallow a Pokémon other than its preferred prey.","It’s so strong that it can knock out some opponents in a single hit, but it also may forget what it’s battling midfight."]],"846":["Arrokuda",["After it’s eaten its fill, its movements become extremely sluggish. That’s when Cramorant swallows it up.","If it sees any movement around it, this Pokémon charges for it straightaway, leading with its sharply pointed jaw. It’s very proud of that jaw."]],"847":["Barraskewda",["It spins its tail fins to propel itself, surging forward at speeds of over 100 knots before ramming prey and spearing into them.","This Pokémon has a jaw that’s as sharp as a spear and as strong as steel. Apparently ▒▒▒▒’s flesh is surprisingly tasty, too."]],"848":["Toxel",["It manipulates the chemical makeup of its poison to produce electricity. The voltage is weak, but it can cause a tingling paralysis.","It stores poison in an internal poison sac and secretes that poison through its skin. If you touch this Pokémon, a tingling sensation follows."]],"849":["Toxtricity",["This short-tempered and aggressive Pokémon chugs stagnant water to absorb any toxins it might contain.","When this Pokémon sounds as if it’s strumming a guitar, it’s actually clawing at the protrusions on its chest to generate electricity."]],"850":["Sizzlipede",["It wraps prey up with its heated body, cooking them in its coils. Once they’re well-done, it will voraciously nibble them down to the last morsel.","It stores flammable gas in its body and uses it to generate heat. The yellow sections on its belly get particularly hot."]],"851":["Centiskorch",["While its burning body is already dangerous on its own, this excessively hostile Pokémon also has large and very sharp fangs.","When it heats up, its body temperature reaches about 1,500 degrees Fahrenheit. It lashes its body like a whip and launches itself at enemies."]],"852":["Clobbopus",["Its tentacles tear off easily, but it isn’t alarmed when that happens—it knows they’ll grow back. It’s about as smart as a three-year-old.","It’s very curious, but its means of investigating things is to try to punch them with its tentacles. The search for food is what brings it onto land."]],"853":["Grapploct",["Searching for an opponent to test its skills against, it emerges onto land. Once the battle is over, it returns to the sea.","A body made up of nothing but muscle makes the grappling moves this Pokémon performs with its tentacles tremendously powerful."]],"854":["Sinistea",["The teacup in which this Pokémon makes its home is a famous piece of antique tableware. Many forgeries are in circulation.","This Pokémon is said to have been born when a lonely spirit possessed a cold, leftover cup of tea."]],"855":["Polteageist",["Leaving leftover black tea unattended is asking for this Pokémon to come along and pour itself into it, turning the tea into a new ▒▒▒▒.","This species lives in antique teapots. Most pots are forgeries, but on rare occasions, an authentic work is found."]],"856":["Hatenna",["If this Pokémon senses a strong emotion, it will run away as fast as it can. It prefers areas without people.","Via the protrusion on its head, it senses other creatures’ emotions. If you don’t have a calm disposition, it will never warm up to you."]],"857":["Hattrem",["Using the braids on its head, it pummels foes to get them to quiet down. One blow from those braids would knock out a professional boxer.","No matter who you are, if you bring strong emotions near this Pokémon, it will silence you violently."]],"858":["Hatterene",["If you’re too loud around it, you risk being torn apart by the claws on its tentacle. This Pokémon is also known as the Forest Witch.","It emits psychic power strong enough to cause headaches as a deterrent to the approach of others."]],"859":["Impidimp",["It sneaks into people’s homes, stealing things and feasting on the negative energy of the frustrated occupants.","Through its nose, it sucks in the emanations produced by people and Pokémon when they feel annoyed. It thrives off this negative energy."]],"860":["Morgrem",["With sly cunning, it tries to lure people into the woods. Some believe it to have the power to make crops grow.","When it gets down on all fours as if to beg for forgiveness, it’s trying to lure opponents in so that it can stab them with its spear-like hair."]],"861":["Grimmsnarl",["Its hairs work like muscle fibers. When its hairs unfurl, they latch on to opponents, ensnaring them as tentacles would.","With the hair wrapped around its body helping to enhance its muscles, this Pokémon can overwhelm even Machamp."]],"862":["Obstagoon",["It evolved after experiencing numerous fights. While crossing its arms, it lets out a shout that would make any opponent flinch.","Its voice is staggering in volume. ▒▒▒▒ has a tendency to take on a threatening posture and shout—this move is known as Obstruct."]],"863":["Perrserker",["After many battles, it evolved dangerous claws that come together to form daggers when extended.","What appears to be an iron helmet is actually hardened hair. This Pokémon lives for the thrill of battle."]],"864":["Cursola",["Be cautious of the ectoplasmic body surrounding its soul. You’ll become stiff as stone if you touch it.","Its shell is overflowing with its heightened otherworldly energy. The ectoplasm serves as protection for this Pokémon’s core spirit."]],"865":["Sirfetch’d",["After deflecting attacks with its hard leaf shield, it strikes back with its sharp leek stalk. The leek stalk is both weapon and food.","Only Farfetch’d that have survived many battles can attain this evolution. When this Pokémon’s leek withers, it will retire from combat."]],"866":["Mr. Rime",["Its amusing movements make it very popular. It releases its psychic power from the pattern on its belly.","It’s highly skilled at tap-dancing. It waves its cane of ice in time with its graceful movements."]],"867":["Runerigus",["Never touch its shadowlike body, or you’ll be shown the horrific memories behind the picture carved into it.","A powerful curse was woven into an ancient painting. After absorbing the spirit of a Yamask, the painting began to move."]],"868":["Milcery",["They say that any patisserie visited by ▒▒▒▒ is guaranteed success and good fortune.","This Pokémon was born from sweet-smelling particles in the air. Its body is made of cream."]],"869":["Alcremie",["When ▒▒▒▒ is content, the cream it secretes from its hands becomes sweeter and richer.","When it trusts a Trainer, it will treat them to berries it’s decorated with cream."]],"870":["Falinks",["The six of them work together as one Pokémon. Teamwork is also their battle strategy, and they constantly change their formation as they fight.","Five of them are troopers, and one is the brass. The brass’s orders are absolute."]],"871":["Pincurchin",["It stores electricity in each spine. Even if one gets broken off, it still continues to emit electricity for at least three hours.","It feeds on seaweed, using its teeth to scrape it off rocks. Electric current flows from the tips of its spines."]],"872":["Snom",["It eats snow that piles up on the ground. The more snow it eats, the bigger and more impressive the spikes on its back grow.","It spits out thread imbued with a frigid sort of energy and uses it to tie its body to branches, disguising itself as an icicle while it sleeps."]],"873":["Frosmoth",["It shows no mercy to any who desecrate fields and mountains. It will fly around on its icy wings, causing a blizzard to chase offenders away.","Icy scales fall from its wings like snow as it flies over fields and mountains. The temperature of its wings is less than −290 degrees Fahrenheit."]],"874":["Stonjourner",["Once a year, on a specific date and at a specific time, they gather out of nowhere and form up in a circle.","It stands in grasslands, watching the sun’s descent from zenith to horizon. This Pokémon has a talent for delivering dynamic kicks."]],"875":["Eiscue",["This Pokémon keeps its heat-sensitive head cool with ice. It fishes for its food, dangling its single hair into the sea to lure in prey.","It drifted in on the flow of ocean waters from a frigid place. It keeps its head iced constantly to make sure it stays nice and cold."]],"876":["Indeedee",["Through its horns, it can pick up on the emotions of creatures around it. Positive emotions are the source of its strength.","It uses the horns on its head to sense the emotions of others. Males will act as valets for those they serve, looking after their every need."]],"877":["Morpeko",["It carries electrically roasted seeds with it as if they’re precious treasures. No matter how much it eats, it always gets hungry again in short order.","As it eats the seeds stored up in its pocket-like pouches, this Pokémon is not just satisfying its constant hunger. It’s also generating electricity."]],"878":["Cufant",["If a job requires serious strength, this Pokémon will excel at it. Its copper body tarnishes in the rain, turning a vibrant green color.","It digs up the ground with its trunk. It’s also very strong, being able to carry loads of over five tons without any problem at all."]],"879":["Copperajah",["These Pokémon live in herds. Their trunks have incredible grip strength, strong enough to crush giant rocks into powder.","They came over from another region long ago and worked together with humans. Their green skin is resistant to water."]],"880":["Dracozolt",["The powerful muscles in its tail generate its electricity. Compared to its lower body, its upper half is entirely too small.","In ancient times, it was unbeatable thanks to its powerful lower body, but it went extinct anyway after it depleted all its plant-based food sources."]],"881":["Arctozolt",["This Pokémon lived on prehistoric seashores and was able to preserve food with the ice on its body. It went extinct because it moved so slowly.","The shaking of its freezing upper half is what generates its electricity. It has a hard time walking around."]],"882":["Dracovish",["Its mighty legs are capable of running at speeds exceeding 40 mph, but this Pokémon can’t breathe unless it’s underwater.","Powerful legs and jaws made it the apex predator of its time. Its own overhunting of its prey was what drove it to extinction."]],"883":["Arctovish",["The skin on its face is impervious to attack, but breathing difficulties made this Pokémon go extinct anyway.","Though it’s able to capture prey by freezing its surroundings, it has trouble eating the prey afterward because its mouth is on top of its head."]],"884":["Duraludon",["The special metal that composes its body is very light, so this Pokémon has considerable agility. It lives in caves because it dislikes the rain.","Its body resembles polished metal, and it’s both lightweight and strong. The only drawback is that it rusts easily."]],"885":["Dreepy",["If this weak Pokémon is by itself, a mere child could defeat it. But if ▒▒▒▒ has friends to help it train, it can evolve and become much stronger.","After being reborn as a ghost Pokémon, ▒▒▒▒ wanders the areas it used to inhabit back when it was alive in prehistoric seas."]],"886":["Drakloak",["Without a Dreepy to place on its head and care for, it gets so uneasy it’ll try to substitute any Pokémon it finds for the missing Dreepy.","It’s capable of flying faster than 120 mph. It battles alongside Dreepy and dotes on them until they successfully evolve."]],"887":["Dragapult",["Apparently the Dreepy inside ▒▒▒▒’s horns eagerly look forward to being launched out at Mach speeds.","When it isn’t battling, it keeps Dreepy in the holes on its horns. Once a fight starts, it launches the Dreepy like supersonic missiles."]],"888":["Zacian",["This Pokémon has slumbered for many years. Some say it’s Zamazenta’s elder sister—others say the two Pokémon are rivals.","Known as a legendary hero, this Pokémon absorbs metal particles, transforming them into a weapon it uses to battle."]],"889":["Zamazenta",["This Pokémon slept for aeons while in the form of a statue. It was asleep for so long, people forgot that it ever existed.","In times past, it worked together with a king of the people to save the Galar region. It absorbs metal that it then uses in battle."]],"890":["Eternatus",["It was inside a meteorite that fell 20,000 years ago. There seems to be a connection between this Pokémon and the Dynamax phenomenon.","The core on its chest absorbs energy emanating from the lands of the Galar region. This energy is what allows ▒▒▒▒ to stay active."]],"891":["Kubfu",["If ▒▒▒▒ pulls the long white hair on its head, its fighting spirit heightens and power wells up from the depths of its belly.","▒▒▒▒ trains hard to perfect its moves. The moves it masters will determine which form it takes when it evolves."]],"892":["Urshifu",["Inhabiting the mountains of a distant region, this Pokémon races across sheer cliffs, training its legs and refining its moves.","This form of ▒▒▒▒ is a strong believer in the one-hit KO. Its strategy is to leap in close to foes and land a devastating blow with a hardened fist."]],"893":["Zarude",["Once the vines on ▒▒▒▒’s body tear off, they become nutrients in the soil. This helps the plants of the forest grow.","Within dense forests, this Pokémon lives in a pack with others of its kind. It’s incredibly aggressive, and the other Pokémon of the forest fear it."]],"894":["Regieleki",["Its entire body is made up of a single organ that generates electrical energy. ▒▒▒▒ is capable of creating all Galar’s electricity.","This Pokémon is a cluster of electrical energy. It’s said that removing the rings on ▒▒▒▒’s body will unleash the Pokémon’s latent power."]],"895":["Regidrago",["Its body is composed of crystallized dragon energy. ▒▒▒▒ is said to have the powers of every dragon Pokémon.","An academic theory proposes that ▒▒▒▒’s arms were once the head of an ancient dragon Pokémon. The theory remains unproven."]],"896":["Glastrier",["▒▒▒▒ has tremendous physical strength, and the mask of ice covering its face is 100 times harder than diamond.","▒▒▒▒ emits intense cold from its hooves. It’s also a belligerent Pokémon—anything it wants, it takes by force."]],"897":["Spectrier",["As it dashes through the night, ▒▒▒▒ absorbs the life-force of sleeping creatures. It craves silence and solitude.","It probes its surroundings with all its senses save one—it doesn’t use its sense of sight. ▒▒▒▒’s kicks are said to separate soul from body."]],"898":["Calyrex",["▒▒▒▒ is known in legend as a king that ruled over Galar in ancient times. It has the power to cause hearts to mend and plants to spring forth.","▒▒▒▒ is a merciful Pokémon, capable of providing healing and blessings. It reigned over the Galar region in times of yore."]],"899":["Wyrdeer",["The black orbs shine with an uncanny light when the Pokémon is erecting invisible barriers. The fur shed from its beard retains heat well and is a highly useful material for winter clothing."]],"900":["Kleavor",["A violent creature that fells towering trees with its crude axes and shields itself with hard stone. If one should chance upon this Pokémon in the wilds, one's only recourse is to flee."]],"901":["Ursaluna",["I believe it was Hisui's swampy terrain that gave ▒▒▒▒ its burly physique and newfound capacity to manipulate peat at will."]],"902":["Basculegion",["Clads itself in the souls of comrades that perished before fulfilling their goals of journeying upstream. No other species throughout all Hisui's rivers is ▒▒▒▒'s equal."]],"903":["Sneasler",["Because of ▒▒▒▒'s virulent poison and daunting physical prowess, no other species could hope to best it on the frozen highlands. Preferring solitude, this species does not form packs."]],"904":["Overqwil",["Its lancelike spikes and savage temperament have earned it the nickname ”sea fiend.” It slurps up poison to nourish itself."]],"905":["Enamorus",["When it flies to this land from across the sea, the bitter winter comes to an end. According to legend, this Pokémon's love gives rise to the budding of fresh life across Hisui."]],"906":["Sprigatito",["The sweet scent its body gives off mesmerizes those around it. The scent grows stronger when this Pokémon is in the sun.","Its fluffy fur is similar in composition to plants. This Pokémon frequently washes its face to keep it from drying out."]],"907":["Floragato",["The hardness of ▒▒▒▒’s fur depends on the Pokémon’s mood. When ▒▒▒▒ is prepared to battle, its fur becomes pointed and needle sharp.","▒▒▒▒ deftly wields the vine hidden beneath its long fur, slamming the hard flower bud against its opponents."]],"908":["Meowscarada",["With skillful misdirection, it rigs foes with pollen-packed flower bombs. ▒▒▒▒ sets off the bombs before its foes realize what’s going on.","This Pokémon uses the reflective fur lining its cape to camouflage the stem of its flower, creating the illusion that the flower is floating."]],"909":["Fuecoco",["Its flame sac is small, so energy is always leaking out. This energy is released from the dent atop ▒▒▒▒’s head and flickers to and fro.","It lies on warm rocks and uses the heat absorbed by its square-shaped scales to create fire energy."]],"910":["Crocalor",["The valve in ▒▒▒▒’s flame sac is closely connected to its vocal cords. This Pokémon utters a guttural cry as it spews flames every which way.","The combination of ▒▒▒▒’s fire energy and overflowing vitality has caused an egg-shaped fireball to appear on the Pokémon’s head."]],"911":["Skeledirge",["▒▒▒▒’s gentle singing soothes the souls of all that hear it. It burns its enemies to a crisp with flames of over 5,400 degrees Fahrenheit.","The fiery bird changes shape when ▒▒▒▒ sings. Rumor has it that the bird was born when the fireball on ▒▒▒▒’s head gained a soul."]],"912":["Quaxly",["Its strong legs let it easily swim around in even fast-flowing rivers. It likes to keep things tidy and is prone to overthinking things.","This Pokémon migrated to Paldea from distant lands long ago. The gel secreted by its feathers repels water and grime."]],"913":["Quaxwell",["The hardworking ▒▒▒▒ observes people and Pokémon from various regions and incorporates their movements into its own dance routines.","These Pokémon constantly run through shallow waters to train their legs, then compete with each other to see which of them kicks most gracefully."]],"914":["Quaquaval",["Dancing in ways that evoke far-away places, this Pokémon mesmerizes all that see it. Flourishes of its decorative water feathers slice into its foes.","A single kick from a ▒▒▒▒ can send a truck rolling. This Pokémon uses its powerful legs to perform striking dances from far-off lands."]],"915":["Lechonk",["This Pokémon spurns all but the finest of foods. Its body gives off an herblike scent that bug Pokémon detest.","It searches for food all day. It possesses a keen sense of smell but doesn’t use it for anything other than foraging."]],"916":["Oinkologne",["It entrances female Pokémon with the sweet, alluring scent that wafts from all over its body.","▒▒▒▒ is proud of its fine, glossy skin. It emits a concentrated scent from the tip of its tail."]],"917":["Tarountula",["The thread it secretes from its rear is as strong as wire. The secret behind the thread’s strength is the topic of ongoing research.","The ball of threads wrapped around its body is elastic enough to deflect the scythes of Scyther, this Pokémon’s natural enemy."]],"918":["Spidops",["▒▒▒▒ covers its territory in tough, sticky threads to set up traps for intruders.","It clings to branches and ceilings using its threads and moves without a sound. It takes out its prey before the prey even notices it."]],"919":["Nymble",["It’s highly skilled at a fighting style in which it uses its jumping capabilities to dodge incoming attacks while also dealing damage to opponents.","It has its third set of legs folded up. When it’s in a tough spot, this Pokémon jumps over 30 feet using the strength of its legs."]],"920":["Lokix",["It uses its normally folded third set of legs when in Showdown Mode. This places a huge burden on its body, so it can’t stay in this mode for long.","When it decides to fight all out, it stands on its previously folded legs to enter Showdown Mode. It neutralizes its enemies in short order."]],"921":["Pawmi",["The pads of its paws are electricity-discharging organs. ▒▒▒▒ fires electricity from its forepaws while standing unsteadily on its hind legs.","It has underdeveloped electric sacs on its cheeks. These sacs can produce electricity only if ▒▒▒▒ rubs them furiously with the pads on its forepaws."]],"922":["Pawmo",["▒▒▒▒ uses a unique fighting technique in which it uses its forepaws to strike foes and zap them with electricity from its paw pads simultaneously.","When its group is attacked, ▒▒▒▒ is the first to leap into battle, defeating enemies with a fighting technique that utilizes electric shocks."]],"923":["Pawmot",["▒▒▒▒’s fluffy fur acts as a battery. It can store the same amount of electricity as an electric car.","This Pokémon normally is slow to react, but once it enters battle, it will strike down its enemies with lightning-fast movements."]],"924":["Tandemaus",["The pair sticks together no matter what. They split any food they find exactly in half and then eat it together.","Exhibiting great teamwork, they use their incisors to cut pieces out of any material that might be useful for a nest, then make off with them."]],"925":["Maushold",["The larger pair protects the little ones during battles. When facing strong opponents, the whole group will join the fight.","The two little ones just appeared one day. The group might be a family of related Pokémon, but nobody knows for sure."]],"926":["Fidough",["The yeast in ▒▒▒▒’s breath is useful for cooking, so this Pokémon has been protected by people since long ago.","This Pokémon is smooth and moist to the touch. Yeast in ▒▒▒▒’s breath induces fermentation in the Pokémon’s vicinity."]],"927":["Dachsbun",["The surface of this Pokémon’s skin hardens when exposed to intense heat, and its body has an appetizing aroma.","The pleasant aroma that emanates from this Pokémon’s body helps wheat grow, so ▒▒▒▒ has been treasured by farming villages."]],"928":["Smoliv",["This Pokémon converts nutrients into oil, which it stores in the fruit on its head. It can easily go a whole week without eating or drinking.","It protects itself from enemies by emitting oil from the fruit on its head. This oil is bitter and astringent enough to make someone flinch."]],"929":["Dolliv",["It basks in the sun to its heart’s content until the fruits on its head ripen. After that, ▒▒▒▒ departs from human settlements and goes on a journey.","▒▒▒▒ shares its tasty, fresh-scented oil with others. This species has coexisted with humans since times long gone."]],"930":["Arboliva",["This Pokémon drives back enemies by launching its rich, aromatic oil at them with enough force to smash a boulder.","This calm Pokémon is very compassionate. It will share its delicious, nutrient-rich oil with weakened Pokémon."]],"931":["Squawkabilly",["Green-feathered flocks hold the most sway. When they’re out searching for food in the mornings and evenings, it gets very noisy.","These Pokémon prefer to live in cities. They form flocks based on the color of their feathers, and they fight over territory."]],"932":["Nacli",["The ground scrapes its body as it travels, causing it to leave salt behind. Salt is constantly being created and replenished inside ▒▒▒▒’s body.","It was born in a layer of rock salt deep under the earth. This species was particularly treasured in the old days, as they would share precious salt."]],"933":["Naclstack",["It compresses rock salt inside its body and shoots out hardened salt pellets with enough force to perforate an iron sheet.","This Pokémon dry cures its prey by spraying salt over them. The curing process steals away the water in the prey’s body."]],"934":["Garganacl",["Many Pokémon gather around ▒▒▒▒, hoping to lick at its mineral-rich salt.","▒▒▒▒ will rub its fingertips together and sprinkle injured Pokémon with salt. Even severe wounds will promptly heal afterward."]],"935":["Charcadet",["Its firepower increases when it fights, reaching over 1,800 degrees Fahrenheit. It likes berries that are rich in fat.","Burnt charcoal came to life and became a Pokémon. Possessing a fiery fighting spirit, ▒▒▒▒ will battle even tough opponents."]],"936":["Armarouge",["This Pokémon clads itself in armor that has been fortified by psychic and fire energy, and it shoots blazing fireballs.","▒▒▒▒ evolved through the use of a set of armor that belonged to a distinguished warrior. This Pokémon is incredibly loyal."]],"937":["Ceruledge",["An old set of armor steeped in grudges caused this Pokémon’s evolution. ▒▒▒▒ cuts its enemies to pieces without mercy.","The fiery blades on its arms burn fiercely with the lingering resentment of a sword wielder who fell before accomplishing their goal."]],"938":["Tadbulb",["It floats using the electricity stored in its body. When thunderclouds are around, ▒▒▒▒ will float higher off the ground.","▒▒▒▒ shakes its tail to generate electricity. If it senses danger, it will make its head blink on and off to alert its allies."]],"939":["Bellibolt",["What appear to be eyeballs are actually organs for discharging the electricity generated by ▒▒▒▒’s belly-button dynamo.","When this Pokémon expands and contracts its wobbly body, the belly-button dynamo in its stomach produces a huge amount of electricity."]],"940":["Wattrel",["These Pokémon make their nests on coastal cliffs. The nests have a strange, crackling texture, and they’re a popular delicacy.","When its wings catch the wind, the bones within produce electricity. This Pokémon dives into the ocean, catching prey by electrocuting them."]],"941":["Kilowattrel",["It uses its throat sac to store electricity generated by its wings. There’s hardly any oil in its feathers, so it is a poor swimmer.","▒▒▒▒ inflates its throat sac to amplify its electricity. By riding the wind, this Pokémon can fly over 430 miles in a day."]],"942":["Maschiff",["Its well-developed jaw and fangs are strong enough to crunch through boulders, and its thick fat makes for an excellent defense.","It always scowls in an attempt to make opponents take it seriously, but even crying children will burst into laughter when they see ▒▒▒▒’s face."]],"943":["Mabosstiff",["▒▒▒▒ loves playing with children. Though usually gentle, it takes on an intimidating look when protecting its family.","This Pokémon can store energy in its large dewlap. ▒▒▒▒ unleashes this energy all at once to blow away enemies."]],"944":["Shroodle",["To keep enemies away from its territory, it paints markings around its nest using a poisonous liquid that has an acrid odor.","Though usually a mellow Pokémon, it will sink its sharp, poison-soaked front teeth into any that anger it, causing paralysis in the object of its ire."]],"945":["Grafaiai",["Each ▒▒▒▒ paints its own individual pattern, and it will paint that same pattern over and over again throughout its life.","The color of the poisonous saliva depends on what the Pokémon eats. ▒▒▒▒ covers its fingers in its saliva and draws patterns on trees in forests."]],"946":["Bramblin",["Not even ▒▒▒▒ knows where it is headed as it tumbles across the wilderness, blown by the wind. It loathes getting wet.","A soul unable to move on to the afterlife was blown around by the wind until it got tangled up with dried grass and became a Pokémon."]],"947":["Brambleghast",["▒▒▒▒ wanders around arid regions. On rare occasions, mass outbreaks of these Pokémon will bury an entire town.","It will open the branches of its head to envelop its prey. Once it absorbs all the life energy it needs, it expels the prey and discards it."]],"948":["Toedscool",["Though it looks like Tentacool, ▒▒▒▒ is a completely different species. Its legs may be thin, but it can run at a speed of 30 mph.","▒▒▒▒ lives in muggy forests. The flaps that fall from its body are chewy and very delicious."]],"949":["Toedscruel",["It coils its 10 tentacles around prey and sucks out their nutrients, causing the prey pain. The folds along the rim of its head are a popular delicacy.","These Pokémon gather into groups and form colonies deep within forests. They absolutely hate it when strangers approach."]],"950":["Klawf",["This Pokémon lives on sheer cliffs. It sidesteps opponents’ attacks, then lunges for their weak spots with its claws.","▒▒▒▒ hangs upside-down from cliffs, waiting for prey. But ▒▒▒▒ can’t remain in this position for long because its blood rushes to its head."]],"951":["Capsakid",["Traditional Paldean dishes can be extremely spicy because they include the shed front teeth of ▒▒▒▒ among their ingredients.","The more sunlight this Pokémon bathes in, the more spicy chemicals are produced by its body, and thus the spicier its moves become."]],"952":["Scovillain",["The green head has turned vicious due to the spicy chemicals stimulating its brain. Once it goes on a rampage, there is no stopping it.","The red head converts spicy chemicals into fire energy and blasts the surrounding area with a super spicy stream of flame."]],"953":["Rellor",["It rolls its mud ball around while the energy it needs for evolution matures. Eventually the time comes for it to evolve.","This Pokémon creates a mud ball by mixing sand and dirt with psychic energy. It treasures its mud ball more than its own life."]],"954":["Rabsca",["An infant sleeps inside the ball. ▒▒▒▒ rolls the ball soothingly with its legs to ensure the infant sleeps comfortably.","The body that supports the ball barely moves. Therefore, it is thought that the true body of this Pokémon is actually inside the ball."]],"955":["Flittle",["It spends its time running around wastelands. If anyone steals its beloved berries, it will chase them down and exact its revenge.","▒▒▒▒’s toes levitate about half an inch above the ground because of the psychic power emitted from the frills on the Pokémon’s belly."]],"956":["Espathra",["It emits psychic power from the gaps between its multicolored frills and sprints at speeds greater than 120 mph.","It immobilizes opponents by bathing them in psychic power from its large eyes. Despite its appearance, it has a vicious temperament."]],"957":["Tinkatink",["This Pokémon pounds iron scraps together to make a hammer. It will remake the hammer again and again until it’s satisfied with the result.","It swings its handmade hammer around to protect itself, but the hammer is often stolen by Pokémon that eat metal."]],"958":["Tinkatuff",["These Pokémon make their homes in piles of scrap metal. They test the strength of each other’s hammers by smashing them together.","This Pokémon will attack groups of Pawniard and Bisharp, gathering metal from them in order to create a large and sturdy hammer."]],"959":["Tinkaton",["The hammer tops 220 pounds, yet it gets swung around easily by ▒▒▒▒ as it steals whatever it pleases and carries its plunder back home.","This intelligent Pokémon has a very daring disposition. It knocks rocks into the sky with its hammer, aiming for flying Corviknight."]],"960":["Wiglett",["Though it looks like Diglett, ▒▒▒▒ is an entirely different species. The resemblance seems to be a coincidental result of environmental adaptation.","This Pokémon can pick up the scent of a Veluza just over 65 feet away and will hide itself in the sand."]],"961":["Wugtrio",["A variety of fish Pokémon, ▒▒▒▒ was once considered to be a regional form of Dugtrio.","It has a vicious temperament, contrary to what its appearance may suggest. It wraps its long bodies around prey, then drags the prey into its den."]],"962":["Bombirdier",["▒▒▒▒ uses the apron on its chest to bundle up food, which it carries back to its nest. It enjoys dropping things that make loud noises.","It gathers things up in an apron made from shed feathers added to the Pokémon’s chest feathers, then drops those things from high places for fun."]],"963":["Finizen",["Its water ring is made from seawater mixed with a sticky fluid that ▒▒▒▒ secretes from its blowhole.","It likes playing with others of its kind using the water ring on its tail. It uses ultrasonic waves to sense the emotions of other living creatures."]],"964":["Palafin",["Its physical capabilities are no different than a Finizen’s, but when its allies are in danger, it transforms and powers itself up.","This Pokémon changes its appearance if it hears its allies calling for help. ▒▒▒▒ will never show anybody its moment of transformation."]],"965":["Varoom",["The steel section is ▒▒▒▒’s actual body. This Pokémon clings to rocks and converts the minerals within into energy to fuel its activities.","It is said that this Pokémon was born when an unknown poison Pokémon entered and inspirited an engine left at a scrap-processing factory."]],"966":["Revavroom",["▒▒▒▒ viciously threatens others with the sound of its exhaust. It sticks its tongue out from its cylindrical mouth and sprays toxic fluids.","It creates a gas out of poison and minerals from rocks. It then detonates the gas in its cylinders—now numbering eight—to generate energy."]],"967":["Cyclizar",["It can sprint at over 70 mph while carrying a human. The rider’s body heat warms ▒▒▒▒’s back and lifts the Pokémon’s spirit.","Apparently ▒▒▒▒ has been allowing people to ride on its back since ancient times. Depictions of this have been found in 10,000-year-old murals."]],"968":["Orthworm",["This Pokémon lives in arid deserts. It maintains its metal body by consuming iron from the soil.","When attacked, this Pokémon will wield the tendrils on its body like fists and pelt the opponent with a storm of punches."]],"969":["Glimmet",["▒▒▒▒’s toxic mineral crystals look just like flower petals. This Pokémon scatters poisonous powder like pollen to protect itself.","It absorbs nutrients from cave walls. The petals it wears are made of crystallized poison."]],"970":["Glimmora",["▒▒▒▒’s petals are made of crystallized poison energy. It has recently become evident that these petals resemble Tera Jewels.","When this Pokémon detects danger, it will open up its crystalline petals and fire beams from its conical body."]],"971":["Greavard",["This friendly Pokémon doesn’t like being alone. Pay it even the slightest bit of attention, and it will follow you forever.","It is said that a dog Pokémon that died in the wild without ever interacting with a human was reborn as this Pokémon."]],"972":["Houndstone",["A lovingly mourned Pokémon was reborn as ▒▒▒▒. It doesn’t like anyone touching the protuberance atop its head.","▒▒▒▒ spends most of its time sleeping in graveyards. Among all the dog Pokémon, this one is most loyal to its master."]],"973":["Flamigo",["Thanks to a behavior of theirs known as “synchronizing,” an entire flock of these Pokémon can attack simultaneously in perfect harmony.","This Pokémon apparently ties the base of its neck into a knot so that energy stored in its belly does not escape from its beak."]],"974":["Cetoddle",["It lives in frigid regions in pods of five or so individuals. It loves the minerals found in snow and ice.","This species left the ocean and began living on land a very long time ago. It seems to be closely related to Wailmer."]],"975":["Cetitan",["Ice energy builds up in the horn on its upper jaw, causing the horn to reach cryogenic temperatures that freeze its surroundings.","This Pokémon wanders around snowy, icy areas. It protects its body with powerful muscles and a thick layer of fat under its skin."]],"976":["Veluza",["▒▒▒▒ has excellent regenerative capabilities. It sheds spare flesh from its body to boost its agility, then charges at its prey.","When ▒▒▒▒ discards unnecessary flesh, its mind becomes honed and its psychic power increases. The spare flesh has a mild but delicious flavor."]],"977":["Dondozo",["It treats Tatsugiri like its boss and follows it loyally. Though powerful, ▒▒▒▒ is apparently not very smart.","This Pokémon is a glutton, but it’s bad at getting food. It teams up with a Tatsugiri to catch prey."]],"978":["Tatsugiri",["▒▒▒▒ is an extremely cunning Pokémon. It feigns weakness to lure in prey, then orders its partner to attack.","This is a small dragon Pokémon. It lives inside the mouth of Dondozo to protect itself from enemies on the outside."]],"979":["Annihilape",["It imbues its fists with the power of the rage that it kept hidden in its heart. Opponents struck by these imbued fists will be shattered to their core.","When its anger rose beyond a critical point, this Pokémon gained power that is unfettered by the limits of its physical body."]],"980":["Clodsire",["It lives at the bottom of ponds and swamps. It will carry Wooper on its back and ferry them across water from one shore to the other.","When attacked, this Pokémon will retaliate by sticking thick spines out from its body. It’s a risky move that puts everything on the line."]],"981":["Farigiraf",["The hardened head from the tail protects the head of the main body as ▒▒▒▒ whips its long neck around to headbutt enemies.","Now that the brain waves from the head and tail are synced up, the psychic power of this Pokémon is 10 times stronger than Girafarig’s."]],"982":["Dudunsparce",["It drives enemies out of its nest by sucking in enough air to fill its long, narrow lungs, then releasing the air in an intense blast.","This Pokémon uses its hard tail to make its nest by boring holes into bedrock deep underground. The nest can reach lengths of over six miles."]],"983":["Kingambit",["Though it commands a massive army in battle, it’s not skilled at devising complex strategies. It just uses brute strength to keep pushing.","Only a Bisharp that stands above all others in its vast army can evolve into ▒▒▒▒."]],"984":["Great Tusk",["This creature resembles a mysterious Pokémon that, according to a paranormal magazine, has lived since ancient times.","Sightings of this Pokémon have occurred in recent years. The name ▒▒▒▒ was taken from a creature listed in a certain book."]],"985":["Scream Tail",["It resembles a mysterious Pokémon described in a paranormal magazine as a Jigglypuff from one billion years ago.","There has been only one reported sighting of this Pokémon. It resembles a mysterious creature depicted in an old expedition journal."]],"986":["Brute Bonnet",["It bears a slight resemblance to a Pokémon described in a dubious magazine as a cross between a dinosaur and a mushroom.","It is possible that the creature listed as ▒▒▒▒ in a certain book could actually be this Pokémon."]],"987":["Flutter Mane",["It has similar features to a ghostly pterosaur that was covered in a paranormal magazine, but the two have little else in common.","This Pokémon has characteristics similar to those of ▒▒▒▒, a creature mentioned in a certain book."]],"988":["Slither Wing",["This Pokémon somewhat resembles an ancient form of Volcarona that was introduced in a dubious magazine.","This mysterious Pokémon has some similarities to a creature that an old book introduced as ▒▒▒▒."]],"989":["Sandy Shocks",["It slightly resembles a Magneton that lived for 10,000 years and was featured in an article in a paranormal magazine.","No records exist of this Pokémon being caught. Data is lacking, but the Pokémon’s traits match up with a creature shown in an expedition journal."]],"990":["Iron Treads",["Sightings of this Pokémon have occurred in recent years. It resembles a mysterious object described in an old expedition journal.","This Pokémon closely resembles a scientific weapon that a paranormal magazine claimed was sent to this planet by aliens."]],"991":["Iron Bundle",["It resembles a mysterious object mentioned in an old book. There are only two reported sightings of this Pokémon.","Its shape is similar to a robot featured in a paranormal magazine article. The robot was said to have been created by an ancient civilization."]],"992":["Iron Hands",["This Pokémon shares many similarities with ▒▒▒▒, an object mentioned in a certain expedition journal.","It is very similar to a cyborg covered exclusively by a paranormal magazine. The cyborg was said to be the modified form of a certain athlete."]],"993":["Iron Jugulis",["It’s possible that ▒▒▒▒, an object described in an old book, may actually be this Pokémon.","It resembles a certain Pokémon introduced in a paranormal magazine, described as the offspring of a Hydreigon that fell in love with a robot."]],"994":["Iron Moth",["No records exist of this species being caught. Data is lacking, but the Pokémon’s traits match up with an object described in an old book.","This Pokémon resembles an unknown object described in a paranormal magazine as a UFO sent to observe humanity."]],"995":["Iron Thorns",["Some of its notable features match those of an object named within a certain expedition journal as ▒▒▒▒.","It has some similarities to a Pokémon introduced in a dubious magazine as a Tyranitar from one billion years into the future."]],"996":["Frigibax",["This Pokémon lives in forests and craggy areas. Using the power of its dorsal fin, it cools the inside of its nest like a refrigerator.","▒▒▒▒ absorbs heat through its dorsal fin and converts the heat into ice energy. The higher the temperature, the more energy ▒▒▒▒ stores."]],"997":["Arctibax",["It attacks with the blade of its frozen dorsal fin by doing a front flip in the air. ▒▒▒▒’s strong back and legs allow it to pull off this technique.","▒▒▒▒ freezes the air around it, protecting its face with an ice mask and turning its dorsal fin into a blade of ice."]],"998":["Baxcalibur",["It launches itself into battle by flipping upside down and spewing frigid air from its mouth. It finishes opponents off with its dorsal blade.","This Pokémon blasts cryogenic air out from its mouth. This air can instantly freeze even liquid-hot lava."]],"999":["Gimmighoul",["It lives inside an old treasure chest. Sometimes it gets left in shop corners since no one realizes it’s actually a Pokémon.","This Pokémon was born inside a treasure chest about 1,500 years ago. It sucks the life-force out of scoundrels who try to steal the treasure."]],"1000":["Gholdengo",["It has a sturdy body made up of stacked coins. ▒▒▒▒ overwhelms its enemies by firing coin after coin at them in quick succession.","Its body seems to be made up of 1,000 coins. This Pokémon gets along well with others and is quick to make friends with anybody."]],"1001":["Wo-Chien",["It drains the life-force from vegetation, causing nearby forests to instantly wither and fields to turn barren.","The grudge of a person punished for writing the king’s evil deeds upon wooden tablets has clad itself in dead leaves to become a Pokémon."]],"1002":["Chien-Pao",["The hatred of those who perished by the sword long ago has clad itself in snow and become a Pokémon.","This Pokémon can control 100 tons of fallen snow. It plays around innocently by leaping in and out of avalanches it has caused."]],"1003":["Ting-Lu",["It slowly brings its exceedingly heavy head down upon the ground, splitting the earth open with huge fissures that run over 160 feet deep.","The fear poured into an ancient ritual vessel has clad itself in rocks and dirt to become a Pokémon."]],"1004":["Chi-Yu",["The envy accumulated within curved beads that sparked multiple conflicts has clad itself in fire and become a Pokémon.","It controls flames burning at over 5,400 degrees Fahrenheit. It casually swims through the sea of lava it creates by melting rock and sand."]],"1005":["Roaring Moon",["According to an article in a dubious magazine, this Pokémon has some connection to a phenomenon that occurs in a certain region.","It is possible that this is the creature listed as ▒▒▒▒ in an expedition journal that still holds many mysteries."]],"1006":["Iron Valiant",["It’s possible that this is the object listed as ▒▒▒▒ in a certain expedition journal.","It has some similarities to a mad scientist’s invention covered in a paranormal magazine."]],"1007":["Koraidon",["This Pokémon resembles Cyclizar, but it is far burlier and more ferocious. Nothing is known about its ecology or other features.","This seems to be the Winged King mentioned in an old expedition journal. It was said to have split the land with its bare fists."]],"1008":["Miraidon",["This seems to be the Iron Serpent mentioned in an old book. The Iron Serpent is said to have turned the land to ash with its lightning.","Much remains unknown about this creature. It resembles Cyclizar, but it is far more ruthless and powerful."]],"1009":["Walking Wake",["It resembles an illustration published in a paranormal magazine, said to be a depiction of a super-ancient Suicune.","This ferocious creature is shrouded in mystery. It's named after an aquatic monster mentioned in an old expedition journal."]],"1010":["Iron Leaves",["According to the few eyewitness accounts that exist, it used its shining blades to julienne large trees and boulders.","Many of its physical characteristics match those of a Virizion from the future that was covered in a paranormal magazine."]],"1011":["Dipplin",["The head sticking out belongs to the fore-wyrm, while the tail belongs to the core-wyrm. The two share one apple and help each other out.","▒▒▒▒ is two creatures in one Pokémon. Its evolution was triggered by a special apple grown only in one place."]],"1012":["Poltchageist",["▒▒▒▒ looks like a regional form of Sinistea, but it was recently discovered that the two Pokémon are entirely unrelated.","Supposedly, the regrets of a tea ceremony master who died before perfecting his craft lingered in some matcha and became a Pokémon."]],"1013":["Sinistcha",["It prefers cool, dark places, such as the back of a shelf or the space beneath a home's floorboards. It wanders in search of prey after sunset.","It pretends to be tea, trying to fool people into drinking it so it can drain their life-force. Its ruse is generally unsuccessful."]],"1014":["Okidogi",["▒▒▒▒ is a ruffian with a short temper. It can pulverize anything by swinging around the chain on its neck.","After all its muscles were stimulated by the toxic chain around its neck, ▒▒▒▒ transformed and gained a powerful physique."]],"1015":["Munkidori",["▒▒▒▒ keeps itself somewhere safe while it toys with its foes, using psychokinesis to induce intense dizziness.","The chain is made from toxins that enhance capabilities. It stimulated ▒▒▒▒'s brain and caused the Pokémon's psychic powers to bloom."]],"1016":["Fezandipiti",["▒▒▒▒ beats its glossy wings to scatter pheromones that captivate people and Pokémon.","▒▒▒▒ owes its beautiful looks and lovely voice to the toxic stimulants emanating from the chain wrapped around its body."]],"1017":["Ogerpon",["This mischief-loving Pokémon is full of curiosity. It battles by drawing out the type-based energy contained within its masks.","This Pokémon's type changes based on which mask it's wearing. It confounds its enemies with nimble movements and kicks."]],"1018":["Archaludon",["It digs holes on mountains, searching for food. It’s so durable that being caught in a cave-in won’t faze it.","It gathers static electricity from its surroundings. The beams it launches when down on all fours are tremendously powerful."]],"1019":["Hydrapple",["These capricious syrpents have banded together. On the rare occasion that their moods align, their true power is unleashed.","Seven syrpents live inside an apple made of syrup. The syrpent in the center is the commander."]],"1020":["Gouging Fire",["It resembles an eerie Pokémon once shown in a paranormal magazine. That Pokémon was said to be an Entei regenerated from a fossil.","There are scant few reports of this creature being sighted. One short video shows it rampaging and spouting pillars of flame."]],"1021":["Raging Bolt",["It bears resemblance to a Pokémon that became a hot topic for a short while after a paranormal magazine touted it as Raikou's ancestor.","It's said to incinerate everything around it with lightning launched from its fur. Very little is known about this creature."]],"1022":["Iron Boulder",["It was named after a mysterious object recorded in an old book. Its body seems to be metallic.","It resembles a Pokémon described in a dubious magazine as a Terrakion that had been modified by an evil organization."]],"1023":["Iron Crown",["There was supposedly an incident in which it launched shining blades to cut everything around it to pieces. Little else is known about it.","It resembles a mysterious object introduced in a paranormal magazine as a cutting-edge weapon shaped like a Cobalion."]],"1024":["Terapagos",["It’s thought that this Pokémon lived in ancient Paldea until it got caught in seismic shifts and went extinct.","▒▒▒▒ protects itself using its power to transform energy into hard crystals. This Pokémon is the source of the Terastal phenomenon."]],"1025":["Pecharunt",["Its peach-shaped shell serves as storage for a potent poison. It makes poisonous mochi and serves them to people and Pokémon.","It feeds others toxic mochi that draw out desires and capabilities. Those who eat the mochi fall under ▒▒▒▒’s control, chained to its will."]]};
const MAX = 7;
const ENTRY_AT = [0, 2, 4];
const TYPE_COLORS = { Normal:"#a8a77a", Fire:"#ee8130", Water:"#6390f0", Electric:"#f7d02c", Grass:"#7ac74c", Ice:"#96d9d6", Fighting:"#c22e28", Poison:"#a33ea1", Ground:"#e2bf65", Flying:"#a98ff3", Psychic:"#f95587", Bug:"#a6b91a", Rock:"#b6a136", Ghost:"#735797", Dragon:"#6f35fc", Dark:"#705746", Steel:"#b7b7ce", Fairy:"#d685ad" };
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/♀/g, "f").replace(/♂/g, "m").replace(/[^a-z0-9]/g, "");
// Pictures live in 8×8 sprite sheets of 64 Pokémon each.
const sprite = n => { const i = n - 1, k = i % 64; return `background-image:url(sheets/${Math.floor(i / 64)}.webp);background-position:${(k % 8) / 7 * 100}% ${Math.floor(k / 8) / 7 * 100}%`; };
const REGIONS = ["", "Kanto", "Johto", "Hoenn", "Sinnoh", "Unova", "Kalos", "Alola", "Galar", "Paldea"];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Daily puzzle: day count since launch, mapped through a fixed shuffle so every player gets the same Pokémon.
const START = Date.UTC(2026, 9, 17);
function todayNum() {
  const d = new Date();
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - START) / 864e5) + 1;
}
function seeded(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 2 ** 32; }; }
const ORDER = (() => { const a = DEX.map((_, i) => i + 1), r = seeded(251); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const dailyAnswer = n => ORDER[((n - 1) % DEX.length + DEX.length) % DEX.length];

let mode = "daily", state;

function newGame(m) {
  mode = m;
  if (m === "daily") {
    const day = todayNum();
    const saved = store.get("pr-daily", null);
    state = saved && saved.day === day ? saved : { day, answer: dailyAnswer(day), guesses: [], done: false, won: false };
  } else {
    const saved = store.get("pr-endless", null);
    state = saved && !saved.done ? saved : { answer: 1 + Math.floor(Math.random() * DEX.length), guesses: [], done: false, won: false };
  }
  $("mode-daily").setAttribute("aria-pressed", m === "daily");
  $("mode-endless").setAttribute("aria-pressed", m === "endless");
  $("guess").value = ""; closeList(); setMsg(state.done ? "" : "Read the Pokédex entry and name the Pokémon. Every miss unlocks a new clue.");
  render(false);
}
function save() { store.set(mode === "daily" ? "pr-daily" : "pr-endless", state); }

function grade(n) {
  if (n === state.answer) return "hit";
  const a = DEX[state.answer - 1][1], g = DEX[n - 1][1];
  return g.some(t => a.includes(t)) ? "near" : "miss";
}

function hintList() {
  const [name, types, h, w, gen, evo] = DEX[state.answer - 1];
  const misses = state.guesses.filter(n => n !== state.answer).length;
  const open = state.done ? 99 : misses;
  const typeHtml = t => t ? `<span style="color:${TYPE_COLORS[t] || "inherit"}">${t}</span>` : "None (single type)";
  const letters = name.replace(/[^A-Za-z]/g, "").length;
  return [
    { k: "Generation", v: `Gen ${gen} (${REGIONS[gen]})`, at: 1 },
    { k: "Type 1", v: typeHtml(types[0]), at: 2 },
    { k: "Evolution / form", v: evo, at: 3 },
    { k: "Type 2", v: typeHtml(types[1]), at: 4 },
    { k: "Size", v: `${(h / 10).toFixed(1)} m · ${(w / 10).toFixed(1)} kg`, at: 5 },
    { k: "Name", v: `${name[0]}… (${letters} letters)`, at: 6 },
  ].map(x => ({ ...x, open: open >= x.at }));
}

let lastOpen = 0;
function render(animate = true) {
  const done = state.done;
  const stage = $("stage");
  $("mon").style.cssText = sprite(state.answer);
  const misses = state.guesses.filter(n => n !== state.answer).length;
  stage.hidden = !done;
  stage.classList.toggle("revealed", done);
  const [spName, ents] = SPECIES[DEX[state.answer - 1][6]];
  $("entries").innerHTML = ENTRY_AT.map((at, i) => {
    if (!ents[i]) return "";
    const open = done || misses >= at;
    if (!open) return `<div class="entry locked"><p>Another Pokédex entry unlocks after miss ${at}.</p></div>`;
    const txt = ents[i].replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])
      .replace(/▒▒▒▒/g, done ? spName : '<span class="redact" aria-label="hidden name">▒▒▒▒▒▒</span>');
    return `<div class="entry${animate && !done && at > 0 && misses === at ? " fresh" : ""}"><span class="no">Pokédex entry ${i + 1}</span><p>${txt}</p></div>`;
  }).join("");
  $("tag").textContent = mode === "daily" ? `Daily #${state.day}` : "Endless";
  $("resultName").hidden = !done;
  $("resultName").textContent = DEX[state.answer - 1][0];

  const hints = hintList();
  const openCount = hints.filter(h => h.open).length;
  $("hints").innerHTML = hints.map((h, i) => `<div class="hint${h.open ? "" : " locked"}${animate && h.open && i >= lastOpen && !done ? " fresh" : ""}"><span class="k">${h.k}</span><span class="v">${h.open ? h.v : `After miss ${h.at}`}</span></div>`).join("");
  lastOpen = openCount;

  $("pips").innerHTML = Array.from({ length: MAX }, (_, i) => `<span class="pip ${state.guesses[i] ? grade(state.guesses[i]) : ""}"></span>`).join("");

  $("log").innerHTML = state.guesses.slice().reverse().map(n => {
    const gr = grade(n), shared = DEX[n - 1][1].filter(t => DEX[state.answer - 1][1].includes(t));
    const why = gr === "hit" ? "That's it!" : gr === "near" ? `Shares ${shared.join(" / ")}` : "No shared type";
    return `<li class="${gr}"><span class="sprite" style="${sprite(n)}"></span>${DEX[n - 1][0]}<span class="why">${why}</span></li>`;
  }).join("");

  $("guess").disabled = done; $("go").disabled = done; $("giveup").hidden = done;
  $("end").hidden = !done;
  if (done) {
    $("endTitle").textContent = state.won ? `Got it in ${state.guesses.length}!` : `It was ${DEX[state.answer - 1][0]}`;
    const s = store.get("pr-stats-" + mode, { played: 0, wins: 0, streak: 0, best: 0 });
    $("stats").innerHTML = [["Played", s.played], ["Won", s.played ? Math.round(100 * s.wins / s.played) + "%" : "0%"], ["Streak", s.streak], ["Best", s.best]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join("");
    $("next").textContent = mode === "daily" ? "Play endless" : "Next Pokémon";
  }
}

function finish(won, msg) {
  state.done = true; state.won = won;
  const key = "pr-stats-" + mode, s = store.get(key, { played: 0, wins: 0, streak: 0, best: 0 });
  s.played++; if (won) { s.wins++; s.streak++; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
  store.set(key, s);
  setMsg(msg || (won ? "Nice work, trainer!" : "Out of guesses. Better luck next time!"));
}

function submit(n) {
  if (state.done) return;
  if (!n) { setMsg("Pick a Pokémon from the list.", true); return; }
  if (state.guesses.includes(n)) { setMsg(`You already guessed ${DEX[n - 1][0]}.`, true); return; }
  state.guesses.push(n);
  if (n === state.answer) finish(true);
  else if (state.guesses.length >= MAX) finish(false);
  else {
    const left = MAX - state.guesses.length;
    setMsg(`Not ${DEX[n - 1][0]}. ${left} guess${left === 1 ? "" : "es"} left.`);
  }
  save(); $("guess").value = ""; closeList(); render(true);
}

function setMsg(t, err = false) { $("msg").textContent = t; $("msg").classList.toggle("err", err); }

// Autocomplete
let matches = [], sel = 0;
function search(q) {
  const k = norm(q); if (!k) return [];
  const used = new Set(state.guesses);
  const all = DEX.map((d, i) => ({ n: i + 1, k: norm(d[0]) })).filter(x => !used.has(x.n));
  return [...all.filter(x => x.k.startsWith(k)), ...all.filter(x => !x.k.startsWith(k) && x.k.includes(k))].slice(0, 8).map(x => x.n);
}
function drawList() {
  const ul = $("list");
  if (!matches.length) { ul.hidden = true; return; }
  ul.hidden = false;
  ul.innerHTML = matches.map((n, i) => `<li role="option" data-n="${n}" aria-selected="${i === sel}">${DEX[n - 1][0]}<small>#${String(DEX[n - 1][6]).padStart(4, "0")}</small></li>`).join("");
}
function closeList() { matches = []; drawList(); }
$("guess").addEventListener("input", e => { matches = search(e.target.value); sel = 0; drawList(); if (!$("msg").classList.contains("err")) return; setMsg(""); });
$("guess").addEventListener("keydown", e => {
  if (!matches.length) return;
  if (e.key === "ArrowDown") { sel = (sel + 1) % matches.length; drawList(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = (sel - 1 + matches.length) % matches.length; drawList(); e.preventDefault(); }
  else if (e.key === "Escape") closeList();
});
$("list").addEventListener("pointerdown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); submit(+li.dataset.n); } });
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = norm($("guess").value);
  const exact = DEX.findIndex(d => norm(d[0]) === v) + 1;
  submit(exact || (matches.length ? matches[sel] : 0));
});
$("guess").addEventListener("blur", () => setTimeout(closeList, 120));

$("mode-daily").onclick = () => newGame("daily");
$("mode-endless").onclick = () => newGame("endless");
$("next").onclick = () => { if (mode === "endless") store.set("pr-endless", null); newGame("endless"); };
$("giveup").onclick = () => { if (state.done) return; finish(false, "No worries. Here's who it was."); save(); render(true); };

$("share").onclick = async () => {
  const sq = { hit: "🟩", near: "🟨", miss: "⬛" };
  const head = mode === "daily" ? `Pokédex Riddles #${state.day}` : "Pokédex Riddles (endless)";
  const text = `${head} ${state.won ? state.guesses.length : "X"}/${MAX}\n${state.guesses.map(n => sq[grade(n)]).join("")}`;
  try { await navigator.clipboard.writeText(text); setMsg("Result copied. Paste it anywhere!"); }
  catch { setMsg(text); }
};


newGame("daily");
</script>

</body>
</html>
