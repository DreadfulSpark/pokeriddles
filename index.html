s, ▒▒▒▒ will cover them with these bubbles.","It spends most of its time in the water. On sunny days, ▒▒▒▒ floats on the surface of the water and sunbathes.","▒▒▒▒ can make balloons out of air. It makes these air balloons if it spots a drowning Pokémon. The air balloons enable the Pokémon in trouble to breathe."]],"185":["Sudowoodo",["Though it pretends to be a tree, it fails to fool even children. To the touch, its body feels more like rock than tree bark. ▒▒▒▒'s extreme aversion to water merits special note.","It disguises itself as a tree to avoid attack. It hates water, so it will disappear if it starts raining.","If a tree branch shakes when there is no wind, it’s a ▒▒▒▒, not a tree. It hides from the rain."]],"186":["Politoed",["The cry of a male is louder than that of a female. Male ▒▒▒▒ with deep, menacing voices find more popularity with the opposite gender.","At nightfall, these Pokémon appear on the shores of lakes. They announce their territorial claims by letting out cries that sound like shouting.","The longer and more luxurious the curled hair on its head, the greater the number of Poliwag and Poliwhirl that will obey it."]],"187":["Hoppip",["This Pokémon drifts and floats with the wind. If it senses the approach of strong winds, ▒▒▒▒ links its leaves with other ▒▒▒▒ to prepare against being blown away.","It drifts on winds. It is said that when ▒▒▒▒ gather in fields and mountains, spring is on the way.","Its body is so light, it must grip the ground firmly with its feet to keep from being blown away."]],"188":["Skiploom",["It spreads its petals to absorb sunlight. It also floats in the air to get closer to the sun.","The bloom on top of its head opens and closes as the temperature fluctuates up and down.","It blooms when the weather warms. It floats in the sky to soak up as much sunlight as possible."]],"189":["Jumpluff",["▒▒▒▒ rides warm southern winds to cross the sea and fly to foreign lands. The Pokémon descends to the ground when it encounters cold air while it is floating.","Even in the fiercest wind, it can control its fluff to make its way to any place in the world it wants.","Blown by seasonal winds, it circles the globe, scattering cotton spores as it goes."]],"190":["Aipom",["This treetop dweller possesses a tail as dexterous as a hand. Ancient writings describe this Pokémon as a one-armed oddity.","It searches for prey from the tops of trees. When it spots its favorite food, Bounsweet, ▒▒▒▒ gets excited and pounces.","As it did more and more with its tail, its hands became clumsy. It makes its nest high in the treetops."]],"191":["Sunkern",["It lives by drinking only dewdrops from under the leaves of plants. It is said that it eats nothing else.","It may plummet from the sky. If attacked by a Spearow, it will violently shake its leaves.","It suddenly falls out of the sky in the morning. Knowing it’s weak, it simply feeds until it evolves."]],"192":["Sunflora",["▒▒▒▒ converts solar energy into nutrition. It moves around actively in the daytime when it is warm. It stops moving as soon as the sun goes down for the night.","It gets energy from warm sunlight and is known for its habit of moving in pursuit of it.","As the hot season approaches, the petals on this Pokémon’s face become more vivid and lively."]],"193":["Yanma",["Its frail wings are so thin that one can see clear through them. However, during flight these wings exhibit the power to churn air with force enough to launch a house skyward.","If it flaps its wings really fast, it can generate shock waves that will shatter windows in the area.","Its eyes can see 360 degrees without moving its head. It won’t miss prey--even those behind it."]],"194":["Wooper",["When walking on land, it covers its body with a poisonous film that keeps its skin from dehydrating.","This Pokémon lives in cold water. It will leave the water to search for food when it gets cold outside.","▒▒▒▒ usually lives in water. However, it occasionally comes out onto land in search of food. On land, it coats its body with a gooey, toxic film."]],"195":["Quagsire",["Its body is always slimy. It often bangs its head on the river bottom as it swims but seems not to care.","It has an easygoing nature. It doesn’t care if it bumps its head on boats and boulders while swimming.","▒▒▒▒ hunts for food by leaving its mouth wide open in water and waiting for its prey to blunder in unaware. Because the Pokémon does not move, it does not get very hungry."]],"196":["Espeon",["Wields an arcane power with which it can predict the weather and even people's thoughts. When bathed in sunshine, the scarlet orb on its brow glows and builds energy.","It unleashes psychic power from the orb on its forehead. When its power is exhausted, the orb grows dull and dark.","By reading air currents, it can predict things such as the weather or its foe’s next move."]],"197":["Umbreon",["It is most active in the wee hours of the night, when moonlight bathes the land. Its large eyes can pierce the darkness and perceive prey with absolute clarity.","On the night of a full moon, or when it gets excited, the ring patterns on its body glow yellow.","When this Pokémon becomes angry, its pores secrete a poisonous sweat, which it sprays at its opponent’s eyes."]],"198":["Murkrow",["It searches for shiny things for its boss. ▒▒▒▒’s presence is said to be unlucky, so many people detest it.","It has a weakness for shiny things. It’s been known to sneak into the nests of Gabite—noted collectors of jewels—in search of treasure.","Seen as a symbol of bad luck, it’s generally disliked. Yet it gives presents—objects that sparkle or shine—to Trainers it’s close to."]],"199":["Slowking",["▒▒▒▒ can solve any problem presented to it, but no one can understand a thing ▒▒▒▒ says.","Miraculously, this former Slowpoke’s latent intelligence was drawn out when Shellder poison raced through its brain.","It’s called “the sage of the sea.” It engages in battles of wits with Oranguru, but the result is usually a draw."]],"200":["Misdreavus",["What makes it happy is imitating the voices of weeping people and scaring everyone. It doesn’t deal well with folks who aren’t easily frightened.","What gives meaning to its life is surprising others. If you set your ear against the red orbs around its neck, you can hear shrieking.","If you hear a sobbing sound emanating from a vacant room, it’s undoubtedly a bit of mischief from ▒▒▒▒."]],"201":["Unown",["Shaped like ancient writing, it is a huge mystery whether language or ▒▒▒▒ came first.","Its flat, thin body is always stuck on walls. Its shape appears to have some meaning.","When alone, nothing happens. However, if there are two or more, an odd power is said to emerge."]],"202":["Wobbuffet",["To keep its pitch-black tail hidden, it lives quietly in the darkness. It is never first to attack.","It hates light and shock. If attacked, it inflates its body to pump up its counterstrike.","It hates light and shock. If attacked, it inflates its body to build up its counterstrike."]],"203":["Girafarig",["▒▒▒▒’s rear head contains a tiny brain that is too small for thinking. However, the rear head doesn’t need to sleep, so it can keep watch over its surroundings 24 hours a day.","Its tail has a small brain of its own. Beware! If you get close, it may react to your scent by biting.","While it sleeps, the head on its tail keeps watch. The tail doesn’t need to sleep."]],"204":["Pineco",["It sticks tree bark to itself with its saliva, making itself thicker and larger. Elderly ▒▒▒▒ are ridiculously huge.","Motionless, it hangs from trees, waiting for its bug Pokémon prey to come to it. Its favorite in Alola is Cutiefly.","It looks just like a ▒▒▒▒ne. Its shell protects it from bird Pokémon that peck it by mistake."]],"205":["Forretress",["In the moment that it gulps down its prey, the inside of its shell is exposed, but to this day, no one has ever seen that sight.","When something approaches it, it fires off fragments of its steel shell in attack. This is not a conscious action but a conditioned reflex.","It remains immovably rooted to its tree. It scatters pieces of its hard shell to drive its enemies away."]],"206":["Dunsparce",["The nests ▒▒▒▒ live in are mazes of tunnels. They never get lost in their own nests—they can tell where they are by the scent of the dirt.","This Pokémon’s tiny wings have some scientists saying that ▒▒▒▒ used to fly through the sky in ancient times.","When it sees a person, it digs a hole with its tail to make its escape. If you happen to find one, consider yourself lucky."]],"207":["Gligar",["It flies straight at its target’s face, then clamps down on the startled victim to inject poison.","It usually clings to cliffs. When it spots its prey, it spreads its wings and glides down to attack.","It clamps on to its chosen prey then jabs the stinger on its tail into the prey while it’s stunned with surprise."]],"208":["Steelix",["This Pokémon evolved through use of a strange item. Its body is coated with steel powder and notably hard—not even diamond can leave so much as a scratch.","It is thought its body transformed as a result of iron accumulating internally from swallowing soil.","It is said that if an Onix lives for over 100 years, its composition changes to become diamond-like."]],"209":["Snubbull",["In contrast to its appearance, it’s quite timid. When playing with other puppy Pokémon, it sometimes gets bullied.","It grows close to others easily and is also easily spoiled. The disparity between its face and its actions makes many young people wild about it.","Its growls make its opponents uneasy. This laid-back Pokémon tends to sleep half the day."]],"210":["Granbull",["Although it’s popular with young people, ▒▒▒▒ is timid and sensitive, so it’s totally incompetent as a watchdog.","While it has powerful jaws, it doesn’t care for disputes, so it rarely has a chance to display their might.","More timid than Snubbull, this Pokémon is doted on by young people amused at the contrast between its looks and its attitude."]],"211":["Qwilfish",["Fishers detest this troublesome Pokémon because it sprays poison from its spines, getting it everywhere. A different form of ▒▒▒▒ lives in other regions.","The small spikes covering its body developed from scales. They inject a toxin that causes fainting.","When faced with a larger opponent, it swallows as much water as it can to match the opponent’s size."]],"212":["Scizor",["Evolved by way of a curious item. The shell covering its body has been shown to be stronger than forged steel.","Though its body is slim, ▒▒▒▒ has tremendous attacking power. Even ▒▒▒▒’s muscles are made of metal.","Bulky pincers account for one third of ▒▒▒▒’s body weight. A single swing of one of these pincers will crush a boulder completely."]],"213":["Shuckle",["The berries stored in its vaselike shell eventually become a thick, pulpy juice.","It stores berries inside its shell. To avoid attacks, it hides beneath rocks and remains completely still.","The berries stored in its jar-like shell eventually become a thick, pulpy juice."]],"214":["Heracross",["This Pokémon has an unparalleled horn. ▒▒▒▒ itself demonstrates tremendous power—it's capable of throwing several people trained in the traditional arts of war at once.","This Pokémon takes pride in its strength, which allows it to lift things 100 times heavier than itself with no trouble at all.","▒▒▒▒ loves sweet sap and will go looking through forests for it. The Pokémon uses its two antennae to pick up scents as it searches."]],"215":["Sneasel",["Its sturdy, curved claws are ideal for traversing precipitous cliffs. From the tips of these claws drips a venom that infiltrates the nerves of any prey caught in ▒▒▒▒'s grasp.","It has a cunning yet savage disposition. It waits for parents to leave their nests, and then it sneaks in to steal their eggs.","Its paws conceal sharp claws. If attacked, it suddenly extends the claws and startles its enemy."]],"216":["Teddiursa",["This Pokémon likes to lick its palms that are sweetened by being soaked in honey. ▒▒▒▒ concocts its own honey by blending fruits and pollen collected by Beedrill.","Before food becomes scarce in wintertime, its habit is to hoard food in many hidden locations.","If it finds honey, its crescent mark glows. It always licks its paws because they’re soaked with honey."]],"217":["Ursaring",["In the forests inhabited by ▒▒▒▒, it is said that there are many streams and towering trees where they gather food. This Pokémon walks through its forest gathering food every day.","Although it has a large body, it is quite skilled at climbing trees. It eats and sleeps in the treetops.","With its ability to distinguish any aroma, it unfailingly finds all food buried deep underground."]],"218":["Slugma",["▒▒▒▒ does not have any blood in its body. Instead, intensely hot magma circulates throughout this Pokémon’s body, carrying essential nutrients and oxygen to its organs.","Molten magma courses throughout ▒▒▒▒’s circulatory system. If this Pokémon is chilled, the magma cools and hardens. Its body turns brittle and chunks fall off, reducing its size.","Its body is made of magma. If it doesn’t keep moving, its body will cool and harden."]],"219":["Magcargo",["Its body is as hot as lava and is always billowing. Flames will occasionally burst from its shell.","Its brittle shell occasionally spouts intense flames that circulate throughout its body.","Its body temperature is roughly 18,000 degrees F. Flames spout from gaps in its hardened shell."]],"220":["Swinub",["▒▒▒▒ excels at sniffing out mushrooms buried beneath grass or snow. Since ancient times, the people of Hisui have often relied upon this skill.","If it smells something enticing, it dashes off headlong to find the source of the aroma.","It rubs its snout on the ground to find and dig up food. It sometimes discovers hot springs."]],"221":["Piloswine",["The long fur of this Pokémon covers its eyes, ears, and even limbs, allowing ▒▒▒▒ to resist harshly frigid conditions. The Pokémon's white tusks can be used to defeat its enemies.","Although its legs are short, its rugged hooves prevent it from slipping, even on icy ground.","If it charges at an enemy, the hairs on its back stand up straight. It is very sensitive to sound."]],"222":["Corsola",["These Pokémon live in warm seas. In prehistoric times, many lived in the oceans around the Galar region as well.","It will regrow any branches that break off its head. People keep particularly beautiful ▒▒▒▒ branches as charms to promote safe childbirth.","In Alola, where their natural enemies Mareanie are plentiful, many ▒▒▒▒ have stubby branches on their heads."]],"223":["Remoraid",["Spits water from its mouth with incredible accuracy. It captures Burmy by shooting them down off the branches from which they dangle.","Using its dorsal fin as a suction pad, it clings to a Mantine’s underside to scavenge for leftovers.","The water they shoot from their mouths can hit moving prey from more than 300 feet away."]],"224":["Octillery",["It traps enemies with its suction-cupped tentacles, then smashes them with its rock-hard head.","It has a tendency to want to be in holes. It prefers rock crags or pots and sprays ink from them before attacking.","It usually sleeps in caves. The pitch-black ink that ▒▒▒▒ spits is also used for cooking."]],"225":["Delibird",["It has a generous habit of sharing its food with people and Pokémon, so it’s always scrounging around for more food.","It carries food all day long. There are tales about lost people who were saved by the food it had.","It wraps food in its tail to carry it around. The ▒▒▒▒ with the biggest tail is the boss of the flock!"]],"226":["Mantine",["This calm and gentle Pokémon swims gracefully through the sea. After building speed, it can leap out of the water. It is often misidentified as a bird Pokémon due to this behavior.","As it majestically swims, it doesn’t care if Remoraid attach to it to scavenge for its leftovers.","If it builds up enough speed swimming, it can jump out above the waves and glide for over 300 feet."]],"227":["Skarmory",["People fashion swords from ▒▒▒▒’s shed feathers, so this Pokémon is a popular element in heraldic designs.","The pointed feathers of these Pokémon are sharper than swords. ▒▒▒▒ and Corviknight fight viciously over territory.","Its body is draped in steel armor. It looks heavy, but it can fly at speeds of up to 185 miles an hour!"]],"228":["Houndour",["They make repeated eerie howls before dawn to call attention to their pack.","It cooperates with others skillfully. When it becomes your partner, it’s very loyal to you as its Trainer and will obey your orders.","▒▒▒▒ hunt as a coordinated pack. They communicate with each other using a variety of cries to corner their prey. This Pokémon’s remarkable teamwork is unparalleled."]],"229":["Houndoom",["Identifiable by its eerie howls, people a long time ago thought it was the grim reaper and feared it.","They spew flames mixed with poison to finish off their opponents. They divvy up their prey evenly among the members of their pack.","In a ▒▒▒▒ pack, the one with its horns raked sharply toward the back serves a leadership role. These Pokémon choose their leader by fighting among themselves."]],"230":["Kingdra",["Scales shed by this Pokémon have such a splendorous gleam to them that they’ve been given to royalty as gifts.","With the arrival of a storm at sea, this Pokémon will show itself on the surface. When a ▒▒▒▒ and a Dragonite meet, a fierce battle ensues.","▒▒▒▒ sleeps on the seafloor where it is otherwise devoid of life. When a storm arrives, the Pokémon is said to awaken and wander about in search of prey."]],"231":["Phanpy",["For its nest, ▒▒▒▒ digs a vertical pit in the ground at the edge of a river. It marks the area around its nest with its trunk to let the others know that the area has been claimed.","It is strong despite its compact size. It can easily pick up and carry an adult human on its back.","As a sign of affection, it bumps with its snout. However, it is so strong, it may send you flying."]],"232":["Donphan",["If ▒▒▒▒ were to tackle with its hard body, even a house could be destroyed. Using its massive strength, the Pokémon helps clear rock and mud slides that block mountain trails.","▒▒▒▒’s favorite attack is curling its body into a ball, then charging at its foe while rolling at high speed. Once it starts rolling, this Pokémon can’t stop very easily.","The longer and bigger its tusks, the higher its rank in its herd. The tusks take long to grow."]],"233":["Porygon2",["A bizarre item caused this Pokémon to evolve. While it now exhibits many new gestures and expressions, its biology remains inscrutable.","After artificial intelligence was implemented in ▒▒▒▒, the Pokémon began using a strange language that only other ▒▒▒▒ understand.","This is a Porygon that was updated with special data. ▒▒▒▒ develops itself by learning about many different subjects all on its own."]],"234":["Stantler",["Its strangely shaped antlers have the power to bewitch those who see them. Medicine made by grinding up the black orbs from fallen antlers is an effective treatment for insomnia.","▒▒▒▒’s magnificent antlers were traded at high prices as works of art. As a result, this Pokémon was hunted close to extinction by those who were after the priceless antlers.","The curved antlers subtly change the flow of air to create a strange space where reality is distorted."]],"235":["Smeargle",["It draws symbols with the fluid that oozes from the tip of its tail. Depending on the symbol, ▒▒▒▒ fanatics will pay big money for them.","The fluid of ▒▒▒▒’s tail secretions changes in the intensity of its hue as the Pokémon’s emotions change.","It draws symbols all over the place to mark its territory. In towns with many ▒▒▒▒, the walls are covered in graffiti."]],"236":["Tyrogue",["Even though it is small, it can’t be ignored because it will slug any handy target without warning.","It is always bursting with energy. To make itself stronger, it keeps on fighting even if it loses.","▒▒▒▒ becomes stressed out if it does not get to train every day. When raising this Pokémon, the Trainer must establish and uphold various training methods."]],"237":["Hitmontop",["After doing a handstand to throw off the opponent’s timing, it presents its fancy kick moves.","It launches kicks while spinning. If it spins at high speed, it may bore its way into the ground.","If you are enchanted by its smooth, dance-like kicks, you may get a closer experience with one than you’d like."]],"238":["Smoochum",["This is a very curious Pokémon. ▒▒▒▒ decides what it likes and dislikes by touching things with its lips.","If its face gets even slightly dirty, ▒▒▒▒ will bathe immediately. But if its body gets dirty, ▒▒▒▒ doesn’t really seem to care.","Highly perceptive sensors, ▒▒▒▒’s lips are kept moist by its daily application of tree sap."]],"239":["Elekid",["It’s not good at storing electricity yet. This Pokémon sneaks into people’s homes, looking for electrical outlets to eat electricity from.","When a storm approaches, this Pokémon gets restless. Once ▒▒▒▒ hears the sound of thunder, it gets full-on rowdy.","When its horns shine a bluish white, that’s the sign it’s fully charged. You’ll get a shocking jolt if you touch it!"]],"240":["Magby",["This Pokémon lives in volcanic areas. With each breath, sparks spurt from its mouth and nose. When ▒▒▒▒ is in good health, its flames gain a yellow tint.","This Pokémon makes its home near volcanoes. At the end of the day, ▒▒▒▒ soaks in magma, resting and recovering from the day’s fatigue.","This Pokémon is still small and timid. Whenever ▒▒▒▒ gets excited or surprised, flames leak from its mouth and its nose."]],"241":["Miltank",["This Pokémon needs to be milked every day, or else it will fall ill. The flavor of ▒▒▒▒ milk changes with the seasons.","▒▒▒▒ produces highly nutritious milk, so it’s been supporting the lives of people and other Pokémon since ancient times.","Its milk is delicious and chock-full of nutrients. However, if you drink too much, it could make your stomach hurt, so be careful."]],"242":["Blissey",["A kindhearted Pokémon that will care for any sick person or Pokémon until their health improves. The eggs it lays are delicious and bring good fortune to those who eat them.","▒▒▒▒ lays mysterious eggs that are filled with happiness. It’s said that anyone who eats a ▒▒▒▒ egg will start acting kindly to all others.","Whenever a ▒▒▒▒ finds a weakened Pokémon, it will share its egg and offer its care until the other Pokémon is all better."]],"243":["Raikou",["▒▒▒▒ embodies the speed of lightning. The roars of this Pokémon send shock waves shuddering through the air and shake the ground as if lightning bolts had come crashing down.","This rough Pokémon stores energy inside its body, then sweeps across the land, shooting off electricity.","The rain clouds it carries let it fire thunderbolts at will. They say that it descended with lightning."]],"244":["Entei",["It is said that when it roars, a volcano erupts somewhere around the globe.","A Pokémon that races across the land. It is said that one is born every time a new volcano appears.","Volcanoes erupt when it barks. Unable to contain its sheer power, it races headlong around the land."]],"245":["Suicune",["▒▒▒▒ embodies the compassion of a pure spring of water. It runs across the land with gracefulness. This Pokémon has the power to purify dirty water.","Said to be the embodiment of north winds, it can instantly purify filthy, murky water.","It races around the world to purify fouled water. It dashes away with the north wind."]],"246":["Larvitar",["It feeds on soil. After it has eaten a large mountain, it will fall asleep so it can grow.","Born deep underground, it comes aboveground and becomes a pupa once it has finished eating the surrounding soil.","Raised on nutrients it finds in the dirt, it eats roughly a mountain’s worth of dirt before it becomes a pupa."]],"247":["Pupitar",["It will not stay still, even while it’s a pupa. It already has arms and legs under its solid shell.","Even sealed in its shell, it can move freely. Hard and fast, it has outstanding destructive power.","This dangerous pupa thrashes about. Its shell is as hard as bedrock, containing its gradually forming new body within."]],"248":["Tyranitar",["The quakes caused when it walks make even great mountains crumble and change the surrounding terrain.","Its body can’t be harmed by any sort of attack, so it is very eager to make challenges against enemies.","This Pokémon is a mobile disaster, leaving mountains crumbled and houses destroyed in its wake."]],"249":["Lugia",["▒▒▒▒’s wings pack devastating power—a light fluttering of its wings can blow apart regular houses. As a result, this Pokémon chooses to live out of sight deep under the sea.","It is said to be the guardian of the seas. It is rumored to have been seen on the night of a storm.","It sleeps in a deep-sea trench. If it flaps its wings, it is said to cause a 40-day storm."]],"250":["Ho-Oh",["It will reveal itself before a pure-hearted Trainer by shining its bright, rainbow-colored wings.","A legend says that its body glows in seven colors. A rainbow is said to form behind it when it flies.","Its feathers are in seven colors. It is said that anyone seeing it is promised eternal happiness."]],"251":["Celebi",["This Pokémon traveled through time to come from the future. It bolsters grass and trees with its own strength, and it can heal wounds, too.","This Pokémon has the ability to move through time. Records describing it as a forest deity can be found from many different eras.","This Pokémon came from the future by crossing over time. It is thought that so long as ▒▒▒▒ appears, a bright and shining future awaits us."]],"252":["Treecko",["▒▒▒▒ is cool, calm, and collected—it never panics under any situation. If a bigger foe were to glare at this Pokémon, it would glare right back without conceding an inch of ground.","▒▒▒▒ has small hooks on the bottom of its feet that enable it to scale vertical walls. This Pokémon attacks by slamming foes with its thick tail.","Small hooks on the bottom of its feet catch on walls and ceilings. That is how it can hang from above."]],"253":["Grovyle",["This Pokémon adeptly flies from branch to branch in trees. In a forest, no Pokémon can ever hope to catch a fleeing ▒▒▒▒ however fast they may be.","The leaves growing out of ▒▒▒▒’s body are convenient for camouflaging it from enemies in the forest. This Pokémon is a master at climbing trees in jungles.","It lives in dense jungles. While closing in on its prey, it leaps from branch to branch."]],"254":["Sceptile",["▒▒▒▒ has seeds growing on its back. They are said to be bursting with nutrients that revitalize trees. This Pokémon raises the trees in a forest with loving care.","The leaves growing on ▒▒▒▒’s body are very sharp edged. This Pokémon is very agile—it leaps all over the branches of trees and jumps on its foe from above or behind.","It agilely leaps about the jungle and uses the sharp leaves on its arms to strike its prey."]],"255":["Torchic",["▒▒▒▒ has a place inside its body where it keeps its flame. Give it a hug—it will be glowing with warmth. This Pokémon is covered all over by a fluffy coat of down.","A fire burns inside, so it feels very warm to hug. It launches fireballs of 1,800 degrees Fahrenheit.","It has a flame sac inside its belly that perpetually burns. It feels warm if it is hugged."]],"256":["Combusken",["▒▒▒▒ battles with the intensely hot flames it spews from its beak and with outstandingly destructive kicks. This Pokémon’s cry is very loud and distracting.","▒▒▒▒ toughens up its legs and thighs by running through fields and mountains. This Pokémon’s legs possess both speed and power, enabling it to dole out 10 kicks in one second.","During a battle, the hot flame in its body increases. Its kicks have outstanding destructive power."]],"257":["Blaziken",["▒▒▒▒ has incredibly strong legs—it can easily clear a 30-story building in one leap. This Pokémon’s blazing punches leave its foes scorched and blackened.","In battle, ▒▒▒▒ blows out intense flames from its wrists and attacks foes courageously. The stronger the foe, the more intensely this Pokémon’s wrists burn.","When facing a tough foe, it looses flames from its wrists. Its powerful legs let it jump clear over buildings."]],"258":["Mudkip",["To alert it, the fin on its head senses the flow of water. It has the strength to heft boulders.","Its large tail fin propels it through water with powerful acceleration. It is strong in spite of its size.","Its power can crush boulders. It rests by covering itself with mud at the bottom of a river."]],"259":["Marshtomp",["▒▒▒▒ is much faster at traveling through mud than it is at swimming. This Pokémon’s hindquarters exhibit obvious development, giving it the ability to walk on just its hind legs.","The surface of ▒▒▒▒’s body is enveloped by a thin, sticky film that enables it to live on land. This Pokémon plays in mud on beaches when the ocean tide is low.","Living on muddy ground that provides poor footing has made its legs sturdy."]],"260":["Swampert",["▒▒▒▒ predicts storms by sensing subtle differences in the sounds of waves and tidal winds with its fins. If a storm is approaching, it piles up boulders to protect itself.","▒▒▒▒ is very strong. It has enough power to easily drag a boulder weighing more than a ton. This Pokémon also has powerful vision that lets it see even in murky water.","It can swim while towing a large ship. It bashes down foes with a swing of its thick arms."]],"261":["Poochyena",["At first sight, ▒▒▒▒ takes a bite at anything that moves. This Pokémon chases after prey until the victim becomes exhausted. However, it may turn tail if the prey strikes back.","It has a very tenacious nature. Its acute sense of smell lets it chase a chosen prey without ever losing track.","A Pokémon with a persistent nature, it chases its chosen prey until the prey becomes exhausted."]],"262":["Mightyena",["▒▒▒▒ travel and act as a pack in the wild. The memory of its life in the wild compels the Pokémon to obey only those Trainers that it recognizes to possess superior skill.","▒▒▒▒ gives obvious signals when it is preparing to attack. It starts to growl deeply and then flattens its body. This Pokémon will bite savagely with its sharply pointed fangs.","It chases down prey in a pack of around ten. They defeat foes with perfectly coordinated teamwork."]],"263":["Zigzagoon",["▒▒▒▒ that adapted to regions outside Galar acquired this appearance. If you’ve lost something, this Pokémon can likely find it.","It marks its territory by rubbing its bristly fur on trees. This variety of ▒▒▒▒ is friendlier and calmer than the kind native to Galar.","The hair on ▒▒▒▒’s back is bristly. It rubs the hard back hair against trees to leave its territorial markings. This Pokémon may play dead to fool foes in battle."]],"264":["Linoone",["It uses its explosive speed and razor-sharp claws to bring down prey. Running along winding paths is not its strong suit.","Its fur is strong and supple. Shaving brushes made with shed ▒▒▒▒ hairs are highly prized.","When hunting, ▒▒▒▒ will make a beeline straight for the prey at a full run. While this Pokémon is capable of topping 60 mph, it has to come to a screeching halt before it can turn."]],"265":["Wurmple",["Likes sap and is abundant in the wild. Why it evolves into various different forms is unknown. One cannot tell from a ▒▒▒▒'s appearance which form it will take when it evolves.","It lives among the tall grass and in forests. It repels attacks by raising up the spikes on its rear.","It loves to eat leaves. If it is attacked by a Starly, it will defend itself with its spiked rear."]],"266":["Silcoon",["It drinks dew that collects on its silk and waits for evolution. Its hard cocoon repels attacks.","It wraps silk around the branches of a tree. It drinks rainwater on its silk while awaiting evolution.","Having wrapped silk around the branches of a tree, it quiescently awaits evolution."]],"267":["Beautifly",["A colorful and incredibly beautiful but also greedy Pokémon. In an effort to keep its favorite food all to itself, it will chase away Combee as they try to gather nectar.","▒▒▒▒ has a long mouth like a coiled needle, which is very convenient for collecting pollen from flowers. This Pokémon rides the spring winds as it flits around gathering pollen.","▒▒▒▒’s favorite food is the sweet pollen of flowers. If you want to see this Pokémon, just leave a potted flower by an open window. ▒▒▒▒ is sure to come looking for pollen."]],"268":["Cascoon",["It never forgets any attack it endured while in the cocoon. After evolution, it seeks payback.","Its body, which is made of soft silk, hardens over time. When cracks appear, evolution is near.","It endures attacks with patience, because the more pain before evolution, the sturdier it becomes."]],"269":["Dustox",["Tends to be drawn to bonfires on dark nights. Difficult to chase away from settlements because of the way it scatters highly toxic scales.","It violently flutters its wings to scatter toxic dust when attacked. It becomes active after sunset.","A nocturnal Pokémon. Drawn by streetlights, they messily eat the leaves of trees lining boulevards."]],"270":["Lotad",["Its leaf grew too large for it to live on land. That is how it began to live floating in the water.","It searches about for clean water. If it does not drink water for too long, the leaf on its head wilts.","▒▒▒▒ live in ponds and lakes, where they float on the surface. It grows weak if its broad leaf dies. On rare occasions, this Pokémon travels on land in search of clean water."]],"271":["Lombre",["It lives at the water’s edge where it is sunny. It sleeps on a bed of water grass by day and becomes active at night.","It is nocturnal and becomes active at nightfall. It feeds on aquatic mosses that grow in the riverbed.","▒▒▒▒’s entire body is covered by a slippery, slimy film. It feels horribly unpleasant to be touched by this Pokémon’s hands. ▒▒▒▒ is often mistaken for a human child."]],"272":["Ludicolo",["If it hears festive music, it begins moving in rhythm in order to amplify its power.","The rhythm of bright, festive music activates ▒▒▒▒’s cells, making it more powerful.","Upon hearing an upbeat and cheerful rhythm, the cells in ▒▒▒▒’s body become very energetic and active. Even in battle, this Pokémon will exhibit an amazing amount of power."]],"273":["Seedot",["It attaches itself to a tree branch using the top of its head. Strong winds can sometimes make it fall.","If it remains still, it looks just like a real nut. It delights in surprising foraging Pokémon.","▒▒▒▒ looks exactly like an acorn when it is dangling from a tree branch. It startles other Pokémon by suddenly moving. This Pokémon polishes its body once a day using leaves."]],"274":["Nuzleaf",["They live in holes bored in large trees. The sound of ▒▒▒▒’s grass flute fills listeners with dread.","It lives deep in forests. With the leaf on its head, it makes a flute whose song makes listeners uneasy.","This Pokémon pulls out the leaf on its head and makes a flute with it. The sound of ▒▒▒▒’s flute strikes fear and uncertainty in the hearts of people lost in a forest."]],"275":["Shiftry",["It lives quietly in the deep forest. It is said to create chilly winter winds with the fans it holds.","A Pokémon that was feared as a forest guardian. It can read the foe’s mind and take preemptive action.","▒▒▒▒ is a mysterious Pokémon that is said to live atop towering trees dating back over a thousand years. It creates terrific windstorms with the fans it holds."]],"276":["Taillow",["▒▒▒▒ is young—it has only just left its nest. As a result, it sometimes becomes lonesome and cries at night. This Pokémon feeds on Wurmple that live in forests.","It dislikes cold seasons. They migrate to other lands in search of warmth, flying over 180 miles a day.","It has a gutsy spirit that makes it bravely take on tough foes. It flies in search of warm climates."]],"277":["Swellow",["▒▒▒▒ is very conscientious about the upkeep of its glossy wings. Once two ▒▒▒▒ are gathered, they diligently take care of cleaning each other’s wings.","It dives at a steep angle as soon as it spots its prey. It catches its prey with sharp claws.","If its two tail feathers are standing at attention, it is proof of good health. It soars elegantly in the sky."]],"278":["Wingull",["It soars on updrafts without flapping its wings. It makes a nest on sheer cliffs at the sea’s edge.","It makes its nest on sheer cliffs. Riding the sea breeze, it glides up into the expansive skies.","It builds nests in cliffs by the sea. It circles the skies above the ocean looking for its favorite food—Wishiwashi."]],"279":["Pelipper",["Skimming the water’s surface, it dips its large bill in the sea, scoops up food and water, and carries it.","It is a messenger of the skies, carrying small Pokémon and eggs to safety in its bill.","It scoops up Wishiwashi in its huge beak and swallows them whole. It can devour more than 30 at one go!"]],"280":["Ralts",["Tends to prefer people with a chipper disposition to those who are gloomy, but it has shown no discrimination with regard to age or gender. Needs more research.","If its horns capture the warm feelings of people or Pokémon, its body warms up slightly.","It is highly attuned to the emotions of people and Pokémon. It hides if it senses hostility."]],"281":["Kirlia",["It resembles a maiden in appearance, but it wields strange powers to project visions of paradise. I suspect the crimson ornaments on its head are the key to its abilities.","It has a psychic power that enables it to distort the space around it and see into the future.","If its Trainer becomes happy, it overflows with energy, dancing joyously while spinning about."]],"282":["Gardevoir",["To protect its Trainer, it will expend all its psychic power to create a small black hole.","It has the power to predict the future. Its power peaks when it is protecting its Trainer.","▒▒▒▒ has the psychokinetic power to distort the dimensions and create a small black hole. This Pokémon will try to protect its Trainer even at the risk of its own life."]],"283":["Surskit",["It lives in ponds and marshes that feature lots of plant life. It often fights with Dewpider, whose habitat and diet are similar.","If it’s in a pinch, it will secrete a sweet liquid from the tip of its head. Syrup made from gathering that liquid is tasty on bread.","When this Pokémon senses danger, a sweet fluid oozes from the tip of its head. The taste of it disgusts bird Pokémon."]],"284":["Masquerain",["Its thin, winglike antennae are highly absorbent. It waits out rainy days in tree hollows.","▒▒▒▒ intimidates enemies with the eyelike patterns of its eyespots. If that doesn’t work, it deftly makes its escape on its set of four wings.","Its wings and antennae don’t cope well with moisture. After a rain, it faces sunward to dry off."]],"285":["Shroomish",["If ▒▒▒▒ senses danger, it shakes its body and scatters spores from the top of its head. This Pokémon’s spores are so toxic, they make trees and weeds wilt.","It spouts poison spores from the top of its head. These spores cause pain all over if inhaled.","It prefers damp places. By day it remains still in the forest shade. It releases toxic powder from its head."]],"286":["Breloom",["The seeds ringing ▒▒▒▒’s tail are made of hardened toxic spores. It is horrible to eat the seeds. Just taking a bite of this Pokémon’s seed will cause your stomach to rumble.","▒▒▒▒ closes in on its foe with light and sprightly footwork, then throws punches with its stretchy arms. This Pokémon’s fighting technique puts boxers to shame.","It scatters poisonous spores and throws powerful punches while its foe is hampered by inhaled spores."]],"287":["Slakoth",["▒▒▒▒’s heart beats just once a minute. Whatever happens, it is content to loaf around motionless. It is rare to see this Pokémon in motion.","▒▒▒▒ lolls around for over 20 hours every day. Because it moves so little, it does not need much food. This Pokémon’s sole daily meal consists of just three leaves.","If it eats just three leaves in a day, it is satisfied. Other than that, it sleeps for 20 hours a day."]],"288":["Vigoroth",["Its stress level rises if it cannot keep moving constantly. Too much stress makes it feel sick.","Its heartbeat is fast and its blood so agitated that it can’t sit still for one second.","Its heart beats at a tenfold tempo, so it cannot sit still for even a moment."]],"289":["Slaking",["Wherever ▒▒▒▒ live, rings of over a yard in diameter appear in grassy fields. They are made by the Pokémon as it eats all the grass within reach while lying prone on the ground.","▒▒▒▒ spends all day lying down and lolling about. It eats grass growing within its reach. If it eats all the grass it can reach, this Pokémon reluctantly moves to another spot.","It is the world’s most slothful Pokémon. However, it can exert horrifying power by releasing pent-up energy all at once."]],"290":["Nincada",["It can sometimes live underground for more than 10 years. It absorbs nutrients from the roots of trees.","Because it lived almost entirely underground, it is nearly blind. It uses its antennae instead.","▒▒▒▒ lives underground. It uses its sharp claws to carve the roots of trees and absorb moisture and nutrients. This Pokémon can’t withstand bright sunlight so avoids it."]],"291":["Ninjask",["This Pokémon is so quick, it is said to be able to avoid any attack. It loves to feed on tree sap.","Its cry leaves a lasting headache if heard for too long. It moves so quickly that it is almost invisible.","▒▒▒▒ moves around at such a high speed that it cannot be seen, even while its crying can be clearly heard. For that reason, this Pokémon was long believed to be invisible."]],"292":["Shedinja",["A strange Pokémon—it flies without moving its wings, has a hollow shell for a body, and does not breathe.","A most peculiar Pokémon that somehow appears in a Poké Ball when a Nincada evolves.","▒▒▒▒ is a peculiar Pokémon. It seems to appear unsought in a Poké Ball after a Nincada evolves. This bizarre Pokémon is entirely immobile—it doesn’t even breathe."]],"293":["Whismur",["When ▒▒▒▒ cries, the sound of its own voice startles it, making the Pokémon cry even louder. It cries until it’s exhausted, then it falls asleep.","The cry of a ▒▒▒▒ is over 100 decibels. If you’re close to a ▒▒▒▒ when it lets out a cry, you’ll be stuck with an all-day headache.","▒▒▒▒ is very timid. If it starts to cry loudly, it becomes startled by its own crying and cries even harder. When it finally stops crying, the Pokémon goes to sleep, all tired out."]],"294":["Loudred",["The force of this Pokémon’s loud voice isn’t just the sound—it’s also the wave of air pressure that blows opponents away and damages them.","▒▒▒▒’s ears serve as speakers, and they can put out sound waves powerful enough to blow away a house.","▒▒▒▒ shouts while stamping its feet. After it finishes shouting, this Pokémon becomes incapable of hearing anything for a while. This is considered to be a weak point."]],"295":["Exploud",["This Pokémon can do more than just shout. To communicate with others of its kind, it’ll emit all sorts of sounds from the holes in its body.","In the past, people would use the loud voices of these Pokémon as a means of communication between distant cities.","▒▒▒▒ communicates its feelings to the others by emitting whistle-like sounds from the tubes on its body. This Pokémon only raises its voice when it is in battle."]],"296":["Makuhita",["There’s a rumor of a traditional recipe for stew that Trainers can use to raise strong ▒▒▒▒.","It practices its slaps by repeatedly slapping tree trunks. It has been known to slap an Exeggutor and get flung away.","Their daily routine consists of training together first thing in the morning, eating and napping in the afternoon, and then more training afterward."]],"297":["Hariyama",["▒▒▒▒ that are big and fat aren’t necessarily strong. There are some small ones that move nimbly and use moves skillfully.","Although they enjoy comparing their strength, they’re also kind. They value etiquette, praising opponents they battle.","They love to compare their freakish strength— strength enough to send a truck flying with a single slap."]],"298":["Azurill",["Although ▒▒▒▒ are normally docile, an angry one will swing around the big ball on its tail and try to smash its opponents.","The ball on ▒▒▒▒’s tail bounces like a rubber ball, and it’s full of the nutrients the Pokémon needs to grow.","▒▒▒▒’s tail is large and bouncy. It is packed full of the nutrients this Pokémon needs to grow. ▒▒▒▒ can be seen bouncing and playing on its big, rubbery tail."]],"299":["Nosepass",["It hunts without twitching a muscle by pulling in its prey with powerful magnetism. But sometimes it pulls natural enemies in close.","It moves less than an inch a year, but when it’s in a jam, it will spin and drill down into the ground in a split second.","It uses powerful magnetism to drag its prey toward it. It’s also been known to pull in metal, which it collects and uses to protect itself."]],"300":["Skitty",["▒▒▒▒ has the habit of becoming fascinated by moving objects and chasing them around. This Pokémon is known to chase after its own tail and become dizzy.","It shows its cute side by chasing its own tail until it gets dizzy.","It can’t stop itself from chasing moving things, and it runs in a circle, chasing its own tail."]],"301":["Delcatty",["▒▒▒▒ sleeps anywhere it wants without keeping a permanent nest. If other Pokémon approach it as it sleeps, this Pokémon will never fight—it will just move away somewhere else.","It is highly popular among female Trainers for its sublime fur. It does not keep a nest.","It dislikes dirty places. It often searches for a comfortable place in which to groom itself."]],"302":["Sableye",["It feeds on gemstone crystals. In darkness, its eyes sparkle with the glitter of jewels.","This Pokémon is feared. When its gemstone eyes begin to glow with a sinister shine, it’s believed that ▒▒▒▒ will steal people’s spirits away.","Materials from gems it has eaten float to the surface of its body and can form an infinite number of patterns among individuals."]],"303":["Mawile",["It chomps with its gaping mouth. Its huge jaws are actually steel horns that have been transformed.","It uses its docile-looking face to lull foes into complacency, then bites with its huge, relentless jaws.","It has two mouths. The big jaws on the back of its head can’t taste anything, so that’s the mouth it uses to eat foods it doesn’t like."]],"304":["Aron",["When ▒▒▒▒ evolves, its steel armor peels off. In ancient times, people would collect ▒▒▒▒’s shed armor and make good use of it in their daily lives.","It eats iron ore—and sometimes railroad tracks— to build up the steel armor that protects its body.","▒▒▒▒ has a body of steel. With one all-out charge, this Pokémon can demolish even a heavy dump truck. The destroyed dump truck then becomes a handy meal for the Pokémon."]],"305":["Lairon",["During territorial disputes, ▒▒▒▒ fight by slamming into each other. Close inspection of their steel armor reveals scratches and dents.","▒▒▒▒ live in mountains brimming with spring water and iron ore, so these Pokémon often came into conflict with humans in the past.","▒▒▒▒ feeds on iron contained in rocks and water. It makes its nest on mountains where iron ore is buried. As a result, the Pokémon often clashes with humans mining the iron ore."]],"306":["Aggron",["Long ago, there was a king who wore a helmet meant to resemble the head of an ▒▒▒▒. He was trying to channel the Pokémon’s strength.","▒▒▒▒ has a horn sharp enough to perforate thick iron sheets. It brings down its opponents by ramming into them horn first.","▒▒▒▒ claims an entire mountain as its own territory. It mercilessly beats up anything that violates its environment. This Pokémon vigilantly patrols its territory at all times."]],"307":["Meditite",["▒▒▒▒ heightens its inner energy through meditation. It survives on just one berry a day. Minimal eating is another aspect of this Pokémon’s training.","It eats just one berry a day. By enduring hunger, its spirit is tempered and made sharper.","It always trains deep in mountains. It levitates when it heightens its spiritual power through meditation."]],"308":["Medicham",["It is said that through meditation, ▒▒▒▒ heightens energy inside its body and sharpens its sixth sense. This Pokémon hides its presence by merging itself with fields and mountains.","Through yoga training, it gained the psychic power to predict its foe’s next move.","It elegantly avoids attacks with dance-like steps, then launches a devastating blow in the same motion."]],"309":["Electrike",["It stores electricity in its fur. It gives off sparks from all over its body in seasons when the air is dry.","It stores static electricity in its fur for discharging. It gives off sparks if a storm approaches.","Static electricity builds up all over its body as strands of its long fur rub together. This Pokémon boasts incredible speed."]],"310":["Manectric",["It rarely appears before people. It is said to nest where lightning has fallen.","It stimulates its own muscles with electricity, so it can move quickly. It eases its soreness with electricity, too, so it can recover quickly as well.","▒▒▒▒ can be found beneath unnatural thunderclouds. People say it can run at the same speed as lightning striking."]],"311":["Plusle",["When ▒▒▒▒ is cheering on its partner, it flashes with electric sparks from all over its body. If its partner loses, this Pokémon cries loudly.","It absorbs electricity from telephone poles. It shorts out its body to create crackling noises.","It cheers on friends with pom-poms made of sparks. It drains power from telephone poles."]],"312":["Minun",["It cheers on friends. If its friends are losing, its body lets off more and more sparks.","Exposure to electricity from ▒▒▒▒ and Plusle promotes blood circulation and relaxes muscles.","Its dislike of water makes it take shelter under the eaves of houses in rain. It uses pom-poms made of sparks for cheering."]],"313":["Volbeat",["▒▒▒▒’s tail glows like a lightbulb. With other ▒▒▒▒, it uses its tail to draw geometric shapes in the night sky. This Pokémon loves the sweet aroma given off by Illumise.","It lives around clean ponds. At night, its rear lights up. It converses with others by flashing its light.","It communicates with others by lighting up its rear at night. It loves Illumise’s sweet aroma."]],"314":["Illumise",["▒▒▒▒ leads a flight of illuminated Volbeat to draw signs in the night sky. This Pokémon is said to earn greater respect from its peers by composing more complex designs in the sky.","With its sweet aroma, it guides Volbeat to draw signs with light in the night sky.","Its fragrance attracts a swarm of Volbeat, so they draw over 200 patterns in the night sky."]],"315":["Roselia",["Though beautiful, it has highly poisonous thorns. There is an old tradition in my homeland wherein one would send these thorns to an opponent to challenge them to a duel.","It uses the different poisons in each hand separately when it attacks. The stronger its aroma, the healthier it is.","Its flowers give off a relaxing fragrance. The stronger its aroma, the healthier the ▒▒▒▒ is."]],"316":["Gulpin",["Most of ▒▒▒▒’s body is made up of its stomach—its heart and brain are very small in comparison. This Pokémon’s stomach contains special enzymes that dissolve anything.","Virtually all of ▒▒▒▒’s body is its stomach. As a result, it can swallow something its own size. This Pokémon’s stomach contains a special fluid that digests anything.","There is nothing its stomach can’t digest. While it is digesting, vile, overpowering gases are expelled."]],"317":["Swalot",["▒▒▒▒ has no teeth, so what it eats, it swallows whole, no matter what. Its cavernous mouth yawns widely. An automobile tire could easily fit inside this Pokémon’s mouth.","It gulps anything that fits in its mouth. Its special enzymes can dissolve anything.","It swallows anything whole. It sweats toxic fluids from its follicles to douse foes."]],"318":["Carvanha",["These Pokémon have sharp fangs and powerful jaws. Sailors avoid ▒▒▒▒ dens at all costs.","It won’t attack while it’s alone—not even if it spots prey. Instead, it waits for other ▒▒▒▒ to join it, and then the Pokémon attack as a group.","With its sturdy jaws and fangs, it can easily chomp wooden boats to splinters. It fights with Basculin over food."]],"319":["Sharpedo",["This Pokémon is known as the Bully of the Sea. Any ship entering the waters ▒▒▒▒ calls home will be attacked—no exceptions.","As soon as it catches the scent of prey, ▒▒▒▒ will jet seawater from its backside, hurtling toward the target to attack at 75 mph.","It drinks in seawater and jets it from its rear to propel itself. It’s very sensitive to the scent of blood."]],"320":["Wailmer",["When it sucks in a large volume of seawater, it becomes like a big, bouncy ball. It eats a ton of food daily.","It shows off by spraying jets of seawater from the nostrils above its eyes. It eats a solid ton of Wishiwashi every day.","Due to their memories of when they once lived on land, pods of them will, very rarely, wash up on shore."]],"321":["Wailord",["Its immense size is the reason for its popularity. ▒▒▒▒ watching is a favorite sightseeing activity in various parts of the world.","It can sometimes knock out opponents with the shock created by breaching and crashing its big body onto the water.","When a small Wailmer is attacked by Sharpedo or Dhelmise, its whole pod works together to protect it."]],"322":["Numel",["▒▒▒▒ is extremely dull witted—it doesn’t notice being hit. However, it can’t stand hunger for even a second. This Pokémon’s body is a seething cauldron of boiling magma.","The magma in its body reaches 2,200 degrees Fahrenheit. Its hump gets smaller when it uses Fire-type moves.","Its humped back stores intensely hot magma. In rain, the magma cools, slowing its movement."]],"323":["Camerupt",["The humps on ▒▒▒▒’s back are formed by a transformation of its bones. They sometimes blast out molten magma. This Pokémon apparently erupts often when it is enraged.","If angered, the humps on its back erupt in a shower of molten lava. It lives in the craters of volcanoes.","The volcanoes on its back have a major eruption every 10 years--or whenever it becomes really angry."]],"324":["Torkoal",["You find abandoned coal mines full of them. They dig tirelessly in search of coal.","It burns coal inside its shell for energy. It blows out black soot if it is endangered.","It burns coal to produce energy. When it has burned through all of its coal, it becomes unable to move."]],"325":["Spoink",["▒▒▒▒ keeps a pearl on top of its head. The pearl functions to amplify this Pokémon’s psychokinetic powers. It is therefore on a constant search for a bigger pearl.","▒▒▒▒ bounces around on its tail. The shock of its bouncing makes its heart pump. As a result, this Pokémon cannot afford to stop bouncing—if it stops, its heart will stop.","It bounces around on its tail to keep its heart pumping. It carries a pearl from Clamperl on its head."]],"326":["Grumpig",["▒▒▒▒ uses the black pearls on its body to wield its fantastic powers. When it is doing so, it dances bizarrely. This Pokémon’s black pearls are valuable as works of art.","It uses black pearls to amplify its psychic power. It does an odd dance to gain control over foes.","It uses black pearls to amplify its psychic power. It does a strange dance to control foes’ minds."]],"327":["Spinda",["Each ▒▒▒▒’s spot pattern is different. With its stumbling movements, it evades opponents’ attacks brilliantly!","Its steps are shaky and stumbling. Walking for a long time makes it feel sick.","Each and every ▒▒▒▒ has a slightly different configuration of spots. There are collectors who enjoy the tiny differences in their spot patterns."]],"328":["Trapinch",["It makes an inescapable conical pit and lies in wait at the bottom for prey to come tumbling down.","Its nest is a sloped, bowl-like pit in the desert. Once something has fallen in, there is no escape.","It builds nests that double as traps, lying in wait for its prey to get caught. When night falls, it digs itself a spot beneath the sand to sleep."]],"329":["Vibrava",["To help make its wings grow, it dissolves quantities of prey in its digestive juices and guzzles them down every day.","The ultrasonic waves it generates by rubbing its two wings together cause severe headaches.","It vibrates its wings to send out odd sound waves. Trainers who are with it need earplugs."]],"330":["Flygon",["It is nicknamed the Desert Spirit because the flapping of its wings sounds like a woman singing.","This Pokémon hides in the heart of sandstorms it creates and seldom appears where people can see it.","People continue to have their hearts stolen by its enchanting songs and find themselves stranded in the desert."]],"331":["Cacnea",["The more arid and harsh the environment, the more pretty and fragrant a flower ▒▒▒▒ grows. This Pokémon battles by wildly swinging its thorny arms.","It prefers harsh environments such as deserts. It can survive for 30 days on water stored in its body.","It lives in arid locations. Its yellow flowers bloom once a year."]],"332":["Cacturne",["During the daytime, ▒▒▒▒ remains unmoving so that it does not lose any moisture to the harsh desert sun. This Pokémon becomes active at night when the temperature drops.","Packs of them follow travelers through the desert until the travelers can no longer move.","It becomes active at night, seeking prey that is exhausted from the day’s desert heat."]],"333":["Swablu",["Since ▒▒▒▒ looks like a cumulus cloud, foes can have a hard time finding it. Apparently its wings turned white over many generations.","Its cottony wings are full of air, making them light and fluffy to the touch. ▒▒▒▒ takes diligent care of its wings.","▒▒▒▒ has light and fluffy wings that are like cottony clouds. This Pokémon is not frightened of people. It lands on the heads of people and sits there like a cotton-fluff hat."]],"334":["Altaria",["This Pokémon has a kind disposition, but if it’s provoked, it will threaten opponents with shrill cries before attacking them without mercy.","As it flies in a calm and relaxed manner, ▒▒▒▒ performs a humming song that would enrapture any audience.","▒▒▒▒ sings in a gorgeous soprano. Its wings are like cotton clouds. This Pokémon catches updrafts with its buoyant wings and soars way up into the wild blue yonder."]],"335":["Zangoose",["Memories of battling its archrival Seviper are etched into every cell of ▒▒▒▒’s body. This Pokémon adroitly dodges attacks with incredible agility.","Its fur would all stand on end if it smelled a Seviper nearby. Its sharp claws tear up its foes.","It has feuded with Seviper for many generations. Its sharp claws are its biggest weapons."]],"336":["Seviper",["▒▒▒▒’s swordlike tail serves two purposes—it slashes foes and douses them with secreted poison. This Pokémon will not give up its long-running blood feud with Zangoose.","▒▒▒▒ shares a generations-long feud with Zangoose. The scars on its body are evidence of vicious battles. This Pokémon attacks using its sword-edged tail.","Constant polishing makes the edge of the blade on its tail extremely sharp. It’s Zangoose’s archrival."]],"337":["Lunatone",["It was discovered at the site of a meteor strike 40 years ago. Its stare can lull its foes to sleep.","The phase of the moon apparently has some effect on its power. It’s active on the night of a full moon.","Because it turns active on nights of the full moon, it is said to have some link to the lunar phases."]],"338":["Solrock",["Solar energy is the source of its power, so it is strong during the daytime. When it spins, its body shines.","When it rotates itself, it gives off light similar to the sun, thus blinding its foes.","Sunlight is the source of ▒▒▒▒’s power. It is said to possess the ability to read the emotions of others. This Pokémon gives off intense heat while rotating its body."]],"339":["Barboach",["Makes its home in swamps with murky water. The poor visibility hides this Pokémon from predators, and the slime on its body makes grasping it difficult.","It probes muddy riverbeds with its two long whiskers. A slimy film protects its body.","Its slimy body is hard to grasp. In one region, it is said to have been born from hardened mud."]],"340":["Whiscash",["It claims a large swamp to itself. If a foe comes near it, it sets off tremors by thrashing around.","It makes its nest at the bottom of swamps. It will eat anything—if it is alive, ▒▒▒▒ will eat it.","Its vision is not that good. It senses vibrations in the water with its whiskers to determine the location of its prey."]],"341":["Corphish",["It was originally a Pokémon from afar that escaped to the wild. It can adapt to the dirtiest river.","No matter how dirty the water in the river, it will adapt and thrive. It has a strong will to survive.","It can adapt very well to its environment. Feebas and ▒▒▒▒ are about the only Pokémon to live in stagnant ditches."]],"342":["Crawdaunt",["A brutish Pokémon that loves to battle. It will crash itself into any foe that approaches its nest.","A rough customer that wildly flails its giant claws. It is said to be extremely hard to raise.","Its pincers often fall off. Unlike with Crabrawler or Clauncher, the meat in its claws is utterly nasty and stinking."]],"343":["Baltoy",["It was discovered in ancient ruins. While moving, it constantly spins. It stands on one foot even when asleep.","It moves while spinning around on its single foot. Some ▒▒▒▒ have been seen spinning on their heads.","When they find others of their kind, they cry out loudly and gather together. Large numbers of them can be found in old graveyards."]],"344":["Claydol",["It appears to have been born from clay dolls made by ancient people. It uses telekinesis to float and move.","This mysterious Pokémon started life as an ancient clay figurine made over 20,000 years ago.","The ancient people who made it apparently modeled it after something that descended from the sky. It fires beams from both arms."]],"345":["Lileep",["▒▒▒▒ clings to rocks on the seabed. When prey comes close, this Pokémon entangles it with petallike tentacles.","This Pokémon was restored from a fossil. ▒▒▒▒ once lived in warm seas that existed approximately 100,000,000 years ago.","It sticks to rocks with its powerful suckers and can’t be washed away no matter how rough the surf gets."]],"346":["Cradily",["Once ▒▒▒▒ catches prey in its tentacles, it digests them whole and absorbs their nutrients.","It has short legs and can’t walk very fast, but its neck and tentacles can extend to over three times their usual length to nab distant prey.","This carnivorous Pokémon lived in primordial seas. It catches prey in its eight tentacles and dissolves them with digestive fluid as it eats."]],"347":["Anorith",["▒▒▒▒ can swim swiftly by pulling its eight wings through the water like oars on a boat. This Pokémon is an ancestor of modern bug Pokémon.","This Pokémon was restored from a fossil. ▒▒▒▒ lived in the ocean about 100,000,000 years ago, hunting with its pair of claws.","This is one kind of primeval bug Pokémon. With eight wings, it could apparently swim a lot faster than you’d expect."]],"348":["Armaldo",["Though it lives on land, it’s also a good swimmer. It dives into the ocean in search of prey, using its sharp claws to take down its quarry.","After evolution, this Pokémon emerged onto land. Its lower body has become stronger, and blows from its tail are devastating.","▒▒▒▒ adapted from living in water to living on land. It has been determined that it is the ancestor of some bug Pokémon."]],"349":["Feebas",["It is a shabby and ugly Pokémon. However, it is very hardy and can survive on little water.","Although unattractive and unpopular, this Pokémon’s marvelous vitality has made it a subject of research.","Because of its wretched appearance, most people pay it no attention, but there are some who collect ▒▒▒▒—and ▒▒▒▒ alone!"]],"350":["Milotic",["It’s said that a glimpse of a ▒▒▒▒ and its beauty will calm any hostile emotions you’re feeling.","▒▒▒▒ has provided inspiration to many artists. It has even been referred to as the most beautiful Pokémon of all.","Its dwelling place is the bottom of big lakes. Those who behold its loveliness are said to have their hearts purified."]],"351":["Castform",["Its form changes depending on the weather. The rougher conditions get, the rougher ▒▒▒▒’s disposition!","Although its form changes with the weather, that is apparently the result of a chemical reaction and not the result of its own free will.","Its form changes on its own, due to its cells’ sensitive reactions to temperature and humidity."]],"352":["Kecleon",["Its color changes for concealment and also when its mood or health changes. The darker the color, the healthier it is.","It changes its hue to blend into its surroundings. If no one takes notice of it for too long, it will pout and never reveal itself.","▒▒▒▒ is capable of changing its body colors at will to blend in with its surroundings. There is one exception—this Pokémon can’t change the zigzag pattern on its belly."]],"353":["Shuppet",["There’s a proverb that says, “Shun the house where ▒▒▒▒ gather in the growing dusk.”","It eats up emotions like malice, jealousy, and resentment, so some people are grateful for its presence.","▒▒▒▒ grows by feeding on dark emotions, such as vengefulness and envy, in the hearts of people. It roams through cities in search of grudges that taint people."]],"354":["Banette",["Resentment at being cast off made it spring into being. Some say that treating it well will satisfy it, and it will once more become a stuffed toy.","It’s a stuffed toy that was thrown away and became possessed, ever searching for the one who threw it away so it can exact its revenge.","A cursed energy permeated the stuffing of a discarded and forgotten plush doll, giving it new life as ▒▒▒▒. The Pokémon’s energy would escape if it were to ever open its mouth."]],"355":["Duskull",["Making itself invisible, it silently sneaks up to prey. It has the ability to slip through thick walls.","If it finds bad children who won’t listen to their parents, it will spirit them away—or so it’s said.","▒▒▒▒ can pass through any wall no matter how thick it may be. Once this Pokémon chooses a target, it will doggedly pursue the intended victim until the break of dawn."]],"356":["Dusclops",["It seeks drifting will-o’-the-wisps and sucks them into its empty body. What happens inside is a mystery.","Its body is entirely hollow. When it opens its mouth, it sucks everything in as if it were a black hole.","Its body is hollow. It is said that those who look into its body are sucked into the void."]],"357":["Tropius",["Bunches of delicious fruit grow around its neck. In warm areas, many ranches raise ▒▒▒▒.","The bunches of fruit growing around the necks of ▒▒▒▒ in Alola are especially sweet compared to those in other regions.","Children of the southern tropics eat as snacks the fruit that grows in bunches around the neck of ▒▒▒▒. This Pokémon flies by flapping the leaves on its back as if they were wings."]],"358":["Chimecho",["Can emit waves of air powerful enough to knock out prey taller than itself. I hypothesize that it amplifies the faint sound of wind within its body.","In high winds, ▒▒▒▒ cries as it hangs from a tree branch or the eaves of a building using a suction cup on its head. This Pokémon plucks berries with its long tail and eats them.","▒▒▒▒ makes its cries echo inside its hollow body. When this Pokémon becomes enraged, its cries result in ultrasonic waves that have the power to knock foes flying."]],"359":["Absol",["Because of this Pokémon’s ability to detect danger, people mistook ▒▒▒▒ as a bringer of doom.","Swift as the wind, ▒▒▒▒ races through fields and mountains. Its curved, bow-like horn is acutely sensitive to the warning signs of natural disasters.","The elderly call it the disaster Pokémon and detest it, but interest in its power to predict disasters is on the rise."]],"360":["Wynaut",["It tends to move in a pack with others. They cluster in a tight group to sleep in a cave.","It tends to move in a pack. Individuals squash against one another to toughen their spirits.","▒▒▒▒ gather on moonlit nights to play by squeezing up against each other. By being squeezed, this Pokémon gains endurance and is trained to dole out powerful counterattacks."]],"361":["Snorunt",["It can only survive in cold areas. It bounces happily around, even in environments as cold as −150 degrees Fahrenheit.","It’s said that if they are seen at midnight, they’ll cause heavy snow. They eat snow and ice to survive.","Rich people from cold areas all share childhood memories of playing with ▒▒▒▒."]],"362":["Glalie",["It covers its body with an armor of ice harder than steel. Uses its breath to freeze prey, which it then devours as if they were frozen desserts.","It can instantly freeze moisture in the atmosphere. It uses this power to freeze its foes.","It has a body of ice that won’t melt, even with fire. It can instantly freeze moisture in the atmosphere."]],"363":["Spheal",["As it drifts among the waves, ▒▒▒▒ probes the sea. As soon as it spots prey, it informs the Walrein in its herd.","This Pokémon’s body is covered in blubber and impressively round. It’s faster for ▒▒▒▒ to roll around than walk.","▒▒▒▒ always travels by rolling around on its ball-like body. When the season for ice floes arrives, this Pokémon can be seen rolling about on ice and crossing the sea."]],"364":["Sealeo",["Its white whiskers are very sensitive. ▒▒▒▒ will balance Spheal on the tip of its nose, checking its scent and its feel to be sure the Spheal is healthy.","This Pokémon has a habit of spinning round things on its nose, whether those things are Poké Balls or Spheal.","▒▒▒▒ live on top of drift ice. They go swimming when they’re on the hunt, seeking out their prey by scent."]],"365":["Walrein",["▒▒▒▒’s tusks keep growing throughout its life. Tusks broken in battle will grow back to their usual impressive size in a year.","▒▒▒▒ form herds of 20 to 30 individuals. When a threat appears, the herd’s leader will protect the group with its life.","▒▒▒▒ swims all over in frigid seawater while crushing icebergs with its grand, imposing tusks. Its thick layer of blubber makes enemy attacks bounce off harmlessly."]],"366":["Clamperl",["▒▒▒▒’s pearls are exceedingly precious. They can be more than 10 times as costly as Shellder’s pearls.","Despite its appearance, it’s carnivorous. It clamps down on its prey with both sides of its shell and doesn’t let go until they stop moving.","▒▒▒▒’s sturdy shell is not only good for protection—it is also used for clamping and catching prey. A fully grown ▒▒▒▒’s shell will be scored with nicks and scratches all over."]],"367":["Huntail",["Deep seas are their habitat. According to tradition, when ▒▒▒▒ wash up onshore, something unfortunate will happen.","It’s not the strongest swimmer. It wags its tail to lure in its prey and then gulps them down as soon as they get close.","It lives deep in the sea. With a tail shaped like a small fish, it attracts unsuspecting prey."]],"368":["Gorebyss",["It sucks bodily fluids out of its prey. The leftover meat sinks to the seafloor, where it becomes food for other Pokémon.","The color of its body changes with the water temperature. The coloration of ▒▒▒▒ in Alola is almost blindingly vivid.","Its swimming form is exquisitely elegant. With its thin mouth, it feeds on seaweed that grows between rocks."]],"369":["Relicanth",["This Pokémon was discovered during deep-sea exploration. Its appearance hasn’t changed in 100,000,000 years, so it’s called a living fossil.","Rock-hard scales and oil-filled swim bladders allow this Pokémon to survive the intense water pressure of the deep sea.","The reason it hasn’t changed at all in a hundred million years is that it’s apparently already a perfect life-form."]],"370":["Luvdisc",["▒▒▒▒ makes its home in coral reefs in warm seas. It especially likes sleeping in the space between Corsola’s branches.","There was an era when it was overfished due to the rumor that having one of its heart-shaped scales would enable you to find a sweetheart.","Loving couples have a soft spot for this Pokémon, so honeymoon hotels often release this Pokémon into their pools."]],"371":["Bagon",["▒▒▒▒ is a solitary Pokémon that doesn’t form groups with others of its kind. It also has a head hard enough to cleave a boulder in one strike.","▒▒▒▒ jumps off cliffs every day, trying to grow stronger so that someday it will be able to fly.","Some theories suggest that its behavior of forcefully bashing its head into things stimulates cells that affect its evolution."]],"372":["Shelgon",["▒▒▒▒ ignores its hunger entirely, never eating any food. Apparently, ▒▒▒▒ will evolve once all its energy stores are used up.","This Pokémon has covered its body in a hard shell that has the same composition as bone. ▒▒▒▒ stores energy for evolution.","▒▒▒▒ lives deep within caves. It stays shut up in its hard shell, dreaming of the day it will be able to fly."]],"373":["Salamence",["While basking in the joy of flight generally keeps this Pokémon in high spirits, ▒▒▒▒ turns into an uncontrollable menace if something angers it.","▒▒▒▒ is an unusual Pokémon in that it was able to evolve a body with wings just by constantly wishing to be able to fly.","Thanks to its fervent wishes, the cells in its body finally mutated, and at last it has its heart’s desire—wings."]],"374":["Beldum",["The cells in this Pokémon’s body are composed of magnetic material. Instead of blood, magnetic forces flow through ▒▒▒▒’s body.","From its rear, ▒▒▒▒ emits a magnetic force that rapidly pulls opponents in. They get skewered on ▒▒▒▒’s sharp claws.","If you anger it, it will do more than rampage. It will also burst out strong magnetism, causing nearby machines to break."]],"375":["Metang",["Using magnetic forces to stay aloft, this Pokémon flies at high speeds, weaving through harsh mountain terrain in pursuit of prey.","Two Beldum have become stuck together via their own magnetic forces. With two brains, the resulting ▒▒▒▒ has doubled psychic powers.","It flies at high speeds around the skies. When it finds its prey, ▒▒▒▒ takes a firm grip with its sharp claws and never lets go."]],"376":["Metagross",["▒▒▒▒ is the result of the fusion of two Metang. This Pokémon defeats its opponents through use of its supercomputer-level brain.","Because the magnetic powers of these Pokémon get stronger in freezing temperatures, ▒▒▒▒ living on snowy mountains are full of energy.","It analyzes its opponents with more accuracy than a supercomputer, which enables it to calmly back them into a corner."]],"377":["Regirock",["Cutting-edge technology was used to study the internals of this Pokémon’s rock body, but nothing was found—not even a brain or a heart.","Every bit of ▒▒▒▒’s body is made of stone. As parts of its body erode, this Pokémon sticks rocks to itself to repair what’s been lost.","▒▒▒▒’s body is composed entirely of rocks. Recently, a study made the startling discovery that the rocks were all unearthed from different locations."]],"378":["Regice",["This Pokémon’s body is made of solid ice. It’s said that ▒▒▒▒ was born beneath thick ice in the ice age.","With cold air that can reach temperatures as low as −328 degrees Fahrenheit, ▒▒▒▒ instantly freezes any creature that approaches it.","▒▒▒▒’s body was made during an ice age. The deep-frozen body can’t be melted, even by fire. This Pokémon controls frigid air of -328 degrees Fahrenheit."]],"379":["Registeel",["It’s rumored that this Pokémon was born deep underground in the planet’s mantle and that it emerged onto the surface 10,000 years ago.","▒▒▒▒’s body is made of a strange material that is flexible enough to stretch and shrink but also more durable than any metal.","▒▒▒▒ was imprisoned by people in ancient times. The metal composing its body is thought to be a curious substance that is not of this earth."]],"380":["Latias",["▒▒▒▒ is highly sensitive to the emotions of people. If it senses any hostility, this Pokémon ruffles the feathers all over its body and cries shrilly to intimidate the foe.","It can telepathically communicate with people. It changes its appearance using its down that refracts light.","It communicates using telepathy. Its body is covered in down that refracts light to make it invisible."]],"381":["Latios",["▒▒▒▒ will only open its heart to a Trainer with a compassionate spirit. This Pokémon can fly faster than a jet plane by folding its forelegs to minimize air resistance.","▒▒▒▒ has the ability to make others see an image of what it has seen or imagines in its head. This Pokémon is intelligent and understands human speech.","It understands human speech and is highly intelligent. It is a tender Pokémon that dislikes fighting."]],"382":["Kyogre",["▒▒▒▒ is said to be the personification of the sea itself. Legends tell of its many clashes against Groudon, as each sought to gain the power of nature.","Through Primal Reversion and with nature’s full power, it will take back its true form. It can summon storms that cause the sea levels to rise.","It is said to have widened the seas by causing downpours. It had been asleep in a marine trench."]],"383":["Groudon",["Through Primal Reversion and with nature’s full power, it will take back its true form. It can cause magma to erupt and expand the landmass of the world.","▒▒▒▒ is said to be the personification of the land itself. Legends tell of its many clashes against Kyogre, as each sought to gain the power of nature.","This legendary Pokémon is said to represent the land. It went to sleep after dueling Kyogre."]],"384":["Rayquaza",["It flies forever through the ozone layer, consuming meteoroids for sustenance. The many meteoroids in its body provide the energy it needs to Mega Evolve.","▒▒▒▒ is said to have lived for hundreds of millions of years. Legends remain of how it put to rest the clash between Kyogre and Groudon.","It flies in the ozone layer, way up high in the sky. Until recently, no one had ever seen it."]],"385":["Jirachi",["It’s believed that when this Pokémon wakes from its 1,000-year slumber, it will grant any wishes written on the notes attached to its head.","Once every 1,000 years, the singing of a pure voice will rouse this Pokémon from its near- perpetual slumber. It wakes for only seven days.","▒▒▒▒ will awaken from its sleep of a thousand years if you sing to it in a voice of purity. It is said to make true any wish that people desire."]],"386":["Deoxys",["▒▒▒▒ emerged from a virus that came from space. It is highly intelligent and wields psychokinetic powers. This Pokémon shoots lasers from the crystalline organ on its chest.","The DNA of a space virus underwent a sudden mutation upon exposure to a laser beam and resulted in ▒▒▒▒. The crystalline organ on this Pokémon’s chest appears to be its brain.","DNA from a space virus mutated and became a Pokémon. It appears where auroras are seen."]],"387":["Turtwig",["This Pokémon becomes more energetic the more sunlight there is. The part resembling a shell is similar to silt and is slightly damp and warm to the touch.","It undertakes photosynthesis with its body, making oxygen. The leaf on its head wilts if it is thirsty.","Photosynthesis occurs across its body under the sun. The shell on its back is actually hardened soil."]],"388":["Grotle",["Appears whe
