<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guess the Pokémon from its Pokédex entries. A new clue unlocks after every miss.">
<title>Pokédex Riddles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: one centered column — Pokédex entry cards, clue strip, guess input, guess log; spotlight reveal at the end. Single night-field look by choice. */
:root {
  --night: #141a33;
  --night-2: #1d2547;
  --panel: #232d57;
  --line: #34407a;
  --ink: #eef1ff;
  --muted: #a3acd6;
  --spark: #ffd23f;
  --hit: #3ecf8e;
  --near: #f2b134;
  --miss: #7880ad;
  --bad: #ff6b6b;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 600px at 50% 0%, var(--night-2), var(--night)) no-repeat, var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1; margin: 0; letter-spacing: .5px; text-wrap: balance; }
h1 span { color: var(--spark); }
.modes { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.modes button {
  font: 800 .8rem var(--body); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--spark); color: var(--night); }

.stage {
  position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 100%;
  border-radius: 24px; overflow: hidden;
  background:
    radial-gradient(closest-side, rgba(255,240,180,.95), rgba(255,210,63,.55) 45%, rgba(255,210,63,0) 75%),
    repeating-conic-gradient(from 0deg at 50% 50%, #2b3670 0 10deg, #222b5c 10deg 20deg);
  border: 1px solid var(--line);
  display: grid; place-items: center;
}
.sprite { background-size: 800% 800%; background-repeat: no-repeat; display: inline-block; }
.stage .sprite {
  width: 78%; aspect-ratio: 1 / 1;
  filter: brightness(0) drop-shadow(0 6px 0 rgba(0,0,0,.18));
  transition: filter .9s ease, transform .9s cubic-bezier(.2,1.4,.4,1);
  user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.stage.revealed .sprite { filter: brightness(1) drop-shadow(0 6px 0 rgba(0,0,0,.25)); transform: scale(1.06); }
.stage .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.stage.revealed .flash { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .85 } 100% { opacity: 0 } }
.tag {
  position: absolute; left: 12px; top: 12px;
  font: 800 .72rem var(--body); letter-spacing: .08em; text-transform: uppercase;
  background: rgba(20,26,51,.75); color: var(--ink); padding: 5px 10px; border-radius: 999px;
}
.result-name {
  position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
  font-family: var(--display); font-size: 2rem; color: var(--night);
  text-shadow: 0 2px 0 rgba(255,255,255,.5);
}

.entries { display: flex; flex-direction: column; gap: 8px; }
.entry {
  position: relative; background: #f4f1e4; color: #1d2547; border-radius: 16px;
  padding: 16px 18px 14px; border: 3px solid var(--spark); box-shadow: 0 6px 0 rgba(0,0,0,.25);
}
.entry .no { font: 800 .68rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: #6b6f8f; display: block; margin-bottom: 4px; }
.entry p { margin: 0; font-size: 1.08rem; line-height: 1.5; font-weight: 600; text-wrap: pretty; }
.entry .redact { background: #1d2547; color: #1d2547; border-radius: 4px; padding: 0 .2em; letter-spacing: -.05em; user-select: none; }
.entry.fresh { animation: pop .45s ease; }
.entry.locked { background: var(--panel); color: var(--muted); border: 1px dashed var(--line); box-shadow: none; padding-block: 10px; }
.entry.locked p { font-size: .88rem; }
.hints { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hint {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px;
}
.hint .k { font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hint .v { font-weight: 800; font-size: 1rem; overflow-wrap: anywhere; }
.hint.locked .v { color: var(--muted); font-weight: 600; font-size: .85rem; }
.hint.fresh { animation: pop .45s ease; border-color: var(--spark); }
@keyframes pop { 0% { transform: scale(.94) } 60% { transform: scale(1.03) } 100% { transform: scale(1) } }
.blanks { letter-spacing: .25em; font-variant-numeric: tabular-nums; }

.pips { display: flex; gap: 6px; justify-content: center; }
.pip { width: 34px; height: 8px; border-radius: 4px; border: 1px solid var(--line); }
.pip.hit { background: var(--hit); border-color: var(--hit); } .pip.near { background: var(--near); border-color: var(--near); } .pip.miss { background: var(--miss); border-color: var(--miss); }

.guess { position: relative; display: flex; gap: 8px; }
.guess input {
  flex: 1; min-width: 0; font: 600 1.05rem var(--body); color: var(--ink);
  background: var(--night); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px;
}
.guess input:focus { outline: none; border-color: var(--spark); }
.btn {
  font: 800 1rem var(--body); border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer;
  background: var(--spark); color: var(--night);
}
.btn:focus-visible, .modes button:focus-visible, .ghost:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: default; }
.ghost { font: 700 .9rem var(--body); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 9px 14px; cursor: pointer; }
.list {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  max-height: 260px; overflow-y: auto; margin: 0; padding: 4px; list-style: none;
  box-shadow: 0 14px 30px rgba(0,0,0,.4);
}
.list li { padding: 9px 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.list li small { color: var(--muted); font-variant-numeric: tabular-nums; }
.list li[aria-selected="true"], .list li:hover { background: var(--line); }
.msg { min-height: 1.4em; text-align: center; color: var(--muted); font-weight: 600; margin: 0; }
.msg.err { color: var(--bad); }

.log { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.log li {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px;
  background: var(--panel); border-left: 6px solid var(--miss); font-weight: 700;
}
.log li.hit { border-left-color: var(--hit); } .log li.near { border-left-color: var(--near); }
.log li .sprite { width: 36px; height: 36px; flex: none; }
.log li .why { margin-left: auto; font-size: .78rem; color: var(--muted); font-weight: 600; text-align: right; }

.end { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.end h2 { font-family: var(--display); font-weight: 400; margin: 0; font-size: 1.5rem; }
.end .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.how { color: var(--muted); font-size: .88rem; margin: 0; text-align: center; }
.how b { color: var(--ink); }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; }

@media (max-width: 400px) { h1 { font-size: 1.6rem } .result-name { font-size: 1.6rem } .hint .v { font-size: .9rem } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>

<div class="wrap">
  <header>
    <h1>Pokédex <span>Riddles</span></h1>
    <div class="modes" role="group" aria-label="Game mode">
      <button id="mode-daily" aria-pressed="true">Daily</button>
      <button id="mode-endless" aria-pressed="false">Endless</button>
    </div>
  </header>

  <div class="stage" id="stage" hidden>
    <div id="mon" class="sprite" role="img" aria-label="The mystery Pokémon"></div>
    <div class="flash"></div>
    <div class="tag" id="tag">Daily #1</div>
    <div class="result-name" id="resultName" hidden></div>
  </div>

  <div class="entries" id="entries" aria-live="polite"></div>

  <div class="pips" id="pips" aria-label="Guesses used"></div>

  <div class="hints" id="hints"></div>

  <form class="guess" id="form" autocomplete="off">
    <input id="guess" type="text" placeholder="Type a Pokémon name…" aria-label="Your guess" aria-autocomplete="list" aria-controls="list" spellcheck="false" autocapitalize="off">
    <button class="btn" id="go" type="submit">Guess</button>
    <ul class="list" id="list" role="listbox" hidden></ul>
  </form>
  <p class="msg" id="msg">Read the Pokédex entry and name the Pokémon. Every miss unlocks a new clue.</p>

  <div class="end" id="end" hidden>
    <h2 id="endTitle"></h2>
    <div class="stats" id="stats"></div>
    <div class="row">
      <button class="btn" id="share" type="button">Copy result</button>
      <button class="ghost" id="next" type="button">Play endless</button>
    </div>
  </div>

  <ol class="log" id="log"></ol>

  <p class="how"><span class="key" style="background:var(--hit)"></span><b>Green</b> is right, <span class="key" style="background:var(--near)"></span><b>yellow</b> shares a type, <span class="key" style="background:var(--miss)"></span><b>gray</b> shares nothing.</p>
  <div class="row" style="display:flex;justify-content:center"><button class="ghost" id="giveup" type="button">Give up</button></div>
</div>

const SPECIES = {"1":["Bulbasaur",["While it is young, it uses the nutrients that are stored in the seed on its back in order to grow.","There is a plant seed on its back right from the day this Pokémon is born. The seed slowly grows larger.","It can go for days without eating a single morsel. In the bulb on its back, it stores energy."]],"2":["Ivysaur",["Exposure to sunlight adds to its strength. Sunlight also makes the bud on its back grow larger.","When the bulb on its back grows large, it appears to lose the ability to stand on its hind legs.","The bud on its back grows by drawing energy. It gives off an aroma when it is ready to bloom."]],"3":["Venusaur",["A bewitching aroma wafts from its flower. The fragrance becalms those engaged in a battle.","Its plant blooms when it is absorbing solar energy. It stays on the move to seek sunlight.","The flower on its back catches the sun’s rays. The sunlight is then absorbed and used for energy."]],"4":["Charmander",["From the time it is born, a flame burns at the tip of its tail. Its life would end if the flame were to go out.","It has a preference for hot things. When it rains, steam is said to spout from the tip of its tail.","The flame at the tip of its tail makes a sound as it burns. You can only hear it in quiet places."]],"5":["Charmeleon",["If it becomes agitated during battle, it spouts intense flames, incinerating its surroundings.","It has a barbaric nature. In battle, it whips its fiery tail around and slashes away with sharp claws.","Tough fights could excite this Pokémon. When excited, it may breathe out bluish-white flames."]],"6":["Charizard",["Its wings can carry this Pokémon close to an altitude of 4,600 feet. It blows out fire at very high temperatures.","It spits fire that is hot enough to melt boulders. It may cause forest fires by blowing flames.","When this Pokémon expels a blast of superhot fire, the red flame at the tip of its tail burns more intensely."]],"7":["Squirtle",["When it feels threatened, it draws its limbs inside its shell and sprays water from its mouth.","When it retracts its long neck into its shell, it squirts out water with vigorous force.","Shoots water at prey while in the water. Withdraws into its shell when in danger."]],"8":["Wartortle",["It cleverly controls its furry ears and tail to maintain its balance while swimming.","It is recognized as a symbol of longevity. If its shell has algae on it, that ▒▒▒▒ is very old.","When tapped on its head, this Pokémon will pull it in, but its tail will still stick out a little bit."]],"9":["Blastoise",["The rocket cannons on its shell fire jets of water capable of punching holes through thick steel.","It crushes its foe under its heavy body to cause fainting. In a pinch, it will withdraw inside its shell.","Once it takes aim at its enemy, it blasts out water with even more force than a fire hose."]],"10":["Caterpie",["Its short feet are tipped with suction pads that enable it to tirelessly climb slopes and walls.","For protection, it releases a horrible stench from the antenna on its head to drive away enemies.","If you touch the feeler on top of its head, it will release a horrible stink to protect itself."]],"11":["Metapod",["Even though it is encased in a sturdy shell, the body inside is tender. It can’t withstand a harsh attack.","It is waiting for the moment to evolve. At this stage, it can only harden, so it remains motionless to avoid attack.","Hardens its shell to protect itself. However, a large impact may cause it to pop out of its shell."]],"12":["Butterfree",["It collects honey every day. It rubs honey onto the hairs on its legs to carry it back to its nest.","In battle, it flaps its wings at great speed to release highly toxic dust into the air.","Its wings, covered with poisonous powder, repel water. This allows it to fly in the rain."]],"13":["Weedle",["Beware of the sharp stinger on its head. It hides in grass and bushes where it eats leaves.","▒▒▒▒ has an extremely acute sense of smell. It is capable of distinguishing its favorite kinds of leaves from those it dislikes just by sniffing with its big red proboscis (nose).","Its poison stinger is very powerful. Its bright-colored body is intended to warn off its enemies."]],"14":["Kakuna",["Able to move only slightly. When endangered, it may stick out its stinger and poison its enemy.","While awaiting evolution, it hides from predators under leaves and in nooks of branches.","Almost incapable of moving, this Pokémon can only harden its shell to protect itself when it is in danger."]],"15":["Beedrill",["It has three poisonous stingers on its forelegs and its tail. They are used to jab its enemy repeatedly.","▒▒▒▒ is extremely territorial. No one should ever approach its nest—this is for their own safety. If angered, they will attack in a furious swarm.","May appear in a swarm. Flies at violent speeds, all the while stabbing with the toxic stinger on its rear."]],"16":["Pidgey",["Very docile. If attacked, it will often kick up sand to protect itself rather than fight back.","▒▒▒▒ has an extremely sharp sense of direction. It is capable of unerringly returning home to its nest, however far it may be removed from its familiar surroundings.","It is docile and prefers to avoid conflict. If disturbed, however, it can ferociously strike back."]],"17":["Pidgeotto",["This Pokémon is full of vitality. It constantly flies around its large territory in search of prey.","Very protective of its sprawling territorial area, this Pokémon will fiercely peck at any intruder.","The claws on its feet are well developed. It can carry prey such as an Exeggcute to its nest over 60 miles away."]],"18":["Pidgeot",["This Pokémon flies at Mach 2 speed, seeking prey. Its large talons are feared as wicked weapons.","It spreads its gorgeous wings widely to intimidate enemies. It races through the skies at Mach-2 speed.","When hunting, it skims the surface of water at high speed to pick off unwary prey such as Magikarp."]],"19":["Rattata",["Will chew on anything with its fangs. If you see one, you can be certain that 40 more live in the area.","This Pokémon is common but hazardous. Its sharp incisors can easily cut right through hard wood.","Its incisors grow continuously throughout its life. If its incisors get too long, this Pokémon becomes unable to eat, and it starves to death."]],"20":["Raticate",["Its hind feet are webbed. They act as flippers, so it can swim in rivers and hunt for prey.","Its whiskers are essential for maintaining its balance. No matter how friendly you are, it will get angry and bite you if you touch its whiskers.","People say that it fled from its enemies by using its small webbed hind feet to swim from island to island in Alola."]],"21":["Spearow",["Inept at flying high. However, it can fly around very fast to protect its territory.","Due to its short wings, it can’t fly long distances. It wanders about restlessly and pecks at bug Pokémon.","Its reckless nature leads it to stand up to others—even large Pokémon—if it has to protect its territory."]],"22":["Fearow",["A Pokémon that dates back many years. If it senses danger, it flies high and away, instantly.","In Alola, fish Pokémon are its prey. It can be seen circling above the ocean searching for food.","Carrying food through ▒▒▒▒’s territory is dangerous. It will snatch the food away from you in a flash!"]],"23":["Ekans",["The older it gets, the longer it grows. At night, it wraps its long body around tree branches to rest.","The eggs of bird Pokémon are its favorite food. It swallows eggs whole, so sometimes an egg gets stuck, and ▒▒▒▒ faints.","By dislocating its jaw, it can swallow prey larger than itself. After a meal, it curls up and rests."]],"24":["Arbok",["The frightening patterns on its belly have been studied. Six variations have been confirmed.","After stunning its opponents with the pattern on its stomach, it quickly wraps them up in its body and waits for them to stop moving.","The latest research has determined that there are over 20 possible arrangements of the patterns on its stomach."]],"25":["Pikachu",["Possesses cheek sacs in which it stores electricity. This clever forest-dweller roasts tough berries with an electric shock before consuming them.","When ▒▒▒▒ meet, they’ll touch their tails together and exchange electricity through them as a form of greeting.","▒▒▒▒ that can generate powerful electricity have cheek sacs that are extra soft and super stretchy."]],"26":["Raichu",["It can discharge bursts of electricity exceeding 100,000 volts— a single strike with that amount of power would incapacitate one of the Copperajah of my homeland.","If its electric pouches run empty, it raises its tail to gather electricity from the atmosphere.","Its long tail serves as a ground to protect itself from its own high-voltage power."]],"27":["Sandshrew",["It burrows into the ground to create its nest. If hard stones impede its tunneling, it uses its sharp claws to shatter them and then carries on digging.","It loves to bathe in the grit of dry, sandy areas. By sand bathing, the Pokémon rids itself of dirt and moisture clinging to its body.","Its body is dry. When it gets cold at night, its hide is said to become coated with a fine dew."]],"28":["Sandslash",["It climbs trees by hooking on with its sharp claws. ▒▒▒▒ shares the berries it gathers, dropping them down to Sandshrew waiting below the tree.","The drier the area ▒▒▒▒ lives in, the harder and smoother the Pokémon’s spikes will feel when touched.","It is skilled at slashing enemies with its claws. If broken, they start to grow back in a day."]],"29":["Nidoran♀",["It uses its hard incisor teeth to crush and eat berries. The tip of a female ▒▒▒▒’s horn is a bit more rounded than the tip of a male’s horn.","Females are more sensitive to smells than males. While foraging, they’ll use their whiskers to check wind direction and stay downwind of predators.","A mild-mannered Pokémon that does not like to fight. Beware—its small horn secretes venom."]],"30":["Nidorina",["If the group is threatened, these Pokémon will band together to assault enemies with a chorus of ultrasonic waves.","The horn on its head has atrophied. It’s thought that this happens so ▒▒▒▒’s children won’t get poked while their mother is feeding them.","When resting deep in its burrow, its barbs always retract. This is proof that it is relaxed."]],"31":["Nidoqueen",["It pacifies offspring by placing them in the gaps between the spines on its back. The spines will never secrete poison while young are present.","▒▒▒▒ is better at defense than offense. With scales like armor, this Pokémon will shield its children from any kind of attack.","Tough scales cover the sturdy body of this Pokémon. It appears that the scales grow in cycles."]],"32":["Nidoran♂",["Small but brave, this Pokémon will hold its ground and even risk its life in battle to protect the female it’s friendly with.","The horn on a male ▒▒▒▒’s forehead contains a powerful poison. This is a very cautious Pokémon, always straining its large ears.","Its large ears are always kept upright. If it senses danger, it will attack with a poisonous sting."]],"33":["Nidorino",["It’s nervous and quick to act aggressively. The potency of its poison increases along with the level of adrenaline present in its body.","With a horn that’s harder than diamond, this Pokémon goes around shattering boulders as it searches for a moon stone.","Its horn contains venom. If it stabs an enemy with the horn, the impact makes the poison leak out."]],"34":["Nidoking",["▒▒▒▒ prides itself on its strength. It’s forceful and spirited in battle, making use of its thick tail and diamond-crushing horn.","When it goes on a rampage, it’s impossible to control. But in the presence of a Nidoqueen it’s lived with for a long time, ▒▒▒▒ calms down.","Its steel-like hide adds to its powerful tackle. Its horns are so hard, they can pierce a diamond."]],"35":["Clefairy",["It can be found in quiet mountain areas on a full moon's night. Its dancing and its tiny, faintly glowing wings confer upon it a lovely fairylike quality.","Its adorable behavior and cry make it highly popular. However, this cute Pokémon is rarely found.","It is said that happiness will come to those who see a gathering of ▒▒▒▒ dancing under a full moon."]],"36":["Clefable",["Legend says that on clear, quiet nights, it listens for the voices of its kin living on the moon. I, too, often think of my homeland, so far away.","Their ears are sensitive enough to hear a pin drop from over a mile away, so they’re usually found in quiet places.","A timid fairy Pokémon that is rarely seen, it will run and hide the moment it senses people."]],"37":["Vulpix",["In its belly burns a fire, which ▒▒▒▒ spits out in the form of fireballs. When young, this Pokémon has but one white tail. As the Pokémon matures, this single tail splits into six.","As each tail grows, its fur becomes more lustrous. When held, it feels slightly warm.","While young, it has six gorgeous tails. When it grows, several new tails are sprouted."]],"38":["Ninetales",["The coat of gleaming golden fur is quite magnificent. This species is said to store sacred power in its nine long tails and to live for a millennium.","Very smart and very vengeful. Grabbing one of its many tails could result in a 1,000-year curse.","It is said to live 1,000 years, and each of its tails is loaded with supernatural powers."]],"39":["Jigglypuff",["By freely changing the wavelength of its voice, ▒▒▒▒ sings a mysterious melody sure to make any listener sleepy.","▒▒▒▒ has top-notch lung capacity, even by comparison to other Pokémon. It won’t stop singing its lullabies until its foes fall asleep.","Uses its cute round eyes to enrapture its foe. It then sings a pleasing melody that lulls the foe to sleep."]],"40":["Wigglytuff",["It’s proud of its fur, which is fine and delicate. In particular, the curl on its forehead has a texture that’s perfectly heavenly.","The more air it takes in, the more it inflates. If opponents catch it in a bad mood, it will inflate itself to an enormous size to intimidate them.","Its body is very elastic. By inhaling deeply, it can continue to inflate itself without limit."]],"41":["Zubat",["Makes its home in gloomy caves. Atrophied eyes have left this Pokémon blind, so it scans its surroundings via sound waves that it emits from its mouth as it flies.","▒▒▒▒ live in caves, down where the sun’s light won’t reach. In the morning, they gather together to keep each other warm as they sleep.","It emits ultrasonic waves from its mouth to check its surroundings. Even in tight caves, ▒▒▒▒ flies around with skill."]],"42":["Golbat",["It sinks its sharp fangs into other creatures and slurps up their blood. A closer look at the fangs reveals that they are hollow and akin to straws.","Its feet are tiny, but this Pokémon walks skillfully. It sneaks up on sleeping prey before sinking in its fangs and slurping up blood.","It loves to drink other creatures’ blood. It’s said that if it finds others of its kind going hungry, it sometimes shares the blood it’s gathered."]],"43":["Oddish",["During the day, it stays in the cold underground to avoid the sun. It grows by bathing in moonlight.","If exposed to moonlight, it starts to move. It roams far and wide at night to scatter its seeds.","It may be mistaken for a clump of weeds. If you try to yank it out of the ground, it shrieks horribly."]],"44":["Gloom",["What appears to be drool is actually sweet honey. It is very sticky and clings stubbornly if touched.","Its pistils exude an incredibly foul odor. The horrid stench can cause fainting at a distance of 1.25 miles.","Smells incredibly foul! However, around one out of a thousand people enjoy sniffing its nose-bending stink."]],"45":["Vileplume",["The larger its petals, the more toxic pollen it contains. Its big head is heavy and hard to hold up.","It has the world’s largest petals. With every step, the petals shake out heavy clouds of toxic pollen.","Flaps its broad flower petals to scatter its poisonous pollen. The flapping sound is very loud."]],"46":["Paras",["Sometimes seen at the foot of trees in humid forests. The mushrooms on its back—called tochukaso—are not present on infant specimens and instead emerge as ▒▒▒▒ matures.","Burrows under the ground to gnaw on tree roots. The mushrooms on its back absorb most of the nutrition.","The mushrooms, known as tochukaso, are controlling the bug. Even if the bug bugs the mushrooms, they tell it to bug off."]],"47":["Parasect",["Mushroom-lacking specimens of this Pokémon lie unmoving in the forest, lending credence to the hypothesis that the large mushroom is in control of ▒▒▒▒'s actions.","The bug host is drained of energy by the mushroom on its back. The mushroom appears to do all the thinking.","Its poisonous spores are also used in traditional medicine. Apparently, spores produced in Alola are not of very good quality."]],"48":["Venonat",["Its large eyes act as radar. In a bright place, you can see that they are clusters of many tiny eyes.","▒▒▒▒ is said to have evolved with a coat of thin, stiff hair that covers its entire body for protection. It possesses large eyes that never fail to spot even minuscule prey.","Lives in the shadows of tall trees where it eats bugs. It is attracted by light at night."]],"49":["Venomoth",["The powdery scales on its wings are hard to remove from skin. They also contain poison that leaks out on contact.","▒▒▒▒ is nocturnal—it is a Pokémon that only becomes active at night. Its favorite prey are small insects that gather around streetlights, attracted by the light in the darkness.","The wings are covered with dustlike scales. Every time it flaps its wings, it looses highly toxic dust."]],"50":["Diglett",["It burrows through the ground at a shallow depth. It leaves raised earth in its wake, making it easy to spot.","If a ▒▒▒▒ digs through a field, it leaves the soil perfectly tilled and ideal for planting crops.","It prefers dark places. It spends most of its time underground, though it may pop up in caves."]],"51":["Dugtrio",["These Diglett triplets dig over 60 miles below sea level. No one knows what it’s like underground.","A team of Diglett triplets. It triggers huge earthquakes by burrowing 60 miles underground.","A team of triplets that can burrow to a depth of 60 miles. It’s reported that this triggers an earthquake."]],"52":["Meowth",["It washes its face regularly to keep the coin on its forehead spotless. It doesn’t get along with Galarian ▒▒▒▒.","It loves to collect shiny things. If it’s in a good mood, it might even let its Trainer have a look at its hoard of treasures.","Appears to be more active at night. It loves round and shiny things. It can’t stop itself from picking them up."]],"53":["Persian",["Its elegant and refined behavior clashes with that of the barbaric Perrserker. The relationship between the two is one of mutual disdain.","Getting this prideful Pokémon to warm up to you takes a lot of effort, and it will claw at you the moment it gets annoyed.","The gem in its forehead glows on its own! It walks with all the grace and elegance of a proud queen."]],"54":["Psyduck",["Suffers perpetual headaches. If the agony grows too great, ▒▒▒▒'s latent power erupts, contrary to ▒▒▒▒'s intent. Ergo, I am exploring ways to ease the pain.","As ▒▒▒▒ gets stressed out, its headache gets progressively worse. It uses intense psychic energy to overwhelm those around it.","▒▒▒▒ is constantly beset by headaches. If the Pokémon lets its strange power erupt, apparently the pain subsides for a while."]],"55":["Golduck",["Its body is strong, and it has webbing on its hands and feet. ▒▒▒▒ can swim easily through rough seas, clawing its way through the high waves.","Old tales tell of ▒▒▒▒ punishing those that defiled its river. The guilty were dragged into the water and taken away.","This Pokémon lives in gently flowing rivers. It paddles through the water with its long limbs, putting its graceful swimming skills on display."]],"56":["Mankey",["An agile Pokémon that lives in trees. It angers easily and will not hesitate to attack anything.","If one gets angry, all the others around it will get angry, so silence is a rare visitor in a troop of ▒▒▒▒.","The smallest of things could cause it to lose its temper. Because it doesn’t hold in its stress, this Pokémon can live a long time."]],"57":["Primeape",["It stops being angry only when nobody else is around. To view this moment is very difficult.","The blood vessels in its brain are sturdier than those of other Pokémon, so it can stay healthy despite its constant raging.","It will never forgive opponents who have angered it. Even after it has beaten them down until they can’t move, it never ever forgives."]],"58":["Growlithe",["They patrol their territory in pairs. I believe the igneous rock components in the fur of this species are the result of volcanic activity in its habitat.","Extremely loyal, it will fearlessly bark at any opponent to protect its own Trainer from harm.","It has a brave and trustworthy nature. It fearlessly stands up to bigger and stronger foes."]],"59":["Arcanine",["A Pokémon that has long been admired for its beauty. It runs agilely as if on wings.","The sight of it running over 6,200 miles in a single day and night has captivated many people.","A legendary Pokémon in the East. Many people are charmed by the grace and beauty of its running."]],"60":["Poliwag",["In rivers with fast-flowing water, this Pokémon will cling to a rock by using its thick lips, which act like a suction cup.","For ▒▒▒▒, swimming is easier than walking. The swirl pattern on its belly is actually part of the Pokémon’s innards showing through the skin.","The direction of the spiral on the belly differs by area. It is more adept at swimming than walking."]],"61":["Poliwhirl",["This Pokémon’s sweat is a slimy mucus. When captured, ▒▒▒▒ can slither from its enemies’ grasp and escape.","Staring at the swirl on its belly causes drowsiness. This trait of ▒▒▒▒’s has been used in place of lullabies to get children to go to sleep.","Under attack, it uses its belly spiral to put the foe to sleep. It then makes its escape."]],"62":["Poliwrath",["▒▒▒▒ is skilled at both swimming and martial arts. It uses its well-trained arms to dish out powerful punches.","Its body is solid muscle. When swimming through cold seas, ▒▒▒▒ uses its impressive arms to smash through drift ice and plow forward.","Swims powerfully using all the muscles in its body. It can even overtake world-class swimmers."]],"63":["Abra",["Spends 18 hours of the day sleeping. Even while asleep, ▒▒▒▒ can control its psychic powers—should danger approach, the Pokémon will simply teleport away.","▒▒▒▒ can teleport in its sleep. Apparently the more deeply ▒▒▒▒ sleeps, the farther its teleportations go.","This Pokémon uses its psychic powers while it sleeps. The contents of ▒▒▒▒’s dreams affect the powers that the Pokémon wields."]],"64":["Kadabra",["There are rumors that a child with mystical powers became a ▒▒▒▒; however, this remains unverified. I suspect that the spoon ▒▒▒▒ holds enhances its brain waves.","This Pokémon’s telekinesis is immensely powerful. To prepare for evolution, ▒▒▒▒ stores up psychic energy in the star on its forehead.","Using its psychic power, ▒▒▒▒ levitates as it sleeps. It uses its springy tail as a pillow."]],"65":["Alakazam",["The longer ▒▒▒▒ lives, the larger and heavier its head becomes. Our tests have shown that the strength of its psychic powers correlates positively to the weight of its head.","▒▒▒▒ wields potent psychic powers. It’s said that this Pokémon used these powers to create the spoons it holds.","It has an incredibly high level of intelligence. Some say that ▒▒▒▒ remembers everything that ever happens to it, from birth till death."]],"66":["Machop",["Though as small as a child, it has strength enough to easily throw a well-built adult. Striving to become ever stronger, ▒▒▒▒ trains by carrying a Graveler on its shoulders.","Always brimming with power, it passes time by lifting boulders. Doing so makes it even stronger.","Its whole body is composed of muscles. Even though it’s the size of a human child, it can hurl 100 grown-ups."]],"67":["Machoke",["A sturdy creature boasting a robust physique and boundless stamina. Loves training above all else and voluntarily assists with tasks such as construction and clearing land.","Its formidable body never gets tired. It helps people by doing work such as the moving of heavy goods.","Its muscular body is so powerful, it must wear a power-save belt to be able to regulate its motions."]],"68":["Machamp",["In close combat, its four arms afford it offensive and defensive supremacy. In but a blink, this valiant Pokémon can overwhelm its foes with more than 1,000 blows from its fists.","With four arms that react more quickly than it can think, it can execute many punches at once.","It quickly swings its four arms to rock its opponents with ceaseless punches and chops from all angles."]],"69":["Bellsprout",["Prefers hot and humid places. It ensnares tiny bugs with its vines and devours them.","▒▒▒▒’s thin and flexible body lets it bend and sway to avoid any attack, however strong it may be. From its mouth, this Pokémon spits a corrosive fluid that melts even iron.","Its bud looks like a human face. Because of the bud, it is rumored to be a type of legendary mandrake plant."]],"70":["Weepinbell",["When hungry, it swallows anything that moves. Its hapless prey is dissolved by strong acids.","It spits out Poison Powder to immobilize the enemy and then finishes it with a spray of Acid.","The leafy parts act as cutters for slashing foes. It spits a fluid that dissolves everything."]],"71":["Victreebel",["Lures prey with the sweet aroma of honey. Swallowed whole, the prey is dissolved in a day, bones and all.","Once ingested into this Pokémon’s body, even the hardest object will melt into nothing.","Said to live in huge colonies deep in jungles, although no one has ever returned from there."]],"72":["Tentacool",["This Pokémon is mostly made of water. A ▒▒▒▒ out in the ocean is very hard to spot, because its body blends in with the sea.","▒▒▒▒ is not a particularly strong swimmer. It drifts across the surface of shallow seas as it searches for prey.","It can sometimes be found all dry and shriveled up on a beach. Toss it back into the sea to revive it."]],"73":["Tentacruel",["It has 80 tentacles, each with a venomous tip. These tentacles are also extendible, lengthening when ▒▒▒▒ attempts to catch prey. Use caution.","Its 80 tentacles can stretch and shrink freely. ▒▒▒▒ ensnares prey in a net of spread-out tentacles, delivering venomous stings to its catch.","When the red orbs on ▒▒▒▒’s head glow brightly, watch out. The Pokémon is about to fire off a burst of ultrasonic waves."]],"74":["Geodude",["Commonly found near mountain trails and the like. If you step on one by accident, it gets angry.","It uses both hands to climb precipitous cliffs. People who see it in action have been known to take up bouldering.","▒▒▒▒ that have lived a long life have had all their edges smoothed out until they’re totally round. They also have a calm, quiet disposition."]],"75":["Graveler",["Dwells in holes dug into sheer walls of stone. It enjoys rolling down slopes as though it were a boulder during a rockfall, so keep an eye upward while traversing mountain roads.","Often seen rolling down mountain trails. Obstacles are just things to roll straight over, not avoid.","It travels by rolling down cliffs. If it falls into a river, it will explode with its last gasp."]],"76":["Golem",["The rocklike shell is shed each year. The cast-off shell then crumbles, reverting to a mass of soil, which can be spread across fields to promote crop growth.","Once it sheds its skin, its body turns tender and whitish. Its hide hardens when it’s exposed to air.","It detonates its own body. The power from that explosion can propel it up steep mountain paths with amazing speed."]],"77":["Ponyta",["These Pokémon live in herds out in the grassland. Newborn foals lack their fiery manes, which will develop about an hour after birth.","If you’ve been accepted by ▒▒▒▒, its burning mane is mysteriously no longer hot to the touch.","It can’t run properly when it’s newly born. As it races around with others of its kind, its legs grow stronger."]],"78":["Rapidash",["Fiery mane aglow, ▒▒▒▒ darts like an arrow across the land. This prodigiously swift creature can traverse the vast region of Hisui in a day and a half.","The fastest runner becomes the leader, and it decides the herd’s pace and direction of travel.","This Pokémon can be seen galloping through fields at speeds of up to 150 mph, its fiery mane fluttering in the wind."]],"79":["Slowpoke",["When this Pokémon’s tail is soaked in water, sweetness seeps from it. ▒▒▒▒ uses this trait to lure in and fish up other Pokémon.","Slow-witted and oblivious, this Pokémon won’t feel any pain if its tail gets eaten. It won’t notice when its tail grows back, either.","Incredibly slow and sluggish. It is quite content to loll about without worrying about the time."]],"80":["Slowbro",["Being bitten by a Shellder shocked this Pokémon into standing on two legs. If the Shellder lets go, it seems ▒▒▒▒ will turn back into a Slowpoke.","Slowpoke became ▒▒▒▒ when a Shellder bit on to its tail. Sweet flavors seeping from the tail make the Shellder feel as if its life is a dream.","Lives lazily by the sea. If the Shellder on its tail comes off, it becomes a Slowpoke again."]],"81":["Magnemite",["It subsists on electricity. As ▒▒▒▒ flies, it emits electromagnetic waves from the units on each side of its body.","At times, ▒▒▒▒ runs out of electricity and ends up on the ground. If you give batteries to a grounded ▒▒▒▒, it’ll start moving again.","It is hatched with the ability to defy gravity. It floats while emitting powerful electromagnetic waves."]],"82":["Magneton",["Three Magnemite gathered to evolve into this Pokémon. The source of much vexation on my part, as its powerful magnetism destroys my research equipment.","This Pokémon is constantly putting out a powerful magnetic force. Most computers go haywire when a ▒▒▒▒ approaches.","This Pokémon is three Magnemite that have linked together. ▒▒▒▒ sends out powerful radio waves to study its surroundings."]],"83":["Farfetch’d",["They use a plant stalk as a weapon, but not all of them use it in the same way. Several distinct styles of stalk fighting have been observed.","The stalk this Pokémon carries in its wings serves as a sword to cut down opponents. In a dire situation, the stalk can also serve as food.","They live where reedy plants grow. ▒▒▒▒ are rarely seen, so it’s thought their numbers are decreasing."]],"84":["Doduo",["Its short wings make flying difficult. Instead, this Pokémon runs at high speed on developed legs.","▒▒▒▒’s two heads never sleep at the same time. Its two heads take turns sleeping, so one head can always keep watch for enemies while the other one sleeps.","The brains in its two heads appear to communicate emotions to each other with a telepathic power."]],"85":["Dodrio",["One of Doduo’s two heads splits to form a unique species. It runs close to 40 mph in prairies.","An odd species that is rarely found. The three heads respectively represent joy, sadness, and anger.","An enemy that takes its eyes off any of the three heads--even for a second--will get pecked severely."]],"86":["Seel",["Loves freezing-cold conditions. Relishes swimming in a frigid climate of around 14 degrees Fahrenheit.","Thanks to its thick fat, cold seas don’t bother it at all, but it gets tired pretty easily in warm waters.","It has always been supposed that ▒▒▒▒ live only in cold seas. Their having shown up in Alola is a mystery."]],"87":["Dewgong",["Its entire body is a snowy white. Unharmed by even intense cold, it swims powerfully in icy waters.","It sunbathes on the beach after meals. The rise in its body temperature helps its digestion.","It swims through the ocean at a speed of eight knots, searching for Pokémon that will become its prey. It’s especially fond of Wishiwashi."]],"88":["Grimer",["Made of congealed sludge. It smells too putrid to touch. Even weeds won’t grow in its path.","The wastewater coming from factories is clean these days, so ▒▒▒▒ have nothing to eat. They’re said to be on the verge of extinction.","It was born from sludge on the ocean floor. In a sterile environment, the germs within its body can’t multiply, and it dies."]],"89":["Muk",["Smells so awful, it can cause fainting. Through degeneration of its nose, it lost its sense of smell.","Because they scatter germs everywhere, they’ve long been targeted for extermination, leading to a steep decline in their population.","Their food sources have decreased, and their numbers have declined sharply. Sludge ponds are being built to prevent their extinction."]],"90":["Shellder",["Its hard shell repels any kind of attack. It is vulnerable only when its shell is open.","It swims facing backward by opening and closing its two-piece shell. It is surprisingly fast.","The shell can withstand any attack. However, when it is open, the tender body is exposed."]],"91":["Cloyster",["Once it slams its shell shut, it is impossible to open, even by those with superior strength.","Its shell is extremely hard. It cannot be shattered, even with a bomb. The shell opens only when it is attacking.","For protection, it uses its harder-than-diamond shell. It also shoots spikes from the shell."]],"92":["Gastly",["Gaseous and completely impalpable. Also highly dangerous— inhaling part of its poisonous body will cause one to faint instantly.","With its gas-like body, it can sneak into any place it desires. However, it can be blown away by wind.","Born from gases, anyone would faint if engulfed by its gaseous body, which contains poison."]],"93":["Haunter",["This frightful, malevolent spirit can glide through walls, appearing wherever it likes. According to rumor, victims of a ▒▒▒▒'s lick will wither to death day by day.","If you get the feeling of being watched in darkness when nobody is around, ▒▒▒▒ is there.","Its tongue is made of gas. If licked, its victim starts shaking constantly until death eventually comes."]],"94":["Gengar",["Possesses potential victims' shadows in an effort to steal away the victims' lives. If your shadow begins to laugh, you must take hold of a protective charm posthaste!","It is said to emerge from darkness to steal the lives of those who become lost in mountains.","On the night of a full moon, if shadows move on their own and laugh, it must be ▒▒▒▒’s doing."]],"95":["Onix",["This chain of immense stones resembles a giant serpent. Tremors shake the earth above as it burrows deep beneath the ground, feeding on boulders as it goes.","It rapidly bores through the ground at 50 mph by squirming and twisting its massive, rugged body.","As it digs through the ground, it absorbs many hard objects. This is what makes its body so solid."]],"96":["Drowzee",["If you sleep by it all the time, it will sometimes show you dreams it had eaten in the past.","It puts its prey to sleep and devours their dreams. It seems that bad dreams taste sour, so ▒▒▒▒ doesn’t particularly like eating them.","It can be spotted near recreational facilities, intending to eat the pleasant dreams of children who enjoyed themselves there that day."]],"97":["Hypno",["Avoid eye contact if you come across one. It will try to put you to sleep by using its pendulum.","There are some ▒▒▒▒ that assist doctors with patients who can’t sleep at night in hospitals.","In Alola, Komala is ▒▒▒▒’s main target. It rarely harms people."]],"98":["Krabby",["If it senses danger approaching, it cloaks itself with bubbles from its mouth so it will look bigger.","It can be found near the sea. The large pincers grow back if they are torn out of their sockets.","Its pincers are superb weapons. They sometimes break off during battle, but they grow back fast."]],"99":["Kingler",["Its oversized claw is very powerful, but when it’s not in battle, the claw just gets in the way.","Its large and hard pincer has 10,000-horsepower strength. However, being so big, it is unwieldy to move.","One claw grew massively and is as hard as steel. It has 10,000-horsepower strength. However, it is too heavy."]],"100":["Voltorb",["It is said to camouflage itself as a Poké Ball. It will self-destruct with very little stimulus.","▒▒▒▒ is extremely sensitive—it explodes at the slightest of shocks. It is rumored that it was first created when a Poké Ball was exposed to a powerful pulse of energy.","▒▒▒▒ was first sighted at a company that manufactures Poké Balls. The link between that sighting and the fact that this Pokémon looks very similar to a Poké Ball remains a mystery."]],"101":["Electrode",["The tissue on the surface of its body is curiously similar in composition to an Apricorn. When irritated, this Pokémon lets loose an electric current equal to 20 lightning bolts.","Stores electrical energy inside its body. Even the slightest shock could trigger a huge explosion.","▒▒▒▒ eats electricity in the atmosphere. On days when lightning strikes, you can see this Pokémon exploding all over the place from eating too much electricity."]],"102":["Exeggcute",["These Pokémon get nervous when they’re not in a group of six. The minute even one member of the group goes missing, ▒▒▒▒ become cowardly.","Though it may look like it’s just a bunch of eggs, it’s a proper Pokémon. ▒▒▒▒ communicates with others of its kind via telepathy, apparently.","The heads attract each other and spin around. There must be six heads for it to maintain balance."]],"103":["Exeggutor",["When they work together, ▒▒▒▒’s three heads can put out powerful psychic energy. Cloudy days make this Pokémon sluggish.","Each of ▒▒▒▒’s three heads is thinking different thoughts. The three don’t seem to be very interested in one another.","Its cries are very noisy. This is because each of the three heads thinks about whatever it likes."]],"104":["Cubone",["This Pokémon wears the skull of its deceased mother. Sometimes ▒▒▒▒’s dreams make it cry, but each tear ▒▒▒▒ sheds makes it stronger.","When the memory of its departed mother brings it to tears, its cries echo mournfully within the skull it wears on its head.","Wears the skull of its deceased mother. Its cries echo inside the skull and come out as a sad melody."]],"105":["Marowak",["When this Pokémon evolved, the skull of its mother fused to it. ▒▒▒▒’s temperament also turned vicious at the same time.","This Pokémon overcame its sorrow to evolve a sturdy new body. ▒▒▒▒ faces its opponents bravely, using a bone as a weapon.","Small and weak, this Pokémon is adept with its bone club. It has grown more vicious over the ages."]],"106":["Hitmonlee",["The legs freely contract and stretch. The stretchy legs allow it to hit a distant foe with a rising kick.","This amazing Pokémon has an awesome sense of balance. It can kick in succession from any position.","When kicking, the sole of its foot turns as hard as a diamond on impact and destroys its enemy."]],"107":["Hitmonchan",["Its punches slice the air. However, it seems to need a short break after fighting for three minutes.","Its punches slice the air. They are launched at such high speed, even a slight graze could cause a burn.","Punches in corkscrew fashion. It can punch its way through a concrete wall like a drill."]],"108":["Lickitung",["Wields its long tongue deftly, as though it were an arm. The Pokémon's viscous saliva, once it has been collected and boiled down, yields a strong and highly useful adhesive.","Bug Pokémon are ▒▒▒▒’s main food source. This Pokémon paralyzes its prey with a lick from its long tongue, then swallows the prey whole.","If this Pokémon’s sticky saliva gets on you and you don’t clean it off, an intense itch will set in. The itch won’t go away, either."]],"109":["Koffing",["It adores polluted air. Some claim that ▒▒▒▒ used to be more plentiful in the Galar region than they are now.","Its body is full of poisonous gas. It floats into garbage dumps, seeking out the fumes of raw, rotting trash.","In hot places, its internal gases could expand and explode without any warning. Be very careful!"]],"110":["Weezing",["It can’t suck in air quite as well as a Galarian ▒▒▒▒, but the toxins it creates are more potent than those of its counterpart.","It mixes gases between its two bodies. It’s said that these Pokémon were seen all over the Galar region back in the day.","This Pokémon lives and grows by absorbing poison gas, dust, and germs that exist inside garbage."]],"111":["Rhyhorn",["It can remember only one thing at a time. Once it starts rushing, it forgets why it started.","Strong, but not too bright, this Pokémon can shatter even a skyscraper with its charging tackles.","A Pokémon with a one-track mind. Once it charges, it won’t stop running until it falls asleep."]],"112":["Rhydon",["Rapidly rotates its horn to bore through bedrock. It swaggers around volcanic regions, protected from the lava's heat by its tough, armorlike hide.","Protected by an armor-like hide, it is capable of living in molten lava of 3,600 degrees Fahrenheit.","It begins walking on its hind legs after evolution. It can punch holes through boulders with its horn."]],"113":["Chansey",["This purehearted Pokémon shares its eggs with the injured.","This species was once very slow. To protect their eggs from other creatures, these Pokémon became able to flee quickly.","The egg ▒▒▒▒ carries is not only delicious but also packed with nutrition. It’s used as a high-class cooking ingredient."]],"114":["Tangela",["It is cloaked entirely in blue vines, preventing any glimpse of its true identity. The vines impart a refreshing sensation when chewed—they're useful as a spice.","The vines of a ▒▒▒▒ have a distinct scent. In some parts of Galar, ▒▒▒▒ vines are used as herbs.","Hidden beneath a tangle of vines that grows nonstop even if the vines are torn off, this Pokémon’s true appearance remains a mystery."]],"115":["Kangaskhan",["There are records of a lost human child being raised by a childless ▒▒▒▒.","Although it’s carrying its baby in a pouch on its belly, ▒▒▒▒ is swift on its feet. It intimidates its opponents with quick jabs.","Raises its young in its belly pouch. Won’t run from any fight to keep its young protected."]],"116":["Horsea",["They swim with dance-like motions and cause whirlpools to form. ▒▒▒▒ compete to see which of them can generate the biggest whirlpool.","▒▒▒▒ makes its home in oceans with gentle currents. If this Pokémon is under attack, it spits out pitch-black ink and escapes.","If it senses any danger, it will vigorously spray water or a special type of ink from its mouth."]],"117":["Seadra",["▒▒▒▒’s mouth is slender, but its suction power is strong. In an instant, ▒▒▒▒ can suck in food that’s larger than the opening of its mouth.","It’s the males that raise the offspring. While ▒▒▒▒ are raising young, the spines on their backs secrete thicker and stronger poison.","Touching the back fin causes numbness. It hooks its tail to coral to stay in place while sleeping."]],"118":["Goldeen",["Its dorsal and pectoral fins are strongly developed like muscles. It can swim at a speed of five knots.","Its dorsal, pectoral, and tail fins wave elegantly in water. That is why it is known as the Water Dancer.","When it is time for them to lay eggs, they can be seen swimming up rivers and falls in large groups."]],"119":["Seaking",["Using its horn, it bores holes in riverbed boulders, making nests to prevent its eggs from washing away.","In autumn, its body becomes more fatty in preparing to propose to a mate. It takes on beautiful colors.","It is the male’s job to make a nest by carving out boulders in a stream using the horn on its head."]],"120":["Staryu",["Fish Pokémon nibble at it, but ▒▒▒▒ isn’t bothered. Its body regenerates quickly, even if part of it is completely torn off.","If you visit a beach at the end of summer, you’ll be able to see groups of ▒▒▒▒ lighting up in a steady rhythm.","As long as the center section is unharmed, this Pokémon can grow back fully even if it is chopped to bits."]],"121":["Starmie",["▒▒▒▒ swims by spinning its body at high speed. As this Pokémon cruises through the ocean, it absorbs tiny plankton.","This Pokémon has an organ known as its core. The organ glows in seven colors when ▒▒▒▒ is unleashing its potent psychic powers.","The center section is named the core. People think it is communicating when it glows in seven colors."]],"122":["Mr. Mime",["The behavior of this clown-like Pokémon reminds one of pantomime. It creates invisible walls using a force emitted from its fingertips.","It’s known for its top-notch pantomime skills. It protects itself from all sorts of attacks by emitting auras from its fingers to create walls.","The broadness of its hands may be no coincidence—many scientists believe its palms became enlarged specifically for pantomiming."]],"123":["Scyther",["The large, wickedly sharp scythes on its forearms are truly fearsome weapons. Prey's attempts to flee are unfailingly thwarted by this Pokémon's nimble motions.","If you come across an area in a forest where a lot of the trees have been cut down, what you’ve found is a ▒▒▒▒’s territory.","As ▒▒▒▒ fights more and more battles, its scythes become sharper and sharper. With a single slice, ▒▒▒▒ can fell a massive tree."]],"124":["Jynx",["The ▒▒▒▒ of Galar often have beautiful and delicate voices. Some of these Pokémon have even gathered a fan base.","In certain parts of Galar, ▒▒▒▒ was once feared and worshiped as the Queen of Ice.","Appears to move to a rhythm of its own, as if it were dancing. It wiggles its hips as it walks."]],"125":["Electabuzz",["Feeds on electrical energy. During sudden showers beneath looming thunderclouds, one can observe ▒▒▒▒ scaling tall trees, where the Pokémon will then wait for lightning to strike.","With the coming of a storm, many of these Pokémon will gather under tall trees and sit there waiting for lightning to strike.","Many power plants keep Ground-type Pokémon around as a defense against ▒▒▒▒ that come seeking electricity."]],"126":["Magmar",["Legend has it that this Pokémon was born from the crater of a volcano. When wounded, it bathes in lava to heal its body, much as one would soak in a hot spring.","These Pokémon’s bodies are constantly burning. ▒▒▒▒ are feared as one of the causes behind fires.","▒▒▒▒ dispatches its prey with fire. But it regrets this habit once it realizes that it has burned its intended prey to a charred crisp."]],"127":["Pinsir",["This Pokémon clamps its pincers down on its prey and then either splits the prey in half or flings it away.","These Pokémon judge one another based on pincers. Thicker, more impressive pincers make for more popularity with the opposite gender.","Grips its prey in its pincers and squeezes hard! It can’t move if it’s cold out, so it lives in warm places."]],"128":["Tauros",["The ▒▒▒▒ of the Galar region are volatile in nature, and they won’t allow people to ride on their backs.","When ▒▒▒▒ begins whipping itself with its tails, it’s a warning that the Pokémon is about to charge with astounding speed.","A rowdy Pokémon with a lot of stamina. Once running, it won’t stop until it hits something."]],"129":["Magikarp",["A feeble, pitiful imbecile of a Pokémon that is nonetheless very hardy. Unperturbed by turbid water, it can be found living in all sorts of places.","This weak and pathetic Pokémon gets easily pushed along rivers when there are strong currents.","It is virtually worthless in terms of both power and speed. It is the most weak and pathetic Pokémon in the world."]],"130":["Gyarados",["I suspect this Pokémon to be the true identity of a dragon written of in ancient texts, which claimed that it razed an entire village with white-hot beams from its maw.","Once it begins to rampage, a ▒▒▒▒ will burn everything down, even in a harsh storm.","It has an extremely aggressive nature. The Hyper Beam it shoots from its mouth totally incinerates all targets."]],"131":["Lapras",["Crossing icy seas is no issue for this cold-resistant Pokémon. Its smooth skin is a little cool to the touch.","A smart and kindhearted Pokémon, it glides across the surface of the sea while its beautiful song echoes around it.","A gentle soul that can understand human speech. It can ferry people across the sea on its back."]],"132":["Ditto",["When it encounters another ▒▒▒▒, it will move faster than normal to duplicate that opponent exactly.","It can reconstitute its entire cellular structure to change into what it sees, but it returns to normal when it relaxes.","When it spots an enemy, its body transfigures into an almost-perfect copy of its opponent."]],"133":["Eevee",["Harbors the potential to evolve into manifold forms. Within ▒▒▒▒ lies the key to the mysteries of Pokémon evolution—I'm certain of it.","Thanks to its unstable genetic makeup, this special Pokémon conceals many different possible evolutions.","It has the ability to alter the composition of its body to suit its surrounding environment."]],"134":["Vaporeon",["Its body’s cellular structure is similar to the molecular composition of water. It can melt invisibly in water.","When ▒▒▒▒’s fins begin to vibrate, it is a sign that rain will come within a few hours.","Its cell structure is similar to water molecules. It melts into the water and becomes invisible."]],"135":["Jolteon",["Bristles its fur into sharp, needlelike points when enraged. One can hear electricity crackle in its breath when it exhales.","It accumulates negative ions in the atmosphere to blast out 10,000-volt lightning bolts.","If it is angered or startled, the fur all over its body bristles like sharp needles that pierce foes."]],"136":["Flareon",["Flames burn within a saclike organ inside this Pokémon. When ▒▒▒▒ inhales, these flames grow in intensity, reaching a mighty 3,000 degrees Fahrenheit.","It stores some of the air it inhales in its internal flame pouch, which heats it to over 3,000 degrees Fahrenheit.","Once it has stored up enough heat, this Pokémon’s body temperature can reach up to 1,700 degrees Fahrenheit."]],"137":["Porygon",["It has no discernible heartbeat and does not seem to draw breath, and yet it appears to function without issue. I cannot even begin to explain this utterly bizarre anomaly.","In recent years, this species has been very helpful in cyberspace. These Pokémon will go around checking to make sure no suspicious data exists.","State-of-the-art technology was used to create ▒▒▒▒. It was the first artificial Pokémon to be created via computer programming."]],"138":["Omanyte",["This Pokémon is a member of an ancient, extinct species. ▒▒▒▒ paddles through water with its 10 tentacles, looking like it’s just drifting along.","Because some ▒▒▒▒ manage to escape after being restored or are released into the wild by people, this species is becoming a problem.","An ancient Pokémon that was recovered from a fossil. It swam by cleverly twisting its 10 tentacles about."]],"139":["Omastar",["▒▒▒▒’s sharp fangs could crush rock, but the Pokémon can attack only the prey that come within reach of its tentacles.","Weighed down by a large and heavy shell, ▒▒▒▒ couldn’t move very fast. Some say it went extinct because it was unable to catch food.","Its sharp beak rings its mouth. Its shell was too big for it to move freely, so it became extinct."]],"140":["Kabuto",["While some say this species has gone extinct, ▒▒▒▒ sightings are apparently fairly common in some places.","This species is almost entirely extinct. ▒▒▒▒ molt every three days, making their shells harder and harder.","A Pokémon that was recovered from a fossil. It used the eyes on its back while hiding on the seafloor."]],"141":["Kabutops",["The cause behind the extinction of this species is unknown. ▒▒▒▒ were aggressive Pokémon that inhabited warm seas.","▒▒▒▒ slices its prey apart and sucks out the fluids. The discarded body parts become food for other Pokémon.","A slim and fast swimmer. It sliced its prey with its sharp sickles and drank the body fluids."]],"142":["Aerodactyl",["▒▒▒▒’s sawlike fangs can shred skin to tatters—even the skin of Steel-type Pokémon.","This is a ferocious Pokémon from ancient times. Apparently even modern technology is incapable of producing a perfectly restored specimen.","A savage Pokémon that died out in ancient times. It was resurrected using DNA taken from amber."]],"143":["Snorlax",["This glutton appears in villages without warning and devours the entirety of their rice granaries—such occurrences have long been counted among the gravest of disasters.","This Pokémon’s stomach is so strong, even eating moldy or rotten food will not affect it.","It is not satisfied unless it eats over 880 pounds of food every day. When it is done eating, it goes promptly to sleep."]],"144":["Articuno",["This Pokémon can control ice at will. ▒▒▒▒ is said to live in snowy mountains riddled with permafrost.","It’s said that this Pokémon’s beautiful blue wings are made of ice. ▒▒▒▒ flies over snowy mountains, its long tail fluttering along behind it.","A legendary bird Pokémon. It freezes water that is contained in winter air and makes it snow."]],"145":["Zapdos",["▒▒▒▒ is a legendary bird Pokémon. It’s said that when ▒▒▒▒ rubs its feathers together, lightning will fall immediately after.","This Pokémon has complete control over electricity. There are tales of ▒▒▒▒ nesting in the dark depths of pitch-black thunderclouds.","This legendary bird Pokémon is said to appear when the sky turns dark and lightning showers down."]],"146":["Moltres",["There are stories of this Pokémon using its radiant, flame-cloaked wings to light up paths for those lost in the mountains.","It’s one of the legendary bird Pokémon. When ▒▒▒▒ flaps its flaming wings, they glimmer with a dazzling red glow.","A legendary bird Pokémon. As it flaps its flaming wings, even the night sky will turn red."]],"147":["Dratini",["This Pokémon was long considered to be no more than a myth. The small lump on a ▒▒▒▒’s forehead is actually a horn that’s still coming in.","▒▒▒▒ dwells near bodies of rapidly flowing water, such as the plunge pools of waterfalls. As it grows, ▒▒▒▒ will shed its skin many times.","Long thought to be a myth, this Pokémon’s existence was only recently confirmed by a fisherman who caught one."]],"148":["Dragonair",["This Pokémon gathers power in the orbs on its tail and controls the weather. When enshrouded by an aura, ▒▒▒▒ has a mystical appearance.","This Pokémon lives in pristine oceans and lakes. It can control the weather, and it uses this power to fly into the sky, riding on the wind.","According to a witness, its body was surrounded by a strange aura that gave it a mystical look."]],"149":["Dragonite",["This Pokémon is known as the Sea Incarnate. Figureheads that resemble ▒▒▒▒ decorate the bows of many ships.","It’s a kindhearted Pokémon. If it spots a drowning person or Pokémon, ▒▒▒▒ simply must help them.","It is said that this Pokémon lives somewhere in the sea and that it flies. However, these are only rumors."]],"150":["Mewtwo",["Its DNA is almost the same as Mew’s. However, its size and disposition are vastly different.","A Pokémon created by recombining Mew’s genes. It’s said to have the most savage heart among Pokémon.","It was created by a scientist after years of horrific gene-splicing and DNA-engineering experiments."]],"151":["Mew",["When viewed through a microscope, this Pokémon’s short, fine, delicate hair can be seen.","▒▒▒▒ is said to possess the genetic composition of all Pokémon. It is capable of making itself invisible at will, so it entirely avoids notice even if it approaches people.","Its DNA is said to contain the genetic codes of all Pokémon, so it can use all kinds of techniques."]],"152":["Chikorita",["It uses the leaf on its head to determine the temperature and humidity. It loves to sunbathe.","A sweet aroma gently wafts from the leaf on its head. It is docile and loves to soak up sun rays.","Its pleasantly aromatic leaf has the ability to check humidity and temperature."]],"153":["Bayleef",["▒▒▒▒’s neck is ringed by curled-up leaves. Inside each tubular leaf is a small shoot of a tree. The fragrance of this shoot makes people peppy.","The buds that ring its neck give off a spicy aroma that perks people up.","A spicy aroma emanates from around its neck. The aroma acts as a stimulant to restore health."]],"154":["Meganium",["The fragrance of ▒▒▒▒’s flower soothes and calms emotions. In battle, this Pokémon gives off more of its becalming scent to blunt the foe’s fighting spirit.","▒▒▒▒’s breath has the power to revive dead grass and plants. It can make them healthy again.","The aroma that rises from its petals contains a substance that calms aggressive feelings."]],"155":["Cyndaquil",["Hails from the Johto region. Though usually curled into a ball due to its timid disposition, it harbors tremendous firepower.","It has a timid nature. If it is startled, the flames on its back burn more vigorously.","It is timid and always curls itself up in a ball. If attacked, it flares up its back for protection."]],"156":["Quilava",["Be careful if it turns its back during battle. It means that it will attack with the fire on its back.","Before battle, it turns its back on its opponent to demonstrate how ferociously its fire blazes.","It intimidates foes with the heat of its flames. The fire burns more strongly when it readies to fight."]],"157":["Typhlosion",["▒▒▒▒ obscures itself behind a shimmering heat haze that it creates using its intensely hot flames. This Pokémon creates blazing explosive blasts that burn everything to cinders.","It has a secret, devastating move. It rubs its blazing fur together to cause huge explosions.","If its rage peaks, it becomes so hot that anything that touches it will instantly go up in flames."]],"158":["Totodile",["Despite the smallness of its body, ▒▒▒▒’s jaws are very powerful. While the Pokémon may think it is just playfully nipping, its bite has enough power to cause serious injury.","Its powerful, well-developed jaws are capable of crushing anything. Even its Trainer must be careful.","It is small but rough and tough. It won’t hesitate to take a bite out of anything that moves."]],"159":["Croconaw",["Once it bites down, it won’t let go until it loses its fangs. New fangs quickly grow into place.","If it loses a fang, a new one grows back in its place. There are always 48 fangs lining its mouth.","It opens its huge jaws wide when attacking. If it loses any fangs while biting, they grow back in."]],"160":["Feraligatr",["▒▒▒▒ intimidates its foes by opening its huge mouth. In battle, it will kick the ground hard with its thick and powerful hind legs to charge at the foe at an incredible speed.","When it bites with its massive and powerful jaws, it shakes its head and savagely tears its victim up.","It usually moves slowly, but it goes at blinding speed when it attacks and bites prey."]],"161":["Sentret",["It stands on its tail so it can see a long way. If it spots an enemy, it cries loudly to warn its kind.","When acting as a lookout, it warns others of danger by screeching and hitting the ground with its tail.","It has a very nervous nature. It stands up high on its tail so it can scan wide areas."]],"162":["Furret",["▒▒▒▒ has a very slim build. When under attack, it can slickly squirm through narrow spaces and get away. In spite of its short limbs, this Pokémon is very nimble and fleet.","It makes a nest to suit its long and skinny body. The nest is impossible for other Pokémon to enter.","The mother puts its offspring to sleep by curling up around them. It corners foes with speed."]],"163":["Hoothoot",["It begins to hoot at the same time every day. Some Trainers use them in place of clocks.","It always stands on one foot. It changes feet so fast, the movement can rarely be seen.","It cries out at the same time every day. A long time ago, people cherished it and considered it a divine messenger sent to tell the time."]],"164":["Noctowl",["When it needs to think, it rotates its head 180 degrees to sharpen its intellectual power.","Its eyes are specially developed to enable it to see clearly even in murky darkness and minimal light.","When it turns its head entirely upside down, you know it’s troubled by something. If you don’t leave it be, it will peck you."]],"165":["Ledyba",["These very cowardly Pokémon join together and use Reflect to protect their nest.","This Pokémon is very sensitive to cold. In the warmth of Alola, it appears quite lively.","They communicate with one another using bodily fluids that give off odors. When they’re angry, their odor smells sour."]],"166":["Ledian",["It flies through the night sky, sprinkling sparkly dust. According to some, if that dust sticks to you, good things will happen to you.","It’s said that the patterns on its back are related to the stars in the night sky, but the details of that relationship remain unclear.","In battle, it throws punches with all four arms. The power of each individual blow is piddly, so it aims to win by quantity rather than quality."]],"167":["Spinarak",["Although the poison from its fangs isn’t that strong, it’s potent enough to weaken prey that gets caught in its web.","With threads from its mouth, it fashions sturdy webs that won’t break even if you set a rock on them.","Some fishermen weave its sturdy thread into nets to catch fish Pokémon."]],"168":["Ariados",["It spews threads from its mouth to catch its prey. When night falls, it leaves its web to go hunt aggressively.","Every night, it wanders around in search of prey, whose movements it restrains by spewing threads before it bites into them with its fangs.","It spins thread from both its rear and its mouth. Then it wraps its prey up in thread and sips their bodily fluids at its leisure."]],"169":["Crobat",["Its hind limbs have become another set of wings. ▒▒▒▒ expertly maneuvers its four wings to dart in exquisite fashion through even the most confined caves without losing any speed.","This Pokémon flaps its four wings skillfully. ▒▒▒▒ can fly through cramped caves without needing to slow down.","Both of its legs have turned into wings. Without a sound, ▒▒▒▒ flies swiftly toward its prey and sinks its fangs into the nape of its target’s neck."]],"170":["Chinchou",["On the dark ocean floor, its only means of communication is its constantly flashing lights.","Its antennae, which evolved from a fin, have both positive and negative charges flowing through them.","▒▒▒▒ blink their shining antennae at one another to claim their respective turf."]],"171":["Lanturn",["This Pokémon flashes a bright light that blinds its prey. This creates an opening for it to deliver an electrical attack.","The light it emits is so bright that it can illuminate the sea’s surface from a depth of over three miles.","It lives far down in the depths of the ocean. It blinds its prey with light, using the moment they’re dazzled to swallow them whole."]],"172":["Pichu",["The electric sacs in its cheeks are small. If even a little electricity leaks, it becomes shocked.","Despite its small size, it can zap even adult humans. However, if it does so, it also surprises itself.","It has electric sacs in its cheeks. When they’re fully charged, ▒▒▒▒ plays very energetically."]],"173":["Cleffa",["In silhouette, they resemble twinkling starlight. When shooting stars rain from the night sky, ▒▒▒▒ gather in numbers and dance as though they are indeed incarnations of the stars.","Because of its unusual, starlike silhouette, people believe that it came here on a meteor.","According to local rumors, ▒▒▒▒ are often seen in places where shooting stars have fallen."]],"174":["Igglybuff",["Taking advantage of the softness of its body, ▒▒▒▒ moves as if bouncing. Its body turns a deep pink when its temperature rises.","▒▒▒▒ loves to sing. Its marshmallow-like body gives off a faint sweet smell.","Left to its own devices, it will constantly practice singing. You should make it take a break so it doesn’t hurt its throat."]],"175":["Togepi",["This ovate creature is frequently mistaken for a moving egg when encountered out in the fields or in the mountains. Its guileless smile soothes the soul.","It is considered to be a symbol of good luck. Its shell is said to be filled with happiness.","The shell seems to be filled with joy. It is said that it will share good luck when treated kindly."]],"176":["Togetic",["No records exist of ▒▒▒▒ being seen in the wilds. Rumors abound that it evolves under the loving care of a trusted human companion, upon whom the Pokémon then bestows great joy.","It grows dispirited if it is not with kind people. It can float in midair without moving its wings.","They say that it will appear before kindhearted, caring people and shower them with happiness."]],"177":["Natu",["Because its wings aren’t yet fully grown, it has to hop to get around. It is always staring at something.","It is extremely good at climbing tree trunks and likes to eat the new sprouts on the trees.","The look in its eyes gives the impression that it’s carefully observing you. If you approach it, ▒▒▒▒ will hop away."]],"178":["Xatu",["This odd Pokémon can see both the past and the future. It eyes the sun’s movement all day.","They say that it stays still and quiet because it is seeing both the past and future at the same time.","While it can see the future, it has no desire to change it, which is probably why it remains motionless at all times."]],"179":["Mareep",["Rubbing its fleece generates electricity. You’ll want to pet it because it’s cute, but if you use your bare hand, you’ll get a painful shock.","Clothing made from ▒▒▒▒’s fleece is easily charged with static electricity, so a special process is used on it.","▒▒▒▒’s fluffy coat of wool rubs together and builds a static charge. The more static electricity is charged, the more brightly the lightbulb at the tip of its tail glows."]],"180":["Flaaffy",["It stores electricity in its fluffy fleece. If it stores up too much, it will start to go bald in those patches.","In the places on its body where fleece doesn’t grow, its skin is rubbery and doesn’t conduct electricity. Those spots are safe to touch.","If its coat becomes fully charged with electricity, its tail lights up. It fires hair that zaps on impact."]],"181":["Ampharos",["Its tail shines bright and strong. It has been prized since long ago as a beacon for sailors.","The light from its tail can be seen from space. This is why you can always tell exactly where it is, which is why it usually keeps the light off.","▒▒▒▒ gives off so much light that it can be seen even from space. People in the old days used the light of this Pokémon to send signals back and forth with others far away."]],"182":["Bellossom",["▒▒▒▒ gather at times and appear to dance. They say that the dance is a ritual to summon the sun.","Plentiful in the tropics. When it dances, its petals rub together and make a pleasant ringing sound.","A ▒▒▒▒ grows flowers more beautifully if it has evolved from a smelly Gloom—the more stinky the better. At night, this Pokémon closes its petals and goes to sleep."]],"183":["Marill",["Even after ▒▒▒▒ swims in a cold sea, its water- repellent fur dries almost as soon as ▒▒▒▒ leaves the water. That’s why this Pokémon is never cold.","This Pokémon uses its round tail as a float. The ball of ▒▒▒▒’s tail is filled with nutrients that have been turned into an oil.","When fishing for food at the edge of a fast-running stream, ▒▒▒▒ wraps its tail around the trunk of a tree. This Pokémon’s tail is flexible and configured to stretch."]],"184":["Azumarill",["These Pokémon create air-filled bubbles. When Azurill play in river
